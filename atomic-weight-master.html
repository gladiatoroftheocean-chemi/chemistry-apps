<style>
:root{--b:#1976D2;--g:#4CAF50;--o:#FF9800;--r:#f44336}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#fff;color:#263238}button,input{font:inherit}.container{max-width:900px;margin:auto;padding:20px;min-height:100vh}.screen{display:none}.screen.active{display:block}.header{padding:30px 20px;border-radius:15px;background:linear-gradient(135deg,var(--b),var(--g));color:white;text-align:center;box-shadow:0 4px 20px #0002;margin-bottom:20px}.header h1{margin:0;font-size:2.2rem}.header p{margin:10px 0 0}.card,.content{padding:30px;background:#fff;border-radius:15px;box-shadow:0 4px 15px #0002;margin-bottom:20px}.intro{max-width:560px;margin:25px auto}.intro label{display:block;color:var(--b);font-weight:bold}.intro input{width:100%;margin:8px 0;padding:12px;border:2px solid #90caf9;border-radius:8px;font-size:1.2rem;letter-spacing:.15em;font-weight:bold}.note{padding:12px;border-radius:8px;border-left:4px solid var(--b);background:#e3f2fd;line-height:1.65}.error{min-height:1.4em;color:#c62828;font-weight:bold}.btn{border:0;border-radius:25px;min-width:120px;padding:12px 24px;font-weight:bold;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.blue{background:var(--b);color:#fff}.green{background:var(--g);color:#fff}.orange{background:var(--o);color:#fff}.gray{background:#666;color:#fff}.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:.9rem;color:#5a6570}.status{font-weight:bold;color:var(--b)}.progress{height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin:8px 0}.progress>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--b),var(--g));transition:.3s}.progress-text{text-align:center;color:var(--b);font-weight:bold;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.stage{position:relative;padding:28px;border:3px solid transparent;border-radius:15px;background:#fff;box-shadow:0 4px 15px #0002;text-align:center;cursor:pointer;transition:.25s}.stage:hover:not(.locked){transform:translateY(-3px);border-color:var(--b);box-shadow:0 8px 25px #0003}.stage h3{margin:10px 0;color:var(--b);font-size:1.35rem}.stage p{margin:0;color:#666;line-height:1.6}.stage.done{border-color:var(--g);background:linear-gradient(135deg,#f1f8e9,#fff)}.stage.locked{opacity:.55;cursor:not-allowed}.badge{position:absolute;top:10px;right:10px;background:var(--g);color:#fff;border-radius:16px;padding:5px 10px;font-size:.75rem;font-weight:bold}.back{margin-bottom:20px}.title{margin:0 0 28px;padding-bottom:10px;border-bottom:3px solid var(--b);color:var(--b);font-size:1.8rem}.problem{padding:30px;border:2px solid #e0e0e0;border-radius:15px;background:white}.problem-title{margin:-30px -30px 24px;padding:15px 20px;border-radius:10px;background:var(--b);color:white;font-weight:bold;font-size:1.25rem}.problem-text{margin-bottom:20px;padding:18px;border-radius:10px;background:#f5f5f5;line-height:1.7;font-size:1.06rem}.step{margin:18px 0;padding:22px;border:2px solid #e0e0e0;border-radius:12px;background:#fafafa}.step-title{display:flex;align-items:center;margin-bottom:15px;color:var(--b);font-size:1.15rem;font-weight:bold}.n{display:grid;place-items:center;width:30px;height:30px;margin-right:10px;border-radius:50%;background:var(--b);color:white}.formula-wrap{overflow-x:auto;padding:4px 0}.formula{min-width:max-content;padding:17px 14px;border:2px solid var(--b);border-radius:10px;background:#fff;text-align:center;font-family:"Courier New",monospace;font-size:1rem;line-height:2.3}.term{display:inline-block;margin:3px 4px;white-space:nowrap}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}.line{width:100%;min-width:58px;height:2px;margin:3px 0;background:#111}.slot{display:inline-block;vertical-align:middle;min-width:52px;min-height:30px;padding:3px 6px;border:2px dashed #ffb74d;border-radius:5px;background:#fff9c4;font:700 14px "Hiragino Kaku Gothic ProN",sans-serif;line-height:1.45;cursor:pointer}.slot.active{border:3px solid var(--b);background:#e3f2fd;box-shadow:0 0 0 3px #90caf966}.slot.filled{border-style:solid;border-color:#90a4ae;background:#f1f8e9;color:#1b5e20}.select-note{min-height:1.4em;color:var(--b);font-weight:bold;font-size:.9rem}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0}.choice{padding:10px 16px;min-height:42px;border:2px solid #2196f3;border-radius:8px;background:#e3f2fd;color:var(--b);font-weight:bold;cursor:pointer}.choice:hover{background:#2196f3;color:#fff}.choice.on{border-color:var(--g);background:var(--g);color:#fff}.num{width:130px;padding:8px;border:2px solid var(--b);border-radius:7px;text-align:center;font-size:1.1rem;font-weight:bold}.feedback,.hint,.explain{display:none;margin-top:14px;padding:15px;border-radius:10px;line-height:1.7}.feedback.show,.hint.show,.explain.show{display:block}.feedback.ok,.explain{border:2px solid var(--g);background:#e8f5e9;color:#1b5e20}.feedback.no{border:2px solid var(--r);background:#ffebee;color:#b71c1c}.feedback.answer,.hint{border:2px solid var(--o);background:#fff3e0;color:#704000}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.result{text-align:center;padding:32px}.fail{border:4px solid var(--r);background:#fff5f6}.cert{position:relative;overflow:hidden;padding:34px 24px;border:7px solid #b87333;background:linear-gradient(145deg,#fffaf4,#fff);text-align:center}.cert:before,.cert:after{content:"✦";position:absolute;top:-32px;font-size:8rem;opacity:.12}.cert:before{left:18px}.cert:after{right:18px}.cert.ag{border-color:#aeb9c4;background:linear-gradient(145deg,#fff,#edf2f6);box-shadow:0 0 28px #bcc7d1}.cert.au{border-color:#e0a71d;background:linear-gradient(145deg,#fffdf0,#fff1b6);box-shadow:0 0 42px #efca51}.cert.pt{border-color:#59616b;background:linear-gradient(145deg,#fff,#e7ebf0 42%,#fff);box-shadow:0 0 50px #9ea9b6}.medal{font-size:4rem}.cert h2{margin:6px;font-size:2.5rem}.cert-info{max-width:500px;margin:18px auto;padding:15px;border-top:1px solid #aeb7c4;border-bottom:1px solid #aeb7c4;line-height:1.8}@media(max-width:600px){.container{padding:10px}.header{padding:25px 15px}.header h1{font-size:1.8rem}.grid{grid-template-columns:1fr}.card,.content,.problem{padding:20px}.problem-title{margin:-20px -20px 20px}.formula{padding:13px 8px;font-size:.92rem}.btns,.nav{flex-direction:column}.btn{width:100%}}
</style></head><body><main class="container">
<section id="start" class="screen active"><div class="header"><h1>⚛️ 原子量マスター</h1><p>段階式で学ぶ 原子量の求め方</p></div><div class="card intro"><h2>学習を始めよう</h2><p>平均の考え方から、同位体の存在比を使った原子量計算までを学びます。</p><label>出席番号（半角数字4桁・必須）<input id="student" inputmode="numeric" maxlength="4" placeholder="例：0123"></label><p class="note">今回は計算の仕組みを理解するため、相対質量と存在比を計算しやすい概数で扱います。</p><p id="startError" class="error"></p><button id="startBtn" class="btn blue">学習を始める</button></div></section>
<section id="home" class="screen"><div class="header"><h1>⚛️ 原子量マスター</h1><p id="homeStudent"></p></div><div class="top"><span id="scoreText" class="status"></span><button id="resetBtn" class="btn gray">最初からやり直す</button></div><div class="progress"><i id="progress"></i></div><p id="progressText" class="progress-text"></p><div id="stageGrid" class="grid"></div><div class="btns"><button id="resultBtn" class="btn green">結果・合格証を見る</button></div></section>
<section id="lesson" class="screen"><button id="backHome" class="btn gray back">← ホームに戻る</button><div class="top"><h1 id="lessonTitle" class="title"></h1><span id="lessonStatus" class="status"></span></div><article id="problem" class="problem"></article><div class="nav"><button id="prevBtn" class="btn gray">← 前の問題</button><button id="nextBtn" class="btn blue">次の問題 →</button></div></section>
<section id="result" class="screen"><button id="resultHome" class="btn gray back">← ホームに戻る</button><div id="resultBox"></div></section>
</main><style>.calc-box{margin:18px 0;padding:18px;border:3px solid var(--o);border-radius:12px;background:linear-gradient(135deg,#fff9e8,#fff1c6);text-align:center}.calc-box h3{margin:0 0 10px;color:#d66c00}.calc-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.calc-input{width:min(100%,360px);padding:10px;border:2px solid var(--o);border-radius:8px;font-family:monospace;font-size:1.05rem}.calc-history{max-width:520px;max-height:110px;overflow:auto;text-align:left;margin:12px auto 0;padding:9px;border-radius:8px;background:#fff;color:#555;font-family:monospace;font-size:.9rem}.step.hidden{display:none}</style><script>
const KEY='atomic-weight-master-canva-v2',V='2.0.0';const stages=[['📚 Lv.0 基本事項','日本語の公式と、存在比の「100」の意味を確認',['q0','q1']],['🎯 Lv.1 概念理解','クラス平均から炭素の原子量へつなぐ',['q2','q3','q4','q5']],['📝 Lv.2 計算練習','銅・ホウ素・塩素を段階的に計算',['q6','q7','q8','q9','q10']],['🏆 Lv.3 応用問題','3種類の同位体で総合問題',['q11']]];
const F=(title,text,choices,ans,hint,explain,stage)=>({type:'fraction',title,text,choices,ans,hint,explain,stage});
var storageIssue=null,saveIssue=false,loadedStored=false;
const qs=[
F('問題0-1：原子量の公式を完成させよう','以下の空欄に適切な用語を選び、原子量の公式を完成させましょう。',['Aの相対質量','Bの相対質量','Aの存在比','Bの存在比','100'],['Aの相対質量','Aの存在比','100','Bの相対質量','Bの存在比','100'],'まずは「相対質量 × 存在比の割合」という一組を考えよう。','原子量は、各同位体の相対質量に、その同位体の存在比を掛けて足した加重平均です。AとBの順番は逆でも正解です。',0),
{type:'single',title:'問題0-2：分母の「100」の意味を理解しよう',text:'原子量の式で、存在比を100で割るときの「100」は何を表していますか。',choices:['各同位体の個数','全体を100%とする基準','元素の原子番号','計算に使う決まった数字'],answer:'全体を100%とする基準',hint:'存在比は「70%」のように百分率で表されます。%の意味を思い出そう。',explain:'正解は「全体を100%とする基準」です。70%は0.70という割合を表します。',stage:0},
F('問題1-1：クラス平均の式を完成させよう','クラス30人。男子20人の平均身長は170 cm、女子10人の平均身長は160 cmです。クラス平均の式を完成させましょう。',['170','160','20','10','30'],['170','20','30','160','10','30'],'「平均身長 × 人数の割合」の二つの項に分けて考えよう。','組み立てた式を計算すると166.7 cmです。人数の多い男子の平均身長170 cmに近い値になります。',1),
F('問題1-2：クラス平均を日本語で表そう','同じクラス平均の式を、日本語の部品で完成させましょう。',['男子の平均身長','女子の平均身長','男子の人数','女子の人数','クラスの人数'],['男子の平均身長','男子の人数','クラスの人数','女子の平均身長','女子の人数','クラスの人数'],'数値の代わりに、それぞれが何を表すかを考えよう。','平均は「各グループの値 × そのグループの全体に占める割合」の和です。',1),
{type:'single',title:'問題1-3：分母は何を表す？',text:'クラス平均の式で、分母の「クラスの人数」は何を表していますか。',choices:['男子だけ','女子だけ','全体','平均身長'],answer:'全体',hint:'20人と10人の割合を足すと、どんな量になりますか。',explain:'分母は全体を表します。20/30と10/30は、二つを足すと1になる「重み」です。',stage:1},
F('問題1-4：炭素の原子量を日本語で組もう','相対質量12.0の¹²Cは99%、相対質量13.0の¹³Cは1%存在します。炭素の原子量の式を、日本語の部品で完成させましょう。',['¹²Cの相対質量','¹³Cの相対質量','¹²Cの存在比','¹³Cの存在比','100'],['¹²Cの相対質量','¹²Cの存在比','100','¹³Cの相対質量','¹³Cの存在比','100'],'クラス平均の「値」と「人数」を、同位体では何に置き換えるか考えよう。','原子量でも、クラス平均と同じく「値 × 全体に占める割合」を足します。',1),
F('問題1-5：炭素の原子量を数値で組もう','¹²Cは相対質量12.0、存在比99%。¹³Cは相対質量13.0、存在比1%です。数値の式を完成させましょう。',['12.0','13.0','99','1','100'],['12.0','99','100','13.0','1','100'],'同位体の相対質量と存在比を、同じ同位体どうしで組にしよう。','組み立てた式を計算すると12.01です。99%を占める¹²Cに非常に近い原子量になります。',1),
F('問題2-1：銅の原子量の式を組もう','⁶³Cuは相対質量63.0、存在比70%。⁶⁵Cuは相対質量65.0、存在比30%です。数値の式を完成させましょう。',['63.0','65.0','70','30','100'],['63.0','70','100','65.0','30','100'],'炭素と同じ形です。相対質量と存在比の対応を確認しよう。','式は、相対質量に対応する存在比の分数を掛けた二つの項からなります。',2),
{type:'number',title:'問題2-2：銅の原子量を計算しよう',text:'直前に組み立てた銅の式を計算し、小数第1位まで入力しましょう。',answer:63.6,tol:.01,hint:'二つの項を別々に計算してから足すと整理しやすいです。答えは63.0と65.0の間になります。',explain:'二つの項は44.1と19.5です。合計は63.6です。',stage:2},
{type:'number',title:'問題2-3：ホウ素の存在比を求めよう',text:'ホウ素の原子量は10.8です。相対質量10.0の¹⁰Bをx%、相対質量11.0の¹¹Bを(100−x)%とするとき、¹⁰Bの存在比xを入力しましょう。',answer:20,tol:.01,suffix:'%',hint:'10.8は10.0と11.0のどちらに近いか考えよう。¹¹Bの方が多いはずです。',explain:'原子量の加重平均の式を解くとx=20です。¹⁰Bは20%、¹¹Bは80%です。',stage:2},
{type:'simple',title:'問題2-4：塩素の式を組もう',text:'相対質量35.0の³⁵Clと相対質量37.0の³⁷Clの存在比は3：1です。割合は0.75と0.25になります。式を完成させましょう。',choices:['35.0','37.0','0.75','0.25','3','1'],ans:['35.0','0.75','37.0','0.25'],hint:'3：1のうち、3/4=0.75が³⁵Cl、1/4=0.25が³⁷Clです。',explain:'35.0×0.75 + 37.0×0.25 と組みます。多い³⁵Clの35.0に近い値になります。',stage:2},
{type:'number',title:'問題2-5：塩素の原子量を計算しよう',text:'35.0×0.75 + 37.0×0.25 を計算して入力しましょう。',answer:35.5,tol:.01,hint:'35.0×0.75と37.0×0.25を別々に計算しましょう。',explain:'35.0×0.75=26.25、37.0×0.25=9.25。合計は35.5です。',stage:2},
{type:'combo',title:'最終問題：マグネシウムの原子量を組み立てよう',text:'²⁴Mgは80%、²⁵Mgは10%、²⁶Mgは10%存在します。相対質量はそれぞれ24、25、26です。式を完成させ、原子量を小数第1位まで入力しましょう。',choices:['24','25','26','0.80','0.10'],ans:['24','0.80','25','0.10','26','0.10'],answer:24.3,tol:.01,hint:'三つの同位体すべてについて「相対質量×割合」を作ります。0.80+0.10+0.10=1です。',explain:'24×0.80 + 25×0.10 + 26×0.10 = 19.2+2.5+2.6=24.3です。',stage:3}];qs.forEach((q,i)=>q.id='q'+i);
let state={v:V,student:'',slots:{},selected:null,answers:{},first:{},shown:{},hints:{},stage:0,index:0};const $=x=>document.getElementById(x);function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.v===V)state={...state,...x}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo({top:0,behavior:'smooth'})}function by(id){return qs.find(q=>q.id===id)}function done(q){return !!state.answers[q.id]||!!state.shown[q.id]}function sq(s){return stages[s][2].map(by)}function sd(s){return sq(s).every(done)}function score(){return Object.values(state.first).filter(Boolean).length}function q(){return sq(state.stage)[state.index]}function frac(a,b){return '<span class="fraction"><span>'+a+'</span><span class="line"></span><span>'+b+'</span></span>'}function slot(x,n){let v=state.slots[x.id]?.[n]||'?',a=state.selected?.id===x.id&&state.selected.n===n;return '<span class="slot '+(v!=='?'?'filled ':'')+(a?'active':'')+'" data-slot="'+n+'">'+v+'</span>'}function formula(x){if(x.type==='fraction')return '<div class="formula-wrap"><div class="formula">原子量 ＝ <span class="term">'+slot(x,0)+' × '+frac(slot(x,1),slot(x,2))+'</span> ＋ <span class="term">'+slot(x,3)+' × '+frac(slot(x,4),slot(x,5))+'</span></div></div>';if(x.type==='simple')return '<div class="formula-wrap"><div class="formula">塩素の原子量 ＝ <span class="term">'+slot(x,0)+' × '+slot(x,1)+'</span> ＋ <span class="term">'+slot(x,2)+' × '+slot(x,3)+'</span></div></div>';return '<div class="formula-wrap"><div class="formula">Mgの原子量 ＝ <span class="term">'+slot(x,0)+' × '+slot(x,1)+'</span> ＋ <span class="term">'+slot(x,2)+' × '+slot(x,3)+'</span> ＋ <span class="term">'+slot(x,4)+' × '+slot(x,5)+'</span></div></div>'}function chooser(x){return '<div class="select-note">'+(state.selected?.id===x.id?'選択中の空欄に入れる候補を選んでください':'① 空欄を選んでから、② 候補を選んでください')+'</div><div class="choices">'+x.choi /* 2.2: 全13問の各レベルと特別画面の対応をそろえる。旧Lv.2の記録だけを安全に初期化する。 */
function load(){storageIssue=null;loadedStored=false;let raw;try{raw=localStorage.getItem(KEY)}catch(e){saveIssue=true;return}if(raw===null)return;try{let x=JSON.parse(raw);if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('形式が不正です');state={...state,...x};loadedStored=true}catch(e){storageIssue='以前の記録を安全に読み込めません。記録は削除していません。内容を確認できないため、続けるには「記録を初期化して始める」を選んでください。'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveIssue=false}catch(e){saveIssue=true;showSaveWarning()}}
function remapRecord(source,map,valid){let out={};if(!source||typeof source!=='object'||Array.isArray(source))return out;Object.keys(source).forEach(key=>{let target=map[key]||key;if(valid.indexOf(target)!==-1)out[target]=source[key]});return out}
function migrateSavedState(){if(!loadedStored||state.v==='2.2.0')return;let map={q6:'carbonCalc',q7:'q6',q8:'copperCalc',q9:'q8',q10:'chlorineFormula',q11:'chlorineCalc',q12:'magnesium'},valid=['q0','q1','q2','q3','q4','q5','carbonCalc','q6','copperCalc','q8','chlorineFormula','chlorineCalc','magnesium'],legacyStages=[['q0','q1'],['q2','q3','q4','q5'],['q6','q7','q8','q9','q10'],['q11']];let oldId=legacyStages[state.stage]?.[state.index],currentId=map[oldId]||oldId;state.slots=remapRecord(state.slots,map,valid);state.answers=remapRecord(state.answers,map,valid);state.first=remapRecord(state.first,map,valid);state.shown=remapRecord(state.shown,map,valid);state.hints=remapRecord(state.hints,map,valid);if(state.selected&&typeof state.selected==='object'){let target=map[state.selected.id]||state.selected.id;state.selected=valid.indexOf(target)!==-1?{...state.selected,id:target}:null}else state.selected=null;let finalStages=[['q0','q1'],['q2','q3','q4','q5','carbonCalc'],['q6','copperCalc','q8','chlorineFormula','chlorineCalc'],['magnesium']],found=null;finalStages.forEach((items,stage)=>{let index=items.indexOf(currentId);if(index!==-1)found={stage,index}});if(found){state.stage=found.stage;state.index=found.index}else{state.stage=0;state.index=0}state.v='2.2.0';save()}
function showSaveWarning(){if(!saveIssue)return;let id='saveWarning',old=$(id);if(old)return;let el=document.createElement('div');el.id=id;el.className='error';el.textContent='途中保存できないため、この画面を閉じず、結果画面を撮影してください。';document.body.prepend(el)}
function showStorageRecovery(){if(!storageIssue)return;show('start');$('startError').innerHTML=storageIssue+'<br><button id="clearBrokenRecord" class="btn gray" type="button">記録を初期化して始める</button>';$('clearBrokenRecord').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){saveIssue=true;showSaveWarning();return}storageIssue=null;loadedStored=false;state={v:'2.2.0',student:'',slots:{},selected:null,answers:{},first:{},shown:{},hints:{},stage:0,index:0};$('student').value='';$('startError').textContent='記録を初期化しました。出席番号を入力して始めてください。'}}
const correctedVersion='2.2.0';
if(!storageIssue)migrateSavedState();
qs[6].id='carbonCalc';qs[7].id='q6';qs[8].id='copperCalc';qs[9].id='q8';qs[10].id='chlorineFormula';qs[11].id='chlorineCalc';qs[12].id='magnesium';
stages[1][2]=['q2','q3','q4','q5','carbonCalc'];
stages[2][2]=['q6','copperCalc','q8','chlorineFormula','chlorineCalc'];
stages[3][2]=['magnesium'];
document.addEventListener('input',e=>{if(e.target.id==='cc'){state.copperFinal=e.target.value;save()}});
const copperCorrectFinal=copperPage;copperPage=function(x){copperCorrectFinal(x);if($('cc'))$('cc').value=state.copperFinal||'';if((state.copperStep||0)>=2)$('cfinal').onclick=()=>{if(Math.abs(num($('cc').value)-63.6)<.01){state.answers.copperCalc=true;if(state.first.copperCalc===undefined)state.first.copperCalc=true;state.copperStep=3;save();setFeed('f3','○ 完璧！銅の原子量は63.6です。','ok')}else setFeed('f3','× 44.1と19.5を足しましょう。','no')}};
if(state.student)home();

/* 加重平均は二つの項を入れ替えても同じ値になる。塩素の式でもその順序を正解扱いにする。 */
const sameWithOrder=same;same=function(x){let result=sameWithOrder(x);if(result||x.type!=='simple')return result;let a=state.slots[x.id]||[],r=[x.ans[2],x.ans[3],x.ans[0],x.ans[1]];return a.length===r.length&&a.every((v,i)=>v===r[i])};

/* 特別問題から通常問題へ戻ったら、「次の問題」ボタンを通常の進行に戻す。 */
const lessonWithNext=lesson;lesson=function(){lessonWithNext();let current=q();if(current.id!=='q6'&&current.id!=='q8'){$('prevBtn').onclick=()=>{if(state.index>0){state.index--;lesson()}};$('nextBtn').onclick=()=>{if(state.index<sq(state.stage).length-1){state.index++;lesson()}else home()}}};

/* 三つの「相対質量 × 割合」の組も、組を崩さなければ任意の順で正解。 */
const sameWithPairs=same;same=function(x){let result=sameWithPairs(x);if(result||x.type!=='combo')return result;let a=state.slots[x.id]||[];if(a.length!==x.ans.length)return false;let pairs=values=>values.reduce((out,v,i)=>{if(i%2===0)out.push(v+'×'+values[i+1]);return out},[]).sort();let actual=pairs(a),expected=pairs(x.ans);return actual.every((v,i)=>v===expected[i])};

/* 数値を求める通常問題には、紙を使わず確認できるボタン式計算機を表示する。 */
const lessonWithCalculator=lesson;lesson=function(){lessonWithCalculator();let current=q();if(['number','combo'].includes(current.type)&&!$('calcInput')){let intro=document.querySelector('.problem-text');if(intro){intro.insertAdjacentHTML('afterend',calcBox());bindCalc()}}};
/* 新規開始も移行後と同じ保存形式で記録する。 */
$('startBtn').onclick=()=>{let n=$('student').value.trim();if(!/^\d{4}$/.test(n)){$('startError').textContent='出席番号は半角数字4桁で入力してください。';return}state.student=n;state.v=correctedVersion;save();home()};
showStorageRecovery();
if(saveIssue)showSaveWarning();
</script></body></html>
