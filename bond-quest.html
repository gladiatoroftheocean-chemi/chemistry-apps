tificate .award{color:var(--award);font-size:1.7rem}.certificate .record{max-width:600px;margin:24px auto;text-align:left;background:#08112699;padding:16px 24px;border-radius:12px}.record div{display:flex;justify-content:space-between;gap:15px;border-bottom:1px dashed #65718a;padding:9px 0}.record div:last-child{border:0}.certificate .praise{font-family:serif;font-size:1.08rem;max-width:640px;margin:20px auto}.certificate.pt{box-shadow:0 0 45px #b7d6ff44}.spark{position:absolute;pointer-events:none;color:var(--award);animation:shine 3s infinite}.error{color:#ffb0b8}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#243450;border:1px solid #d5bb7b;padding:10px 20px;border-radius:8px;z-index:9;max-width:90vw}footer{text-align:center;color:#9eacc5;font-size:.75rem;padding:18px}dialog{width:min(900px,94vw);max-height:88vh;background:#111c33;color:var(--ink);border:2px solid #c4ad79;border-radius:15px;padding:25px}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.result-actions{margin:28px 0}.stepdots{letter-spacing:.2em;color:var(--gold)}@keyframes float{50%{transform:translateY(-8px)}}@keyframes shine{50%{opacity:.3}}@media(max-width:760px){header{padding:13px 16px}header strong{font-size:.85rem}main{padding:24px 15px 60px}.start-grid,.battle{grid-template-columns:1fr}.kingdoms{grid-template-columns:repeat(2,1fr)}.panel{padding:20px}.guardian{display:flex;align-items:center;text-align:left;gap:15px;padding:9px 15px}.guardian svg{width:105px;height:110px;flex-shrink:0}.guardian h3{margin:0}.guardian .quote{margin:4px 0}.hero{padding-top:10px}.hero-art{height:140px}.record div{font-size:.9rem}.choice{padding:12px}.certificate h1{font-size:2.3rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{body{background:white;color:black}body:before,header,footer,.no-print,dialog, const KINGDOMS=[['金属の鍛冶王国','金属','鍛冶のゴーレム','⚒','#ffb57c','自由電子が、王国の結び付きを守る。'],['イオンの双塔','イオンからなる物質','双極の番人','⚡','#f4d58b','正と負。その引力と反発を見抜け。'],['分子の霧の森','分子からなる物質','霧の精霊','☘','#80daba','分子の中と、分子の間を見分けよう。'],['共有結晶の山岳神殿','共有結合結晶','結晶の竜','◇','#9cc9ff','つながり方が、物質の性質を決める。'],['物質分類の魔王城','総合比較','分類の魔王','♛','#d4b7ff','四つの知識を結び、物質の正体を示せ。']];
// Each entry: question, correct answer, three distractors, three hints, explanation, misconception, diagram.
const RAW=[
['金属銅 Cu の構成粒子と、その結び付きとして正しいものは？','Cu原子どうしが金属結合で結び付く','Cu分子どうしが分子間力で結び付く','Cu⁺とCu⁻がイオン結合で結び付く','Cu原子どうしが分子間力で結び付く',['Cuは金属元素です。','銅は、独立したCu分子の集まりではありません。','価電子が結晶全体に広がり、自由電子になります。'],'教科書の分類では、構成粒子は金属原子、結び付きは金属結合です。結合のしくみを詳しく見ると、正の電荷をもつ金属イオンと自由電子との静電気的な引力が結晶を保っています。','Cu⁺とCu⁻が交互に並ぶわけではありません。','metal'],
['銅が固体のまま電気を通す理由は？','自由電子が結晶中を移動できるから','Cu⁺が結晶中を自由に移動するから','Cu原子そのものが流れて移動するから','水に溶かす必要があるから',['電気を通すには、電荷をもつ粒子の移動が必要です。','固体では原子の位置は大きく変わりません。','金属には結晶中を移動できる電子があります。'],'金属の自由電子が電荷を運ぶため、固体でも電気を通します。金属原子の並びが流れていくわけではありません。','イオン結晶の水溶液で電荷を運ぶのはイオン。銅の固体では自由電子です。','metal'],
['金属をたたいて薄く広げたり、引き伸ばして線にしたりできる理由は？','原子の層がずれても、金属結合が保たれるから','金属原子が分子に変化するから','結合がすべて切れ、原子がばらばらになるから','陽イオンと陰イオンが交互に入れ替わるから',['薄く広げられる性質は展性、線にできる性質は延性です。','力を加えると原子の層がずれます。','層がずれても、自由電子による引力は働きます。'],'原子の層がずれても金属イオンと自由電子との引力が保たれるため、形を変えられます。展性・延性は金属の代表的な性質です。','イオン結晶では、層のずれで同符号のイオンが近づくと反発して割れます。','metal'],
['金属の融点について、正しい説明は？','融点には幅があり、高い金属も低い金属もある','金属の融点はすべて1000 ℃以上である','金属はすべて常温で固体である','金属は分子間力で集まるため、すべて融点が低い',['金属の種類によって性質は異なります。','水銀は常温で液体です。','タングステンの融点は高く、水銀の融点は低いです。'],'金属結合の強さには幅があります。タングステンのような高融点の金属も、水銀のような低融点の金属もあります。','「金属＝必ず高融点」と決めつけず、物質ごとの違いも確認します。','compare'],
['固体の塩化ナトリウム NaCl の構成粒子と結び付きは？','Na⁺とCl⁻がイオン結合している','Na原子とCl原子が独立した分子をつくる','NaCl分子どうしが分子間力で集まる','Na原子どうしが金属結合している',['Naは電子を失い、Clは電子を受け取ります。','生じる粒子はNa⁺とCl⁻です。','異符号のイオンどうしの静電気的な引力です。'],'Na⁺とCl⁻が規則正しく並び、イオン結合で結晶をつくります。NaClは、イオンの個数比を1：1で表した組成式です。','固体中に独立したNaCl分子があるわけではありません。','ionic'],
['Mg²⁺とCl⁻からできる物質の組成式は？','MgCl₂','MgCl','Mg₂Cl','Mg₂Cl₃',['全体の電荷が0になる比を考えます。','Mg²⁺1個の電荷は＋2です。','Cl⁻が2個なら、−1×2＝−2です。'],'Mg²⁺：Cl⁻＝1：2なら、(+2)+2×(−1)=0です。最も簡単な整数比で表し、MgCl₂となります。','イオンの電荷をそのまま右下へ写すのではなく、電荷の合計を確認しましょう。','ratio'],
['塩化ナトリウムが電気を通す状態は？','融解した液体と、水溶液','固体のときだけ','固体と水溶液だけ（液体は通さない）','固体・液体・水溶液のすべて',['電荷を運ぶ粒子が動けるかを考えます。','固体ではイオンが結晶内に固定されています。','融解した液体や水溶液ではイオンが移動できます。'],'固体はイオンが自由に移動できないため通電しません。加熱して融かした液体と、水に溶かした水溶液ではイオンが移動でき、電気を通します。','「融ける」は加熱による融解、「溶ける」は水などへの溶解です。','ionic'],
['イオン結晶が硬い一方で、もろく割れやすい理由は？','層のずれで同符号のイオンが近づき、反発するから','分子間力だけで集まっているから','自由電子が逃げるから','構成粒子がすべて気体になるから',['異符号のイオンは引き合い、同符号は反発します。','外から力を加えるとイオンの並びがずれます。','＋どうし、−どうしが向かい合うとどうなるでしょう。'],'通常は異符号のイオン間の引力で結晶が保たれています。層がずれて同符号どうしが近づくと反発し、結晶が割れます。','金属の展性・延性とは、粒子の結び付き方が違います。','ionic'],
['ドライアイスの昇華で、CO₂分子どうしが離れるときに打ち勝つ引力は？','CO₂分子間に働く分子間力','CO₂分子内のCとOの共有結合','Na⁺とCl⁻のイオン結合','金属イオンと自由電子の間の引力',['ドライアイスは固体のCO₂です。','気体になってもCO₂分子のままです。','分子の中の結合を保ち、分子と分子の距離が広がります。'],'熱を受け取ると、分子が分子間力に打ち勝って離れます。CO₂分子内の共有結合は切れません。ドライアイスは1気圧では液体を経ず、固体から気体になります。','状態変化と化学変化を区別しましょう。「分子間力が弱い」だけでは、液体を経ない理由の説明にはなりません。','molecule'],
['ヨウ素やナフタレンなどの分子結晶について、一般的な性質として正しいものは？','融点が低いものが多く、固体は電気をほとんど通さない','どれも金属のように展性・延性に富む','固体中をイオンが自由に移動して通電する','どれもダイヤモンドのように非常に硬い',['構成粒子は分子です。','分子と分子を結び付けるのは分子間力です。','固体中には自由に移動して電荷を運ぶ粒子がほとんどありません。'],'分子間力は分子内の共有結合に比べて弱く、分子結晶は融点が低いものが多くなります。通常、固体は電気をほとんど通しません。','分子からなる物質でも、水に溶けてイオンを生じると水溶液は通電する場合があります。','molecule'],
['同じ圧力で比べたとき、F₂、Cl₂、Br₂、I₂で沸点が最も高いものは？','I₂','F₂','Cl₂','Br₂',['4つは同じような構造の二原子分子です。','この系列では、分子量が大きいほど電子数も多くなります。','この系列では、電子数が多いほど分子間力が強くなる傾向があります。'],'この系列ではI₂の分子間力が最も強く、分子を引き離すのに多くのエネルギーが必要です。そのため沸点はF₂＜Cl₂＜Br₂＜I₂の順です。','分子量だけで、あらゆる物質の沸点を決められるわけではありません。ここでは似た構造の系列を比較しています。','halogen'],
['固体のヨウ素 I₂ について正しい説明は？','I₂分子が分子間力で集まった分子結晶である','I⁺とI⁻からなるイオン結晶である','すべてのI原子が共有結合で連なった結晶である','自由電子で結び付いた金属結晶である',['I₂はヨウ素原子2個からなる分子です。','固体でもI₂分子というまとまりは残ります。','分子どうしの間に分子間力が働きます。'],'I₂分子内のIとIは共有結合し、I₂分子どうしは分子間力で集まります。構成粒子が分子なので、固体は分子結晶です。','「共有結合を含む」だけで共有結合結晶と判断しないでください。独立した分子があるかが重要です。','molecule'],
['ダイヤモンドと石英（SiO₂）の構成粒子と結び付きは？','原子が共有結合で立体的に連なっている','分子が分子間力だけで集まっている','陽イオンと陰イオンがイオン結合している','金属原子が金属結合している',['独立した小さな分子の集まりではありません。','多くの原子が連続してつながっています。','電子対を共有する結合が結晶中に広がっています。'],'ダイヤモンドと石英は共有結合結晶です。原子が共有結合で立体的につながり、独立した分子をつくりません。','共有結合結晶の黒鉛では、共有結合は主に平面状の層内に広がっています。','network'],
['石英をSiO₂という組成式で表す理由は？','独立した分子ではなく、SiとOが1：2の個数比で連なるから','独立したSiO₂分子が多数集まっているから','Si²⁺とO²⁻が1：1で並ぶから','Siが金属結合で集まるから',['石英は共有結合結晶です。','化学式は、1個の分子を数えているわけではありません。','結晶全体のSi原子とO原子の最も簡単な個数比です。'],'石英には独立したSiO₂分子がなく、SiとOが共有結合で連なっています。Si：O＝1：2を示すSiO₂は組成式です。','CO₂は分子式、SiO₂は組成式。見た目の添字が似ていても意味が違います。','network'],

['黒鉛が電気を通し、やわらかい理由は？','層内を移動できる電子があり、層どうしはずれやすいから','黒鉛は独立した分子だけからなるから','イオンが固体の中を自由に移動するから','黒鉛は自由電子だけでできた金属だから',['黒鉛も炭素からなる共有結合結晶です。','炭素原子は平面状の層をつくります。','電気伝導は層内の電子、やわらかさは層間の結び付きに注目します。'],'層内を移動できる電子があるため通電します。一方、層と層の間は比較的弱い力で結び付いており、層がずれやすいためやわらかい性質を示します。','「共有結合結晶はすべて電気を通さず硬い」と一律に扱わず、黒鉛を区別します。','graphite'],
['Cu／NaCl／I₂／SiO₂（石英）の順に、正しい分類は？','金属／イオンからなる物質／分子からなる物質／共有結合結晶','金属／分子からなる物質／イオンからなる物質／共有結合結晶','イオンからなる物質／金属／分子からなる物質／共有結合結晶','金属／イオンからなる物質／共有結合結晶／分子からなる物質',['4つの構成粒子を思い出しましょう。','Cuは金属原子、NaClはNa⁺とCl⁻です。','I₂は分子、石英は原子が連続してつながった結晶です。'],'Cuは金属、NaClはイオンからなる物質、I₂は分子からなる物質、石英は共有結合結晶です。','固体であることだけでは分類できません。構成粒子と結び付きをセットで判断します。','compare'],
['金属／イオン結晶／分子結晶／共有結合結晶の順に、粒子間の結び付きは？','金属結合／イオン結合／分子間力／共有結合','金属結合／イオン結合／共有結合／分子間力','共有結合／分子間力／金属結合／イオン結合','分子間力／金属結合／イオン結合／共有結合',['分類名だけでなく、構成粒子にも注目します。','分子結晶の構成粒子は分子です。','分子内の共有結合と、分子間の分子間力を区別します。'],'金属結合、イオン結合、分子間力、共有結合の順です。分子結晶では分子の内部に共有結合があっても、分子どうしを結ぶのは分子間力です。','「分子結晶」と「共有結合結晶」を入れ替えないことがポイントです。','compare'],
['次のうち、分子式で表されるものは？','I₂','Cu','NaCl','SiO₂（石英）',['分子式は1個の分子に含まれる原子の種類と数を示します。','独立した分子が存在するかを考えます。','ヨウ素はI原子2個からなる分子です。'],'I₂はヨウ素の分子式です。NaClとSiO₂は組成式です。Cuも教科書の分類では組成式として扱い、単体の金属なので元素記号1つで表します。','元素記号と組成式を、互いに排他的な分類として扱わないようにしましょう。','compare'],
['P〜Sは4分類に1つずつ対応します。正しい組合せは？\nP：固体で通電し、線に引き伸ばせる。\nQ：固体では通電せず、融解した液体ではイオンが電荷を運ぶ。\nR：独立した分子からなり、低融点で固体は通電しない。\nS：原子が立体的に共有結合し、硬く高温まで構造を保つ。','P＝金属／Q＝イオン／R＝分子／S＝共有結合結晶','P＝イオン／Q＝金属／R＝分子／S＝共有結合結晶','P＝金属／Q＝分子／R＝イオン／S＝共有結合結晶','P＝金属／Q＝イオン／R＝共有結合結晶／S＝分子',['電荷を運ぶ粒子と、構成粒子に注目しましょう。','Pは自由電子と延性、Qは移動するイオンです。','Rは分子間力、Sは立体的な共有結合のつながりです。'],'Pは金属、Qはイオンからなる物質、Rは分子からなる物質、Sは共有結合結晶です。性質から粒子と結び付きを逆向きに考えれば、分類できます。','水溶液が通電するという性質だけでイオン結晶とは断定できません。複数の手掛かりを組み合わせます。','compare']

const QUESTIONS=RAW.map((r,i)=>({id:i,area:Math.floor(i/4),text:r[0],options:r.slice(1,5),hints:r[5],explanation:r[6],caution:r[7],diagram:i===8?'co2':r[8]}));
const KEY='bond-quest-v1';let state=null,screen='home',current=0,review=false,saveError=false;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rich(s){return esc(s).replace(/共有結合結晶|共有結合|金属結合|自由電子|展性|延性|イオン結合|陽イオン|陰イオン|分子間力|分子結晶|分子式|組成式/g,w=>'<span class="term-'+(/共有/.test(w)?'cov':/金属|自由|展性|延性/.test(w)?'metal':/イオン/.test(w)?'ion':/分子/.test(w)?'mol':'key')+'">'+w+'</span>').replace(/\n/g,'<br>')}
function shuffle(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(id){return {v:1,id,started:new Date().toISOString(),finished:null,order:QUESTIONS.map(shuffle),answers:Array(20).fill(null),mastered:Array(20).fill(false),hints:Array(20).fill(0),reviewHints:Array(20).fill(0),reviewAttempts:Array(20).fill(0)}}
function valid(s){return s&&s.v===1&&/^\d{4}$/.test(s.id)&&['answers','mastered','hints','reviewHints','reviewAttempts','order'].every(k=>Array.isArray(s[k])&&s[k].length===20)&&s.answers.every(x=>x===null||Number.isInteger(x)&&x>=0&&x<4)&&s.mastered.every(x=>typeof x==='boolean')&&s.hints.concat(s.reviewHints).every(x=>Number.isInteger(x)&&x>=0&&x<=3)&&s.reviewAttempts.every(x=>Number.isInteger(x)&&x>=0)&&s.order.every(a=>Array.isArray(a)&&[...a].sort().join('')==='0123')}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveError=false}catch(e){saveError=true;toast('この環境では自動保存できません。閉じる前に結果を撮影してください。')}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4500)}
function count(){return state.answers.filter(x=>x!==null).length}function initial(){return state.answers.filter(x=>x===0).length}function score(){return state.mastered.filter(Boolean).length}function complete(){return count()===20}function nextUnanswered(){return state.answers.findIndex(x=>x===null)}

function table(){return '<div class="tablewrap"><table><thead><tr><th>比較の視点</th>'+KINGDOMS.slice(0,4).map(k=>'<th>'+k[1]+'</th>').join('')+'</tr></thead><tbody>'+[['代表例','Cu・Fe・Al','NaCl・MgCl₂','I₂・CO₂・ナフタレン','ダイヤモンド・SiO₂・黒鉛'],['構成粒子','金属原子','陽イオン・陰イオン','分子','原子'],['粒子間の結び付き','金属結合','イオン結合','分子間力（分子内は共有結合）','共有結合'],['化学式','組成式（元素記号1つ）','組成式','分子式','組成式'],['融点','高低さまざま','高いものが多い','低いものが多い','非常に高いと整理'],['電気伝導性','固体でもあり','固体はなし。融解した液体・水溶液はあり','通常、固体はほとんどなし','通常はなし。黒鉛はあり'],['その他','展性・延性','硬いがもろい','やわらかく、もろいものが多い','一般に硬い。黒鉛はやわらかい']].map(row=>'<tr>'+row.map((x,i)=>'<'+(i?'td':'th')+'>'+rich(x)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</tbody></table></div><p class="muted">一般的な傾向を整理した表です。物質の状態は温度・圧力にも依存します。分子からなる物質でも、水に溶けてイオンが生じると水溶液は通電する場合があります。</p>'}

function home(){screen='home';$('app').innerHTML='<section class="hero"><p class="kicker">CHEMISTRY QUEST · 高校化学基礎</p><h1>化学結合の伝説</h1><p class="subtitle">― 四つの物質王国 ―</p>'+landscape()+'<p>粒子を見抜き、結び付きを知り、物質の性質を解き明かせ。</p></section><div class="start-grid"><section class="panel"><h2>冒険者の登録</h2><form id="startForm"><label for="studentId">出席番号（半角数字4桁）</label><input class="id-input" id="studentId" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" required placeholder="例：1801"><p class="muted">出席番号は、この端末のブラウザ内だけに保存します。</p><button class="primary" type="submit">⚔ 新しい冒険を始める</button></form>'+(state?'<hr><p>出席番号 '+esc(state.id)+'：'+count()+'/20問 回答済み</p><button id="resume">続きから再開する</button>':'')+'</section><section class="panel"><h2>冒険の約束</h2><ul class="rules"><li>全20問・目安20〜30分（解説・復習を含む）。ヒントの使用や読む速さにより前後します。制限時間はありません。</li><li>ヒントは各問3段階。減点なし・回数を記録します。</li><li>各問1点。全問回答後、17点以上（85%）で合格。</li><li>復習正解で到達度が上がります。初回成績は残ります。</li><li>85%以上で表示される「合格証」を撮影して提出します。不合格画面は提出せず、復習してください。</li><li>音は出ません。移動中・授業中も静かに学べます。</li></ul></section></div>';if(state)$('studentId').value=state.id;$('startForm').onsubmit=e=>{e.preventDefault();const id=$('studentId').value;if(!/^\d{4}$/.test(id))return;if(state&&!confirm('このブラウザに保存されている冒険を、新しい記録に置き換えます。必要な合格証は撮影済みですか？'))return;state=fresh(id);save();map()};if(state)$('resume').onclick=()=>map()}
function map(){if(!state)return home();screen='map';review=false;const n=count();$('app').innerHTML='<p class="kicker">WORLD MAP</p><h1 style="font-size:2rem">四つの物質王国</h1><div class="statusline"><span>冒険者 '+esc(state.id)+'</span><span>回答 '+n+'/20　到達 '+score()+'/20</span></div><div class="bar"><i style="width:'+n*5+'%"></i></div><div class="kingdoms">'+KINGDOMS.slice(0,4).map((k,a)=>'<section class="kingdom" style="--accent:'+k[4]+'"><span class="emblem">'+k[3]+'</span><h3>'+k[0]+'</h3><p>'+k[1]+'</p><div class="status">'+state.answers.slice(a*4,a*4+4).filter(x=>x!==null).length+'/4 問回答</div><p>'+state.mastered.slice(a*4,a*4+4).filter(Boolean).length+'/4 問理解</p></section>').join('')+'</div><section class="panel"><p class="kicker">'+(complete()?'QUEST COMPLETED':'NEXT QUEST')+'</p><h2>'+(complete()?'四王国の知識が集まりました':KINGDOMS[Math.floor(n/4)][0])+'</h2><p>'+(complete()?'合格証を確認し、残った問題は復習で理解を深めましょう。':'構成粒子 → 結び付き → 性質の順に考えます。4問ずつ王国を進み、最後に比較問題へ挑戦します。')+'</p><div class="actions"><button class="primary" id="continue">'+(complete()?'結果・合格証へ':'⚔ 問題 '+(n+1)+' へ進む')+'</button><button id="homeBtn">登録画面へ</button></div></section>'+legend()+(saveError?'<p class="error">自動保存できません。このタブを閉じないでください。</p>':'<p class="muted">進行はこのブラウザへ自動保存されます。別端末への引き継ぎや先生への自動送信はありません。</p>');$('continue').onclick=()=>complete()?result():question(nextUnanswered(),false);$('homeBtn').onclick=home}
function svgText(x,y,t,color='#dce8ff',size=16){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="'+color+'" font-size="'+size+'">'+esc(t)+'</text>'}
function diagram(type){let s='',caption='概念を示す模式図（実際の寸法・配置を厳密に再現したものではありません）';const dot=(x,y,t,c)=>'<circle cx="'+x+'" cy="'+y+'" r="19" fill="'+c+'" stroke="#bacce5"/>'+svgText(x,y+6,t,'#102039',14);const line=(x,y,X,Y,c='#a5cbff',dash='')=>'<line x1="'+x+'" y1="'+y+'" x2="'+X+'" y2="'+Y+'" stroke="'+c+'" stroke-width="3" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>';

else if(type==='ratio'){s=dot(140,80,'2＋','#ffbc8a')+svgText(140,130,'Mg²⁺')+svgText(225,85,'＋')+dot(310,80,'−','#93dae5')+dot(380,80,'−','#93dae5')+svgText(345,130,'Cl⁻ × 2')+svgText(280,170,'(+2) + 2 × (−1) = 0 → MgCl₂');}
else if(type==='molecule'||type==='co2'){for(const base of [140,420]){if(type==='co2'){s+=line(base-50,73,base+50,73)+line(base-50,81,base+50,81);s+=dot(base-50,77,'O','#afd0ff')+dot(base,77,'C','#8bcab1')+dot(base+50,77,'O','#afd0ff');}else{s+=line(base-30,77,base+30,77)+dot(base-30,77,'I','#cfb4ee')+dot(base+30,77,'I','#cfb4ee');}}s+=line(220,77,340,77,'#80daba','6 6')+svgText(280,43,'分子間力','#80daba')+svgText(140,135,'分子内：共有結合','#a5cbff')+svgText(420,135,type==='co2'?'気体でもCO₂のまま':'ヨウ素分子 I₂')+svgText(280,173,'実線＝分子の中　破線＝分子と分子の間');}

else if(type==='network'){const pts=[[100,100],[180,48],[180,146],[280,100],[370,48],[370,146],[460,100]];[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,6],[5,6]].forEach(([a,b])=>s+=line(...pts[a],...pts[b]));pts.forEach(([x,y])=>s+=dot(x,y,'原子','#a5cbff'));s+=svgText(280,185,'独立した分子をつくらず、共有結合が連続する');caption='原子の連続した結び付きを示す概念図。特定の結晶構造・配位数は表していません。';}
else if(type==='graphite'){for(const y of [50,120]){s+=line(90,y,460,y);for(let x=90;x<470;x+=74)s+=dot(x,y,'C','#a5cbff')}for(let x=110;x<450;x+=74)s+=line(x,73,x,98,'#8dcbb1','4 5');s+=svgText(280,88,'層間は弱い力','#f4d58b',13)+svgText(280,170,'層内：電子が移動できる　／　層間：ずれやすい');}
else{KINGDOMS.slice(0,4).forEach((k,i)=>{s+='<rect x="'+(8+i*138)+'" y="28" width="130" height="125" rx="10" stroke="'+k[4]+'" fill="#192640"/>'+svgText(73+i*138,60,['金属','イオン','分子','共有結晶'][i],k[4])+svgText(73+i*138,96,['金属原子','陽・陰イオン','分子','原子'][i],'#e8efff',14)+svgText(73+i*138,133,['金属結合','イオン結合','分子間力','共有結合'][i],k[4],14)});s+=svgText(280,185,'構成粒子と結び付きから、性質を説明する');}
return '<figure class="diagram"><svg viewBox="0 0 560 205" role="img" aria-label="'+esc(type==='compare'?'4種類の構成粒子と結び付き':caption)+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg><figcaption>'+caption+'</figcaption></figure>'}
let reviewChoice=null;
function question(id,isReview=false){if(!state)return home();if(id<0||id>=20)return result();current=id;review=isReview;reviewChoice=null;screen='question';renderQuestion()}
function renderQuestion(){const q=QUESTIONS[current],k=KINGDOMS[q.area],selected=review?reviewChoice:state.answers[current],answered=selected!==null,h=review?state.reviewHints[current]:state.hints[current];document.documentElement.style.setProperty('--accent',k[4]);$('app').innerHTML='<div class="statusline"><span>'+esc(state.id)+' · '+(review?'復習モード':'初回の冒険')+'</span><span>問題 '+(current+1)+'/20 · '+k[1]+'</span></div><div class="bar"><i style="width:'+count()*5+'%"></i></div><div class="battle"><aside class="panel guardian">'+guardian(q.area)+'<div><p class="kicker">'+(q.area===4?'FINAL BOSS':'KINGDOM '+(q.area+1))+'</p><h3>'+k[2]+'</h3><p class="quote">'+k[5]+'</p><div class="stepdots">'+Array.from({length:4},(_,i)=>i<=current%4?'◆':'◇').join(' ')+'</div></div></aside><section class="panel question"><p class="kicker">QUESTION '+String(current+1).padStart(2,'0')+'</p><h2>'+rich(q.text)+'</h2><div class="choices">'+state.order[current].map((o,i)=>'<button class="choice '+(answered?(o===0?'correct':o===selected?'wrong':''):'')+'" data-option="'+o+'" '+(answered?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+rich(q.options[o])+'</span>'+(answered&&(o===0||o===selected)?'<span class="mark">'+(o===0?'○ 正解':'×')+'</span>':'')+'</button>').join('')+'</div><div class="actions" style="margin-top:18px"><button id="hint" '+(h>=3||answered?'disabled':'')+'>📜 ヒントの書 '+h+'/3</button><button class="small" id="questionBook">比較の書</button></div>'+(h?'<section class="hintbox" aria-live="polite">'+q.hints.slice(0,h).map((t,i)=>'<p><strong>ヒント'+(i+1)+'</strong> '+rich(t)+'</p>').join('')+(h===3?diagram(q.diagram):'')+'</section>':'')+(answered?'<section class="feedback '+(selected===0?'':'bad')+'" id="feedback" tabindex="-1" aria-live="polite"><h3>'+(selected===0?'○ 正解！':'× 不正解')+'</h3><p><strong>正解：</strong>'+rich(q.options[0])+'</p>'+(review?'<p class="muted">'+(selected===0?'復習後の到達度に反映しました。初回成績は変わりません。':'解説を読み、もう一度考えましょう。')+'</p>':'')+'</section><div class="explain"><h3 style="margin-top:20px">🧙 賢者の解説</h3><p>'+rich(q.explanation)+'</p>'+diagram(q.diagram)+'<div class="note"><strong>間違えやすいポイント</strong><p>'+rich(q.caution)+'</p></div></div><div class="actions"><button class="primary" id="next">'+(review?(selected===0?'次の復習・結果へ':'この問題をもう一度'):current===19?'結果・合格証を見る':'次の問題へ')+'</button></div>':'')+'</section></div>'+legend();document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));$('hint').onclick=hint;$('questionBook').onclick=openBook;if(answered)$('next').onclick=advance;}
function hint(){if(screen!=='question')return;const a=review?state.reviewHints:state.hints;if((review?reviewChoice:state.answers[current])!==null||a[current]>=3)return;a[current]++;save();renderQuestion()}
function answer(o){if(screen!=='question'||!Number.isInteger(o)||o<0||o>3)return;if(review){if(reviewChoice!==null)return;reviewChoice=o;state.reviewAttempts[current]++;if(o===0)state.mastered[current]=true}else{if(state.answers[current]!==null)return;state.answers[current]=o;state.mastered[current]=o===0;if(complete()&&!state.finished)state.finished=new Date().toISOString()}save();renderQuestion();$('feedback').focus({preventScroll:true});$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function advance(){if(review){if(reviewChoice!==0)return question(current,true);const rest=state.mastered.findIndex((x,i)=>!x&&state.answers[i]!==null);return rest<0?result():question(rest,true)}const n=nextUnanswered();if(n<0)return result();if(n%4===0)return map();question(n,false);window.scrollTo(0,0)}
function award(n){return n===20?['pt','Pt 白金賞','💎','#c8e5ff','四王国を結ぶ賢者','原子・イオン・分子。その違いを見抜き、物質の性質へつなげる力を身に付けました。']:n>=19?['au','Au 金賞','🥇','#f8d77b','黄金の構造解析者','結び付きから性質を読み解く理解が、黄金のように輝いています。']:n>=18?['ag','Ag 銀賞','🥈','#d3e1ee','白銀の物質研究者','四つの王国を比較する確かな視点が育っています。']:n>=17?['cu','Cu 銅賞','🥉','#e5b083','四王国の探究者','粒子と結び付きから考える土台ができました。復習でさらに理解を深めましょう。']:['retry','再挑戦','📖','#c6d4ec','学び直しの冒険者','間違いは、次に調べる場所を教えてくれる道しるべ。賢者の解説を手に再挑戦しましょう。']}
function result(){if(!state)return home();if(!complete())return map();screen='result';const n=score(),a=award(n),h=state.hints.reduce((x,y)=>x+y,0),rh=state.reviewHints.reduce((x,y)=>x+y,0),attempts=state.reviewAttempts.reduce((x,y)=>x+y,0),date=new Date().toLocaleDateString('ja-JP');$('app').innerHTML='<div class="certificate '+a[0]+'" style="--award:'+a[3]+'">'+(n>=19?Array.from({length:16},(_,i)=>'<span class="spark" style="top:'+(4+i*6%90)+'%;left:'+(3+i*29%95)+'%;animation-delay:'+i/5+'s">✦</span>').join(''):'')+'<p class="kicker">化学結合の伝説 — 四つの物質王国</p><h1>'+(n>=17?'合 格 証':'× 不合格')+'</h1>'+(n>=17?'<div class="medal">'+a[2]+'</div><h2 class="award">'+a[1]+'</h2><p class="serif">'+a[4]+'</p>':'<div class="not-submit"><strong>まだ提出しないでください</strong><p>この画面は合格証ではありません。<br>復習して85%以上（17/20点）にし、<br>「合格証」を撮影して提出してください。</p></div><p class="fail-score">現在 '+n*5+'%（'+n+'/20点）<br>合格まであと '+(17-n)+' 問</p><button class="primary no-print" id="quickReview">復習して合格を目指す</button>')+'<div class="record"><div><span>出席番号</span><strong>'+esc(state.id)+'</strong></div><div><span>到達度'+(attempts?'（復習反映）':'')+'</span><strong>'+n*5+'%（'+n+'/20点）</strong></div><div><span>初回正答率</span><strong>'+initial()*5+'%（'+initial()+'/20点）</strong></div><div><span>ヒント使用</span><strong>初回 '+h+'回／復習 '+rh+'回</strong></div><div><span>復習回答回数</span><strong>'+attempts+'回</strong></div><div><span>学習した問題</span><strong>20/20問</strong></div><div><span>発行日</span><strong>'+date+'</strong></div></div><p>'+ (n>=17?'全20問を学習し、到達度85%以上を達成したことを認めます。':'合格まであと '+(17-n)+' 問。間違えた問題を復習できます。')+'</p><p class="praise">'+a[5]+'</p>'+(n>=17?'<p>📸 この合格証をスクリーンショットで撮影し、提出してください。</p>':'<p class="not-submit-bottom">× 不合格・提出用ではありません<br>復習後に合格証を取得してください。</p>')+'<p class="muted">学習の証跡です。出席番号による本人確認は行いません。日付は端末の時計を使用しています。</p></div><div class="actions result-actions no-print">'+(n<20?'<button class="primary" id="reviewBtn">⚔ 未習得の '+(20-n)+' 問を復習</button>':'')+(n>=17?'<button id="printBtn">印刷・PDF保存</button>':'')+'<button id="resultBook">比較の書を読む</button><button id="resultHome">登録画面へ</button></div><section class="panel no-print"><h2>冒険の記録</h2><p class="muted">初回の答えは上書きしません。確認したい問題を開けます。</p>'+QUESTIONS.map(q=>'<details><summary>Q'+(q.id+1)+'　初回 '+(state.answers[q.id]===0?'○':'×')+' ／ 現在 '+(state.mastered[q.id]?'○ 理解':'△ 要復習')+'　'+KINGDOMS[q.area][1]+'</summary><p>'+rich(q.text)+'</p><p>あなたの初回回答：'+rich(q.options[state.answers[q.id]])+'</p><p>正解：'+rich(q.options[0])+'</p><p>'+rich(q.explanation)+'</p><button class="small" data-read="'+q.id+'">解説と図を確認</button></details>').join('')+'</section>';if(n>=17)$('printBtn').onclick=()=>window.print();if(n<17)$('quickReview').onclick=()=>question(state.mastered.findIndex(x=>!x),true);$('resultBook').onclick=openBook;$('resultHome').onclick=home;if(n<20)$('reviewBtn').onclick=()=>question(state.mastered.findIndex(x=>!x),true);document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>question(Number(b.dataset.read),false));window.scrollTo(0,0)}
function openBook(){$('bookBody').innerHTML=legend()+table()+'<p class="muted">閲覧による減点はありません。学習中も自由に参照できます。</p>';$('book').showModal()}
$('mapBtn').onclick=map;$('bookBtn').onclick=openBook;$('closeBook').onclick=()=>$('book').close();home();
</script></body></html>
