<head>

<title>分子間力・星晶の旅</title>
<style>
:root{--night:#101633;--ink:#273053;--muted:#68708b;--sky:#5c77d8;--violet:#8659c5;--gold:#f1bd45;--aqua:#28b8c6;--rose:#e4689a;--paper:#fffdf8;--line:#dfe3f3;--good:#198365;--bad:#c44d61;--shadow:0 18px 48px #18254e20}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 4%,#d6dbff 0,transparent 28%),radial-gradient(circle at 92% 13%,#d7fff9 0,transparent 24%),linear-gradient(145deg,#eef1ff,#fdf9ff 52%,#fff8ee);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{max-width:1040px;margin:auto;padding:16px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin:5px 0 14px}.crest{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:26px;background:linear-gradient(145deg,#8a63d2,#445eb9 56%,#22aeb9);box-shadow:0 9px 20px #5865c860}.top h1{font-size:clamp(1.25rem,4vw,1.85rem);line-height:1.2;margin:0;letter-spacing:.05em}.top p{margin:2px 0 0;color:var(--muted);font-size:.78rem}.status{position:sticky;top:7px;z-index:5;display:flex;gap:11px;align-items:center;padding:10px 13px;border:1px solid #dce1f2;border-radius:17px;background:#fffffff0;box-shadow:0 8px 24px #24346019;backdrop-filter:blur(12px)}.bar{height:10px;flex:1;overflow:hidden;border-radius:20px;background:#e7e9f4}.bar i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--sky),var(--aqua));transition:.3s}.chip{font-size:.78rem;font-weight:800;white-space:nowrap;border-radius:99px;padding:3px 9px;background:#f2efff;color:#65469d}.card{margin-top:17px;padding:clamp(20px,4vw,38px);border:1px solid #e0e4f2;border-radius:27px;background:#fff;box-shadow:var(--shadow)}.hidden{display:none!important}.intro{text-align:center;overflow:hidden;position:relative}.intro:before,.intro:after{content:"✦";position:absolute;font-size:110px;color:#d7cff5;opacity:.52}.intro:before{left:-20px;top:20px}.intro:after{right:-16px;bottom:-28px;color:#f4ce75}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.13em;color:var(--violet)}h2{line-height:1.3}.intro h2{font-size:clamp(1.7rem,5vw,2.7rem);margin:8px auto}.intro>p{max-width:680px;margin:8px auto;color:#4e5875}.world{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:720px;margin:24px auto}.world div{padding:12px 6px;border:1px solid #ded8f2;border-radius:15px;background:linear-gradient(145deg,#faf8ff,#fff);font-size:.83rem;font-weight:800}.world b{display:block;font-size:1.35rem}.note{max-width:700px;margin:18px auto;padding:11px 14px;border:1px solid #efd998;border-radius:14px;background:#fff9e7;color:#765d23;text-align:left;font-size:.84rem}.field{max-width:370px;margin:20px auto 12px;text-align:left}.field label{font-weight:800;font-size:.9rem}.field input{display:block;width:100%;margin-top:5px;padding:11px 13px;border:2px solid var(--line);border-radius:13px;letter-spacing:.12em}.small{font-size:.78rem;color:var(--muted);margin:4px 0}.primary,.secondary,.hint,.reveal,.next,.navbtn{border:0;border-radius:13px;padding:11px 16px;font-weight:850}.primary,.next{color:#fff;background:linear-gradient(105deg,#617bd7,#8054bd);box-shadow:0 8px 18px #5f59bd42}.primary:hover,.next:hover{transform:translateY(-1px)}.secondary{background:#efeff8;color:#4c5878}.hint{border:1px solid #ecd58c;background:#fff8dc;color:#886500}.reveal{background:#f7eaf1;color:#9c4168}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}.chapter{padding:17px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,#fbfcff,#f7f6ff);text-align:left}.chapter b{font-size:1.05rem}.chapter span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}.rune{font-size:1.45rem}.question-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.8rem}.stage{font-weight:900;color:var(--violet)}.question h2{font-size:clamp(1.25rem,3.5vw,1.65rem);margin:14px 0 18px}.diagram{padding:15px;border:1px solid #dce2f0;border-radius:18px;background:linear-gradient(145deg,#fbfcff,#eff9ff);overflow:hidden}.molrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,30px);min-height:170px}.molecule{position:relative;width:128px;height:115px;display:grid;place-items:center}.atom{position:absolute;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.74rem;font-weight:900;box-shadow:inset -5px -5px 10px #17214a2b}.atom.o{background:radial-gradient(circle at 32% 25%,#ff9f98,#dd5a68 70%)}.atom.h{background:radial-gradient(circle at 32% 25%,#aeeefa,#39aeca 70%)}.atom.cl{background:radial-gradient(circle at 32% 25%,#a7edc5,#36a476 70%)}.atom.c{background:radial-gradient(circle at 32% 25%,#7885a8,#343e61 70%)}.center{left:41px;top:35px}.left{left:5px;top:8px}.right{right:5px;top:8px}.bottom{left:41px;bottom:2px}.dash{width:80px;border-top:3px dashed #9774ca;position:relative}.dash:after{content:"弱い引力";position:absolute;top:-29px;left:-7px;color:#7154a5;font-size:.72rem;font-weight:800;white-space:nowrap}.charge{font-size:.72rem;color:#845baf;font-weight:900}.caption{text-align:center;color:#66718c;font-size:.78rem;margin:5px 0 0}.legend{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:9px}.legend span{padding:3px 8px;border-radius:99px;background:#fff;border:1px solid #dce2ee;font-size:.73rem;font-weight:800}.choices{display:grid;gap:9px;margin:16px 0}.choice{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:12px 13px;border:2px solid #e0e4ef;border-radius:14px;background:#fff;color:var(--ink)}.choice:hover{border-color:#b9aee7}.choice.selected{border-color:var(--violet);background:#f4f0ff}.letter{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:50%;background:#edf0f5;font-size:.78rem;font-weight:900}.selected .letter{color:#fff;background:var(--violet)}.hintbox,.feedback{margin-top:15px;padding:13px 15px;border-radius:14px}.hintbox{border:1px solid #f0d989;background:#fff9e6;color:#765e28;font-size:.9rem}.feedback.good{border:1px solid #b8e8d7;background:#ecfbf3;color:#165f4e}.feedback.bad{border:1px solid #f1c6cf;background:#fff1f3;color:#843b4c}.feedback p{margin:5px 0}.feedback .actions{margin-top:10px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare div{padding:13px;border-radius:14px;background:#fff;border:1px solid #dfe4ef}.compare b{display:block;color:#51467d}.ranker{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.ranker button{padding:13px 7px;border:2px solid #dce1ed;border-radius:14px;background:#fff;color:var(--ink);font-weight:850}.ranker button.selected{border-color:var(--violet);background:#f3efff}.ice{height:175px;position:relative;background:linear-gradient(145deg,#eefcff,#f9fdff);border-radius:15px;overflow:hidden}.hex{position:absolute;width:58px;height:58px;border:2px dashed #60a9d1;border-radius:50%;display:grid;place-items:center;color:#3379a7;font-size:.76rem;font-weight:900}.hex:before{content:"";position:absolute;width:44px;height:44px;border:2px solid #7bc5e9;border-radius:12px;transform:rotate(30deg)}.crystal{position:absolute;inset:0;background:linear-gradient(60deg,transparent 49%,#6db7db55 50%,transparent 51%),linear-gradient(-60deg,transparent 49%,#6db7db55 50%,transparent 51%);background-size:65px 58px;opacity:.6}.certificate{position:relative;max-width:590px;margin:20px auto;padding:28px 20px;border:5px double var(--rank);border-radius:22px;background:radial-gradient(circle at 50% 0,#fff9df,#fff 47%);overflow:hidden}.seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:auto;color:#fff;background:var(--rank);box-shadow:0 0 0 7px #fff,0 0 0 9px var(--rank);font-size:30px}.certificate h3{font-size:1.55rem;margin:14px 0 0;color:#65522b}.certificate p{margin:4px}.score{font-size:1.2rem;font-weight:900}.confetti{letter-spacing:1em;color:var(--rank);font-size:1.3rem}.review{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.review button{border:1px solid #dbdff0;border-radius:11px;background:#f6f5ff;padding:8px 10px;color:#50437d}.home{margin-left:auto;background:none;border:0;color:#5b5e87;text-decoration:underline;font-size:.78rem}@media(max-width:620px){.shell{padding:12px 11px 45px}.status{gap:7px}.world{grid-template-columns:1fr 1fr}.chapter-grid{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.ranker{grid-template-columns:1fr}.molrow{gap:1px}.molecule{transform:scale(.9)}.dash{width:34px}.dash:after{font-size:.62rem;left:-18px}.home{display:none}}
.science-image{display:block;max-width:min(100%,620px);height:auto;margin:0 auto;border-radius:13px}.ranker{grid-template-columns:repeat(4,1fr)}.keypoint{padding:10px 12px!important;border-left:5px solid var(--gold);border-radius:9px;background:#fff5cf;color:#765100;font-weight:850}.unlock{text-align:center;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 0,#fff1bd,transparent 46%),linear-gradient(145deg,#fff,#f3efff)}.unlock .rune{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 12px;border-radius:50%;color:#fff;background:linear-gradient(145deg,#f4c64c,#8a60ca);font-size:36px;box-shadow:0 0 0 9px #fff,0 0 0 11px}.unlock h2{font-size:clamp(1.65rem,5vw,2.4rem);margin:10px 0}.unlock p{max-width:550px;margin:8px auto;color:#4f5878}.trial-note{margin-top:15px;padding:10px 13px;border:1px solid #edcf89;border-radius:12px;background:#fff8e3;color:#795b19;font-size:.85rem}.danger-card{max-width:590px;margin:20px auto;padding:28px 20px;border:5px double #d84652;border-radius:22px;background:radial-gradient(circle at 50% 0,#ffd9d9,#fff2f2 55%);color:#7d2030}.danger-card.critical{border-color:#7d153d;background:repeating-linear-gradient(135deg,#4d1234 0 13px,#641139 13px 26px);color:#fff;box-shadow:0 0 0 9px #e6556a,0 0 38px #9d174d}.danger-card .hazard{font-size:3.5rem;line-height:1;margin:4px}.danger-card h3{font-size:1.6rem;margin:7px 0}.danger-card p{margin:5px 0}.danger-card.critical p{color:#ffe6eb}.crystal-log{max-width:590px;margin:18px auto;padding:15px;border:1px solid #d6c7f1;border-radius:16px;background:linear-gradient(145deg,#f9f6ff,#eefaff)}.crystal-log b{display:block;color:#68499f}.crystal-log .crystal-count{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:9px 0}.crystal-log span{padding:5px 10px;border-radius:99px;background:#fff;border:1px solid #ded9ef;font-size:.84rem;font-weight:850}.crystal-log .missing{color:#9e3d57;border-color:#efb7c5;background:#fff3f5}.crystal-log p{margin:4px 0;color:#5d6684;font-size:.84rem}@media(max-width:620px){.ranker{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="crest">✦</div><div><h1>分子間力・星晶の旅</h1><p>高校化学｜分子をつなぐ見えない力を読み解く</p></div></header><section id="status" class="status hidden"><span class="chip" id="progress">0 / 13</span><div class="bar"><i id="bar"></i></div><span class="chip" id="statusText">出発前</span><button class="home" id="home">ホームへ</button></section><div id="app"></div></main>
<script>
(()=>{'use strict';const KEY='intermolecular-forces-quest-v4';
const qs=[
{id:1,stage:'星図 1/3',type:'choice',title:'分子間力の正体',text:'分子どうしが近づいたときにはたらく、比較的弱い引力を何といいますか。',correct:'B',opts:{A:'共有結合',B:'分子間力',C:'イオン結合',D:'金属結合'},hints:['「分子の内部」をつなぐ結合ではなく、分子と分子の間にはたらく力に注目。','分子間力は、イオン結合や共有結合より弱い引力です。'],ex:'分子間力は分子間にはたらく弱い引力です。状態変化で主に変わるのは、分子間の関係です。'},
{id:2,stage:'星図 2/3',type:'choice',diagram:'nonpolar',title:'すべての分子にある力',text:'ファンデルワールス力について正しい説明を選んでください。',correct:'C',opts:{A:'イオンどうしにだけはたらく',B:'F・O・NとHを含む分子にだけはたらく',C:'すべての分子間にはたらく弱い引力を含む',D:'分子内の原子をつなぐ共有結合の別名'},hints:['無極性分子のN₂やCO₂にも、液体になるときに分子を引きつける力があります。','無極性分子にもはたらく分散力、極性分子どうしの静電的な引力をまとめて扱います。'],ex:'ファンデルワールス力は、すべての分子間にはたらく弱い引力と、極性分子どうしの静電的な引力を含む表現です。'},
{id:3,stage:'星図 3/3',type:'rank',title:'分子量と沸点',text:'ハロゲン分子 F₂、Cl₂、Br₂、I₂ を、沸点が低い順に並べてください。',correct:['F₂','Cl₂','Br₂','I₂'],hints:['同じハロゲンの二原子分子で、すべて無極性分子です。まず分子量を比べよう。','分子量は F₂＝38、Cl₂＝71、Br₂＝160、I₂＝254。分子量が大きいほど電子雲がゆがみやすくなります。'],key:'重要！！ 無極性分子では、分子量が大きいほど分散力（ファンデルワールス力）が大きくなり、沸点が高くなる。',ex:'F₂（分子量38、沸点−188 ℃）→ Cl₂（71、−34 ℃）→ Br₂（160、59 ℃）→ I₂（254、184 ℃）の順です。これらはすべて無極性のハロゲン分子なので、水素結合や分子の極性の差ではなく、主に分散力（ファンデルワールス力）で比べます。分子量が大きいほど電子数が多く電子雲がゆがみやすいため、瞬間的な電気的かたよりが大きくなり、分散力が強くなります。その結果、沸点も高くなります。'},
{id:4,stage:'月影 1/3',type:'choice',diagram:'polar',title:'極性分子の引力',text:'CH₄（分子量16）よりNH₃（17）の方が、分子量はわずかに大きい。それにもかかわらず、NH₃の沸点が著しく高い。最も適切な理由はどれですか。',correct:'D',opts:{A:'NH₃の方が分子量が大きいから',B:'CH₄には共有結合がないから',C:'NH₃がイオン結晶だから',D:'NH₃は極性分子で、さらに水素結合も生じるから'},hints:['CH₄は正四面体形で全体として無極性。NH₃は極性をもちます。','NH₃ではNとHを含み、水素結合もはたらきます。'],ex:'分子量は CH₄＝16、NH₃＝17 で、NH₃の方がわずかに大きいだけです。実際の沸点は CH₄＝−162 ℃、NH₃＝−33 ℃で、差は非常に大きく、分子量差だけでは説明できません。CH₄は無極性分子で分散力だけが主にはたらくのに対し、NH₃は極性分子であり、N―Hをもつため水素結合も生じます。この追加の強い分子間力により、NH₃の沸点が著しく高くなります。'},
{id:5,stage:'月影 2/3',type:'choice',diagram:'hbond',title:'水素結合の条件',text:'分子間に水素結合が生じる条件として最も適切なものはどれですか。',correct:'A',opts:{A:'HがF・O・Nのいずれかと結合している',B:'HがCl・Br・Iのいずれかと結合している',C:'分子量が100以上である',D:'無極性分子である'},hints:['電気陰性度が特に大きい元素を思い出そう。','高校化学では H―F、H―O、H―N を水素結合の要点として扱います。'],ex:'F・O・Nと結合したHをもつ分子では、近くの分子との間に特に強い分子間力である水素結合が生じます。'},
{id:6,stage:'月影 3/3',type:'choice',title:'HFの沸点',text:'HF、HCl、HBr、HI のうち、沸点が最も高いものはどれですか。',correct:'B',opts:{A:'HCl',B:'HF',C:'HBr',D:'HI'},hints:['分子量だけならHIが最大ですが、例外になる要因を探そう。','HFはFとHを含むため、水素結合が生じます。'],ex:'分子量は HF＝20、HCl＝36.5、HBr＝81、HI＝128 です。水素結合を考えなければ、分子量が大きいほど分散力が強くなるので、HCl ＜ HBr ＜ HI の順に沸点が高くなります。しかしHFだけはH―Fをもち、水素結合が生じます。この水素結合が非常に強いため、分子量が最小のHFが4種の中で最も高い沸点を示す例外になります。'},
{id:7,stage:'氷晶 1/2',type:'choice',diagram:'ice',title:'氷が浮く理由',text:'氷が液体の水に浮く理由として正しい説明を選んでください。',correct:'C',opts:{A:'氷では水分子内のO―H結合が切れるから',B:'氷では水分子がイオンになるから',C:'水素結合で、すき間の多い結晶構造ができて密度が小さくなるから',D:'氷の方が水より質量が大きいから'},hints:['固体の氷では水分子の並び方が、液体と異なります。','水素結合により水分子の位置と向きが固定され、六角形状のすき間を含む構造ができます。'],ex:'氷では水素結合がつくるすき間の多い結晶構造により、液体の水より密度が小さくなります。水になると構造がくずれ、すき間に分子が入り込みます。'},
{id:8,stage:'氷晶 2/2',type:'choice',title:'融解で変わるもの',text:'分子からなる物質が融解するとき、主に変化するものはどれですか。',correct:'D',opts:{A:'各分子の原子の種類',B:'分子内の共有結合そのもの',C:'原子核の数',D:'分子間の引力による配列・距離'},hints:['H₂O が氷から水になっても、H₂Oという分子自体は保たれます。','状態変化に必要なエネルギーは、主に分子間力を弱め、分子の配置を変えるために使われます。'],ex:'融解では主に分子間の配列・距離が変化します。分子内の共有結合を切るわけではありません。'},
{id:9,stage:'王国比較 1/2',type:'choice',title:'融点・沸点を比べる',text:'一般に、融点・沸点が最も低くなりやすい物質群はどれですか。',correct:'A',opts:{A:'分子からなる物質',B:'イオン結晶',C:'金属結晶',D:'共有結合の結晶'},hints:['粒子間にはたらく力の強さを比べよう。','分子間力は、イオン結合・金属結合・共有結合より一般に弱い力です。'],ex:'分子からなる物質では、分子と分子の間の分子間力を弱めて分子を離せばよいため、融点・沸点が低い傾向があります。対して、イオン結晶では陽イオンと陰イオンの強い静電気的引力（イオン結合）、金属結晶では金属陽イオンと自由電子による金属結合、共有結合の結晶では原子どうしの共有結合が結晶全体に広がっています。結合の強さの一般的な目安は「共有結合（結晶）・イオン結合・金属結合 ≫ 水素結合 ＞ ファンデルワールス力」です。したがって、分子からなる物質は他の3種類より低い融点・沸点を示しやすいのです。'},
{id:10,final:true,stage:'最終試練 1/4',type:'choice',title:'分子量で比べる①',text:'N₂（28）と O₂（32）のうち、沸点が高い物質はどちらですか。',correct:'B',opts:{A:'N₂',B:'O₂',C:'同じ',D:'分子量だけでは決められない'},hints:['どちらも二原子分子で、無極性分子です。','分子量は N₂＝28、O₂＝32。無極性分子では分散力を比べます。'],ex:'分子量は N₂＝28、O₂＝32 です。どちらも無極性分子なので、水素結合や極性による特別な差はありません。分子量が大きいO₂の方が電子雲がゆがみやすく、分散力（ファンデルワールス力）が強くなります。したがって、分子量順どおりO₂の沸点が高くなります。'},
{id:11,final:true,stage:'最終試練 2/4',type:'choice',title:'分子量で比べる②',text:'HCl（36.5）と HBr（81）のうち、沸点が高い物質はどちらですか。',correct:'D',opts:{A:'HCl',B:'同じ',C:'水素結合をするHCl',D:'HBr'},hints:['HClもHBrも極性分子ですが、水素結合は生じません。','分子量は HCl＝36.5、HBr＝81。F・O・NとHの結合がないため水素結合はありません。'],ex:'分子量は HCl＝36.5、HBr＝81 です。どちらも極性分子ですが、H―ClとH―Brでは水素結合は生じません。したがって分子量が大きい方が分散力も強いという傾向で比べることができ、HBrの沸点がHClより高くなります。'},
{id:12,final:true,stage:'最終試練 3/4',type:'choice',title:'水素結合の例外',text:'H₂O（18）と H₂S（34）のうち、沸点が高い物質はどちらですか。',correct:'A',opts:{A:'H₂O',B:'H₂S',C:'同じ',D:'分子量だけでは決められない'},hints:['分子量順だけならH₂Sが有利です。例外を生む分子間力を探そう。','H₂OはO―Hをもち、水素結合が生じます。H₂Sでは水素結合は生じません。'],ex:'分子量は H₂O＝18、H₂S＝34 です。分子量だけで比べれば、H₂Sの方が大きく、分散力も強いのでH₂Sの沸点が高くなりそうです。しかしH₂OはO―Hをもち、分子間に水素結合が生じます。H₂Sにはこの強い水素結合が生じないため、分子量の小さいH₂Oの方がはるかに高い沸点を示します。'},
{id:13,final:true,stage:'最終試練 4/4',type:'choice',title:'極性による例外',text:'F₂（38）と HCl（36.5）のうち、沸点が高い物質はどちらですか。',correct:'B',opts:{A:'F₂',B:'HCl',C:'同じ',D:'分子量だけでは決められない'},hints:['F₂の方が分子量は少し大きいことに注意。ただし、分子の極性も比べよう。','F₂は無極性分子、HClは極性分子です。HClには分子どうしの静電的な引力もはたらきます。'],ex:'分子量は F₂＝38、HCl＝36.5 で、F₂の方がわずかに大きいです。分子量だけならF₂の分散力がわずかに強く、F₂の沸点が高いと予想してしまいます。しかしF₂は無極性分子なのに対し、HClは極性分子で、分散力に加えて分子どうしの静電的な引力もはたらきます。そのため実際の沸点は F₂＝−188 ℃、HCl＝−85 ℃で、HClの方が高くなります。'}];
let S={started:false,student:'',answers:{},hints:{},revealed:{},view:{},current:0,first:{},rank:[],orders:{},completed:false,unlock:null};try{S={...S,...JSON.parse(localStorage.getItem(KEY))}}catch(e){};const app=document.querySelector('#app'),status=document.querySelector('#status');const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const done=q=>S.answers[q.id]?.checked||S.revealed[q.id];const count=()=>qs.filter(done).length;const score=()=>qs.filter(q=>S.first[q.id]===true).length;const shuffled=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function intro(){status.classList.add('hidden');app.innerHTML=`<section class="card intro"><div class="eyebrow">INTERMOLECULAR FORCES QUEST</div><h2>見えない引力をたどる、<br>星晶の旅へ。</h2><p>分散力、極性分子どうしの引力、水素結合を手がかりに、沸点と氷の不思議を読み解く高校化学の探究です。</p><div class="world"><div><b>✧</b>分子間力</div><div><b>◐</b>極性と沸点</div><div><b>❄</b>氷の結晶</div><div><b>♜</b>物質の王国</div></div><div class="note">全13問・目安20分。ヒントは何度使っても大丈夫です。最初の「答え合わせ」の結果だけが修了証の得点になります。「答えを見る」を選んだ問題は初回得点0点です。途中の進み具合はこの端末に保存されます。</div><div class="field"><label for="student">出席番号（提出する場合は4桁）</label><input id="student" value="${esc(S.student)}" inputmode="numeric" maxlength="4" placeholder="例：0123"><p class="small">空欄なら自由学習として始められます。</p></div><button class="primary" id="start">旅をはじめる</button></section>`;document.querySelector('#start').onclick=()=>{let n=document.querySelector('#student').value.trim();if(n&&!/^\d{4}$/.test(n))return alert('出席番号は4桁の数字で入力してください。');S.student=n;S.started=true;save();render()}}
function update(){let n=count();status.classList.toggle('hidden',!S.started);document.querySelector('#progress').textContent=`${n} / ${qs.length}`;document.querySelector('#bar').style.width=`${n/qs.length*100}%`;document.querySelector('#statusText').textContent=n===qs.length?'すべての星晶を確認した':'未確認 '+(qs.length-n)+'問';document.querySelector('#home').onclick=()=>{S.started=false;save();intro()}}
function diagram(kind){if(kind==='polar')return `<div class="diagram"><img class="science-image" src="assets/methane-ammonia-comparison.png" alt="左にメタン、右にアンモニアを配置した分子模型の比較図"><p class="caption">左：CH₄（正四面体形・無極性）／右：NH₃（三角錐形・極性）。分子量だけでなく、極性と水素結合も沸点を左右します。</p></div>`;if(kind==='hbond')return `<div class="diagram"><img class="science-image" src="assets/water-hydrogen-bond.png" alt="2つの水分子の酸素と水素の間に水素結合がある模式図"><p class="caption">O（またはF・N）と、近くの分子のHの間にはたらく特に強い分子間力が水素結合です。</p></div>`;if(kind==='ice')return `<div class="diagram"><div class="ice"><div class="crystal"></div>${[[34,26],[130,68],[226,20],[313,72],[78,117],[180,120],[278,125]].map(p=>`<b class="hex" style="left:${p[0]}px;top:${p[1]}px">H₂O</b>`).join('')}</div><p class="caption">氷では水分子が水素結合で固定され、すき間の多い構造をつくります（模式図）。</p></div>`;return ''}
function choice(q){let p=S.answers[q.id]?.picked;return `<div class="choices">${Object.entries(q.opts).map(([k,v])=>`<button class="choice ${p===k?'selected':''}" data-choice="${k}"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>`}
function rank(q){let selected=S.rank||[];if(!S.orders[q.id]){S.orders[q.id]=shuffled(q.correct);save()}let available=S.orders[q.id].filter(x=>!selected.includes(x));return `<div class="diagram"><p class="caption"><b>低い → 高い</b> の順に、分子を押して並べてください。</p><div class="ranker">${available.map(x=>`<button data-rank="${x}">${x}</button>`).join('')}</div><div class="legend"><span>現在：${selected.length?selected.join(' → '):'まだ選ばれていません'}</span></div><div class="actions"><button class="secondary" id="undo">1つ戻す</button></div></div>`}
function feedback(q){let a=S.answers[q.id],shown=a?.checked||S.revealed[q.id];if(!shown)return '';let good=a?.correct&&!S.revealed[q.id],canNext=!q.final||good;let answer=q.type==='rank'?q.correct.join(' → '):`${q.correct}「${q.opts[q.correct]}」`;let retryLabel=q.final?'最終試練を最初からやり直す':'この問題を再挑戦する';return `<div class="feedback ${good?'good':'bad'}"><strong>${good?'○ 正解！ 星晶を獲得':'× もう一度、根拠を確認しよう'}</strong><p>${good?'判断の根拠も確認して、次の場所へ進もう。':S.revealed[q.id]?'答えを表示しました。':'ヒントと解説を読んで再挑戦できます。'}</p>${q.key?`<p class="keypoint">${esc(q.key)}</p>`:''}<p><b>答え：</b>${esc(answer)}</p><p><b>解説：</b>${esc(q.ex)}</p>${q.final&&!good?'<p class="trial-note"><b>最終試練：</b>この問題は初回不正解として減点されました。Q10から4問すべてをやり直し、正解するまで次の問題へは進めません。</p>':''}<div class="actions">${!good?`<button class="secondary" id="retry">${retryLabel}</button>`:''}${canNext?'<button class="next" id="next">次の星晶へ</button>':''}</div></div>`}
function unlock(){let data={4:['月影の回廊','◐','極性と水素結合','分子量だけでは決まらない沸点の例外を読み解こう。'],7:['氷晶の遺跡','❄','氷と物質の王国','状態変化で変わるものと、結晶の結びつきを確かめよう。'],10:['最終試練・星晶の審判','✦','理解度チェック','4つの比較問題で、分子量・分散力・水素結合を使い分けよう。初回不正解は修了証で減点され、正解するまで先へ進めません。']}[S.unlock];app.innerHTML=`<section class="card unlock"><div class="eyebrow">STAGE UNLOCKED</div><div class="rune">${data[1]}</div><h2>${data[0]}</h2><p><b>${data[2]}</b></p><p>${data[3]}</p><button class="primary" id="enter-stage">このステージへ進む</button></section>`;document.querySelector('#enter-stage').onclick=()=>{S.current=S.unlock-1;S.unlock=null;save();render()}}
function render(){if(!S.started)return intro();update();if(S.completed)return result();if(S.unlock)return unlock();let q=qs[S.current];if(done(q)&&!S.view[q.id]){let i=qs.findIndex(x=>!done(x));if(i<0)return result();S.current=i;q=qs[i];save()}let body=(q.diagram?diagram(q.diagram):'')+(q.type==='rank'?rank(q):choice(q));let hn=S.hints[q.id]||0;app.innerHTML=`<section class="card question"><div class="question-top"><span class="stage">${q.stage}</span><span>Q${q.id}　${S.student?'出席番号 '+esc(S.student):'自由学習'}</span></div><h2>${q.text}</h2>${body}<div class="actions"><button class="primary" id="judge">答え合わせ</button><button class="hint" id="hint">ヒント ${hn<q.hints.length?hn+1:'確認済み'}</button><button class="reveal" id="reveal">答えを見る</button></div>${q.final?'<div class="trial-note"><b>最終試練のルール：</b>初回不正解は修了証で減点されます。正解するまで次へ進めません。</div>':''}${hn?`<div class="hintbox"><b>ヒント</b>　${q.hints.slice(0,hn).map(esc).join('　／　')}</div>`:''}${feedback(q)}</section>`;bind(q)}
function bind(q){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{S.answers[q.id]={...(S.answers[q.id]||{}),picked:b.dataset.choice};save();render()});document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{S.rank=[...(S.rank||[]),b.dataset.rank];save();render()});let undo=document.querySelector('#undo');if(undo)undo.onclick=()=>{S.rank=(S.rank||[]).slice(0,-1);save();render()};document.querySelector('#hint').onclick=()=>{S.hints[q.id]=Math.min((S.hints[q.id]||0)+1,q.hints.length);save();render()};document.querySelector('#reveal').onclick=()=>{S.revealed[q.id]=true;S.view[q.id]=true;S.answers[q.id]={...(S.answers[q.id]||{}),checked:true,correct:false};if(S.first[q.id]===undefined)S.first[q.id]=false;save();render()};document.querySelector('#judge').onclick=()=>judge(q);let retry=document.querySelector('#retry');if(retry)retry.onclick=()=>{if(q.final){qs.filter(x=>x.final).forEach(x=>{S.answers[x.id]={picked:null};S.revealed[x.id]=false;S.view[x.id]=false});S.current=9;S.unlock=null}else{let initial=S.first[q.id];S.answers[q.id]={picked:null};S.rank=[];S.revealed[q.id]=false;S.view[q.id]=false;S.first[q.id]=initial}save();render()};let next=document.querySelector('#next');if(next)next.onclick=()=>{S.view[q.id]=false;let i=qs.findIndex(x=>!done(x));if(i>=0){S.current=i;if([3,6,9].includes(q.id))S.unlock=i+1}else S.completed=true;save();render()}}
function judge(q){let p=q.type==='rank'?(S.rank||[]):S.answers[q.id]?.picked;if(q.type==='rank'&&p.length!==q.correct.length)return alert('3つすべてを低い順に並べてください。');if(q.type!=='rank'&&!p)return alert('選択肢を1つ選んでください。');let ok=q.type==='rank'?q.correct.every((x,i)=>p[i]===x):p===q.correct;S.answers[q.id]={...(S.answers[q.id]||{}),checked:true,correct:ok};S.view[q.id]=true;if(S.first[q.id]===undefined)S.first[q.id]=ok;save();render()}
function result(){update();let sc=score(),pct=Math.round(sc/qs.length*100),passed=pct>85,critical=pct<=60,rank=sc===13?['金','星晶の賢者','✦','#d6a52d']:['銀','月影の探究者','◈','#8292b2'];let date=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric'}).format(new Date()),miss=qs.filter(q=>S.first[q.id]!==true),left=miss.length;let crystalLog=left?`<section class="crystal-log"><b>✦ 星晶の調査記録</b><div class="crystal-count"><span>初回で獲得　${sc} 個</span><span class="missing">未回収　${left} 個</span></div><p>未回収の星晶を取り戻すには、下の見直し問題で根拠を確認しよう。</p></section>`:`<section class="crystal-log"><b>✦ 星晶の調査記録</b><div class="crystal-count"><span>初回で獲得　${sc} 個</span><span>未回収　0 個</span></div><p>すべての星晶を初回で回収しました。</p></section>`;let outcome=passed?`<div class="certificate" style="--rank:${rank[3]}"><div class="seal">${rank[2]}</div><h3>${rank[0]}の星晶バッジ</h3><p>${rank[1]}</p><p>${S.student?'出席番号　'+esc(S.student):'自由学習（提出不可）'}</p><p class="score">初回得点　${sc} / ${qs.length} 点（${pct}%）</p><p>ヒント使用　${Object.values(S.hints).reduce((a,b)=>a+b,0)} 回　／　${date}</p><div class="confetti">✦ ✧ ✦</div></div><p>${S.student?'この画面をスクリーンショットして提出できます。':'出席番号がないため、自由学習の記録です。'}</p>`:`<div class="danger-card ${critical?'critical':''}"><div class="hazard">${critical?'☣':'⚠'}</div><h3>${critical?'危険：基礎から要復習':'警告：要復習'}</h3><p>${S.student?'出席番号　'+esc(S.student):'自由学習'}</p><p class="score">初回得点　${sc} / ${qs.length} 点（${pct}%）</p><p>${critical?'60％以下です。分子量・極性・水素結合の区別を、解説からもう一度確認してください。':'85％以下です。修了証は発行されません。見直し問題を復習してから再挑戦してください。'}</p></div>`;app.innerHTML=`<section class="card" style="text-align:center"><div class="eyebrow">QUEST COMPLETED</div><h2>${passed?'分子間力・修了証':'分子間力・復習判定'}</h2>${outcome}${crystalLog}${left?`<p>見直しの星晶</p><div class="review">${miss.map(q=>`<button data-review="${q.id}">Q${q.id}　${q.title}</button>`).join('')}</div>`:'<p>全問を初回正解。分子間力と沸点の関係を見事に読み解きました。</p>'}<div class="actions" style="justify-content:center"><button class="secondary" id="again">最初から学び直す</button></div></section>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let id=+b.dataset.review;S.current=qs.findIndex(q=>q.id===id);S.answers[id]={picked:null};S.rank=[];S.revealed[id]=false;S.view[id]=false;S.completed=false;save();render()});document.querySelector('#again').onclick=()=>{if(confirm('保存した学習記録を消して最初から始めますか？')){localStorage.removeItem(KEY);location.reload()}}}
S.started?render():intro()})();
</script></body></html>
