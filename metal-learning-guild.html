d(2){border-color:#b4a2ed}.stage:nth-child(3){border-color:#eccb74}.number-box{max-width:500px;margin:25px auto 0;text-align:left;background:white;border:1px solid var(--line);border-radius:18px;padding:20px}.number-box legend{font-weight:800}.choice-row{display:flex;gap:10px;margin-top:12px}.choice-row label{flex:1;border:1px solid var(--line);padding:11px;border-radius:11px;cursor:pointer;font-size:14px}.choice-row input{accent-color:var(--violet)}.number-input{width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px}.primary,.secondary,.ghost{border:0;border-radius:12px;padding:13px 18px;font-weight:800}.primary{background:linear-gradient(120deg,#397bd8,#7852c9);color:#fff;box-shadow:0 7px 15px #4b62b544}.secondary{background:#fff3ce;color:#845800;border:1px solid #f1cf6c}.ghost{background:#edf1f8;color:#4e5a74}.start-btn{margin-top:20px;font-size:17px}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:14px}.qhead .pill{color:var(--violet);font-weight:800}.question{font-size:clamp(22px,3.3vw,30px);line-height:1.5;margin:22px 0}.diagram{border:1px solid #b7dceb;border-radius:17px;background:#effbff;padding:12px;margin:0 0 18px}.diagram svg{display:block;width:100%;height:auto}.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:13px;color:#31536e}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;margin-right:4px}.ion{background:#e2763f}.electron{background:#079cae}.options{display:grid;gap:10px}.option{border:2px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left;display:flex;align-items:center;gap:12px;transition:.15s}.option:hover{border-color:#9e8be0;transform:translateY(-1px)}.option .letter{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef2fa;font-weight:800;font-size:13px;color:#53617c;flex:none}.option.selected{border-color:var(--violet);background:#f5f1ff}.option.correct{border-color:#2faf66;background:#eefaf2}.option.wrong{border-color:#dc5e63;background:#fff2f2}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.feedback{margin-top:18px;padding:16px;border-radius:13px;background:#f0f6ff;line-height:1.65}.feedback.ok{background:#ecf9f0}.feedback.no{background:#fff3f2}.feedback b{display:block}.feedback details{margin-top:10px}.feedback summary{cursor:pointer;color:#4e4b91;font-weight:800}.next{margin-left:auto}.result{text-align:center}.result h2{font-size:clamp(28px,5vw,40px);margin:10px 0}.score{font-size:52px;font-weight:900;color:var(--navy);margin:14px}.title-card{background:linear-gradient(135deg,#fff1be,#fce3a5);border:3px solid var(--gold);border-radius:22px;padding:22px;margin:22px auto;max-width:620px}.title-card b{font-size:27px;display:block;margin:6px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin:22px 0}.result-card{padding:16px;border-radius:15px;background:white;border-left:6px solid var(--blue)}.result-card:nth-child(2){border-color:#2eaf65}.result-card:nth-child(3){border-color:#a446c9}.result-card small{display:block;color:var(--muted);margin-top:7px}.certificate{margin:22px auto;text-align:left;max-width:620px;background:white;border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted)}.certificate strong{color:var(--ink)}.result .actions{justify-content:center}.mini-note{font-size:13px;color:var(--muted);margin-top:10px}@media(max-width:600px){.shell{width:100%;padding:0}.app{border-radius:0;min-height:100vh}.top{padding:18px}.progress-wrap{min-width:110px}.view{padding:22px 16px}.stage-grid,.result-grid{grid-template-columns:1fr}.choice-row{flex-direction:column}.question{font-size:22px}.actions .primary,.actions .secondary,.actions .ghost{padding:12px}.next{margin-left:0}.top .brand p{display:none}}

<body><main class="shell"><section class="app"><header class="top"><div class="brand"><div class="badge">⚡</div><div><h1>金属マスター復習チャレンジ</h1><p>高校化学基礎｜金属の性質と結合</p></div></div><div class="progress-wrap"><b id="progressText">学習スタート</b><div class="bar"><i id="progressBar"></i></div></div></header>
<section class="view" id="startView"><div class="start-hero"><h2>金属をマスターしよう</h2><p>短い四択で、金属結合・金属の性質・合金をテンポよく復習します。<br>基礎編と応用編を完走すると、元素記号チャレンジが開きます。</p></div><div class="stage-grid"><div class="stage"><strong>🔷 基礎編　10問</strong><small>自由電子・金属結合・金属の性質</small></div><div class="stage"><strong>🟣 応用編　10問</strong><small>代表金属・利用・合金の基本</small></div><div class="stage"><strong>🌟 エクストラ　10問</strong><small>元素記号チャレンジ（解放式）</small></div></div><fieldset class="number-box"><legend>学習の記録</legend><div class="choice-row"><label><input type="radio" name="mode" value="number" checked> 出席番号で記録</label><label><input type="radio" name="mode" value="free"> 自由学習</label></div><input id="studentNo" class="number-input" inputmode="numeric" maxlength="4" placeholder="出席番号（4桁）"><div class="mini-note">途中で閉じても、この端末では続きから再開できます。</div></fieldset><button id="startBtn" class="primary start-btn">基礎編をはじめる →</button><div id="resumeBox" class="mini-note hidden"><button id="resumeBtn" class="ghost">前回の続きから再開</button></div></section>
<section class="view hidden" id="quizView"><div class="qhead"><span id="stageName" class="pill"></span><span id="questionCount"></span></div><h2 class="question" id="questionText"></h2><div id="diagram" class="diagram hidden"></div><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="hintBtn" class="secondary">ヒントを見る</button><button id="answerBtn" class="ghost">答えを見る</button><button id="checkBtn" class="primary">答え合わせ</button><button id="nextBtn" class="primary next hidden">次の問題へ →</button></div></section>
<section class="view hidden result" id="unlockView"><div class="badge" style="margin:auto">🔓</div><h2>基礎編クリア！</h2><div class="title-card"><span>次のステージ</span><b>🟣 応用編 解放</b></div><p>代表金属・利用・合金の基本を、10問で確認します。</p><div class="actions"><button id="unlockStart" class="primary">応用編をはじめる →</button><button id="unlockHome" class="ghost">ホームに戻る</button></div></section>
<section class="view hidden result" id="resultView"><div id="resultContent"></div></section>
</section></main>
<script>
const B=[
['B01','金属結晶を結びつける力として最も適切なものはどれですか。','ion-electron','金属陽イオンと自由電子の間の引力','金属陽イオンどうしの引力','金属分子どうしの引力','金属と水の間の引力','正の電荷をもつ粒子と、負の電荷をもつ粒子に注目。','金属陽イオンと、結晶全体を動ける自由電子の間の引力が金属結合です。'],
['B02','金属結晶の「自由電子」とは、どのような電子ですか。','mobile','結晶内を動ける電子','一つの原子から離れられない電子','金属の表面にしかない電子','原子核の中にある電子','「自由」は動けることを表します。','自由電子は特定の原子に固定されず、金属結晶内を動けます。'],
['B03','金属が固体のまま電気を通しやすい主な理由はどれですか。','charge-carrier','自由電子が電荷を運べるから','電流で必ず溶けるから','金属分子が導線を流れるから','金属陽イオンが外へ飛び出すから','結晶内で移動できる粒子を思い出そう。','金属では自由電子が移動して電荷を運びます。'],
['B04','金属が熱を伝えやすいことに深く関わるものはどれですか。','energy-carrier','自由電子による熱エネルギーの移動','密度の大きさだけ','金属の色だけ','金属内を流れる水','電気を伝えやすい理由と共通する粒子があります。','自由電子は熱エネルギーの伝達にも関わります。'],
['B05','磨いた金属の表面が光って見える性質を何といいますか。','luster','金属光沢','延性','展性','水への溶解性','「光って見える」という現象の名前です。','金属は光をよく反射し、金属光沢を示します。この反射には自由電子の働きが関わります。'],
['B06','金属をたたいて薄く広げられる性質はどれですか。','malleability','展性','延性','電気伝導性','金属光沢','「広げる」と「長く伸ばす」を区別しよう。','薄い板状に広げられる性質が展性です。'],
['B07','金属を引っ張って細い線にできる性質はどれですか。','ductility','延性','展性','溶解性','磁性','針金のように細く長く伸ばします。','細い線状に引き伸ばせる性質が延性です。'],
['B08','金属が薄く広がったり、細く伸びたりできる理由として適切なものはどれですか。','bond-kept','粒子の層がずれても、自由電子による結合が保たれるから','変形すると自由電子が消えるから','変形すると液体になるから','粒子の間に力が全くないから','形が変わった後も、自由電子は結晶内にあります。','粒子の層がずれても自由電子による結合が保たれるため、金属は変形できます。'],
['B09','一般に、純金属の温度を上げると電気の通りやすさはどうなりますか。','decrease','低くなる','高くなる','必ず変わらない','温度を上げると金属ではなくなる','温度が上がると、結晶をつくる粒子の振動が激しくなります。','一般に純金属では、温度が上がると自由電子の移動が妨げられ、電気伝導性は低下します。'],
['B10','金属結晶とイオン結晶について、一般に正しい説明はどれですか。','metal-solid','金属結晶は固体のまま電気を通す','イオン結晶だけが固体のまま電気を通す','どちらも電気を通すことはない','どちらも気体にならないと電気を通さない','金属結晶には、固体の中を動ける電子があります。','金属結晶は自由電子が動けるため固体でも電気を通します。イオン結晶は通常、固体のままでは電気を通しません。']];
const A=[
['A01','次の純金属のうち、常温で電気を最もよく通すものはどれですか。','silver','銀','銅','金','アルミニウム','銀・銅・金の順を思い出そう。','銀はこれらの中で電気伝導性が最も高い金属です。'],['A02','電線に広く使われる金属はどれですか。','copper','銅','水銀','鉛','金','電気をよく通し、銀より実用的な価格の金属です。','銅は電気をよく通すため、電線に広く使われます。'],['A03','1円硬貨の材料として使われている金属はどれですか。','aluminum','アルミニウム','銅','鉄','亜鉛','軽い金属として知られます。','日本の1円硬貨はアルミニウム製です。「水に浮くほど軽い」とは言えません。'],['A04','金（Au）の性質として適切なものはどれですか。','stable','空気中で酸化されにくい','空気中ですぐに赤さびができる','常温で液体である','電気を全く通さない','金は装飾品にも使われ、色が変わりにくい金属です。','金は化学的に安定で、空気中で酸化されにくい金属です。'],['A05','常温で液体である金属はどれですか。','mercury','水銀','鉄','銅','アルミニウム','金属でも、常温で固体とは限りません。','水銀は常温で液体の金属です。'],['A06','鉄を主成分とする材料の身近な利用例はどれですか。','building-steel','建物の骨組みに使う鋼材','1円硬貨','水銀温度計の液体','金の指輪','「鉄骨」という言葉を思い出そう。','鉄を主成分とする鋼材は、建物の骨組みなどに使われます。'],['A07','合金の説明として最も適切なものはどれですか。','alloy','金属を主成分とし、ほかの元素を加えてつくる材料','金属の表面だけを磨いたもの','金属を水に溶かした水溶液','異なる金属を隣に置いただけのもの','黄銅やジュラルミンは、複数の元素を組み合わせています。','合金は金属を主成分とし、ほかの元素を加えてつくる材料です。加える元素は金属とは限りません。'],['A08','黄銅（真ちゅう）の主な成分はどれですか。','cu-zn','銅と亜鉛','銅とスズ','鉄と炭素','アルミニウムと銅','「黄銅」は銅を含む合金です。','黄銅は銅と亜鉛を主な成分とする合金です。'],['A09','ジュラルミンの説明として適切なものはどれですか。','light-strong','アルミニウムを主成分とし、軽くて強い合金','銅と亜鉛からなる合金','常温で液体の純金属','電気を全く通さない材料','軽さを生かして航空機にも使われます。','ジュラルミンはアルミニウムを主成分とする、軽くて強い合金です。'],['A10','金属を接合する「はんだ」に利用される主な性質はどれですか。','low-melting','比較的低い温度で溶ける','強い磁石になる','透明になる','どんな金属よりも融点が高い','接合するときには、一度溶かして使います。','はんだは比較的低い温度で溶け、金属の接合に使われます。鉛を含まない種類もあります。']];
const E=[['E01','鉄の元素記号はどれですか。','fe','Fe','Cu','Zn','Ni','アルファベット2文字、最初はF。','鉄はFeです。'],['E02','銅の元素記号はどれですか。','cu','Cu','Co','Cr','Ca','最初はC、2文字目はu。','銅はCuです。'],['E03','銀の元素記号はどれですか。','ag','Ag','Au','Al','As','金のAuとは異なります。','銀はAgです。'],['E04','金の元素記号はどれですか。','au','Au','Ag','Al','Ar','銀のAgとは異なります。','金はAuです。'],['E05','アルミニウムの元素記号はどれですか。','al','Al','Ag','Au','Ar','名前の初めの2文字に近い形です。','アルミニウムはAlです。'],['E06','元素記号Znはどの金属を表しますか。','zinc','亜鉛','スズ','ニッケル','鉛','英語名はzincです。','Znは亜鉛です。'],['E07','元素記号Pbはどの金属を表しますか。','lead','鉛','白金','パラジウム','カリウム','放射線の遮蔽材にも使われる金属です。','Pbは鉛です。'],['E08','元素記号Snはどの金属を表しますか。','tin','スズ','銀','ナトリウム','ストロンチウム','はんだの主成分になる金属です。','Snはスズです。'],['E09','元素記号Niはどの金属を表しますか。','nickel','ニッケル','ニオブ','ナトリウム','亜鉛','英語名nickelの初めの2文字です。','Niはニッケルです。'],['E10','元素記号Mgはどの金属を表しますか。','magnesium','マグネシウム','マンガン','水銀','モリブデン','マンガンのMnと混同しないように。','Mgはマグネシウムです。']];
E[9]=['E10','水銀の元素記号はどれですか。','hg','Hg','Mg','Mn','Ag','常温で液体の金属を思い出そう。','水銀はHgです。'];
const groups={basic:B,advanced:A,extra:E},labels={basic:'基礎編',advanced:'応用編',extra:'🌟 エクストラ：元素記号'},KEY='metal-learning-guild-v2';
const fresh=student=>({screen:'quiz',stage:'basic',index:0,student,results:{basic:[],advanced:[],extra:[]},questions:{},review:false,mainCompletedAt:null,extraCompletedAt:null});let state=fresh('自由学習');
const $=id=>document.getElementById(id);const key=()=>`${state.stage}-${state.index}`;const now=()=>new Date().toISOString();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function show(id){state.screen=id==='resultView'?'result':'quiz';['startView','quizView','resultView'].forEach(v=>$(v).classList.toggle('hidden',v!==id));save()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function qObj(q){return{id:q[0],text:q[1],answer:q[2],choices:[{id:q[2],text:q[3]},{id:'d1',text:q[4]},{id:'d2',text:q[5]},{id:'d3',text:q[6]}],hint:q[7],explain:q[8]}}function qState(q){const k=key();if(!state.questions[k])state.questions[k]={order:shuffle(q.choices.map(c=>c.id)),selected:null,hint:false,revealed:false,checked:false,ok:null};return state.questions[k]}

function feedback(q,p){if(p.checked)return `<b>${p.ok?'✅ 正解！':'🔍 ここを確認しよう'}</b>${q.explain}<details><summary>ヒントをもう一度見る</summary>${q.hint}</details>`;if(p.revealed)return `<b>答え：${q.choices.find(c=>c.id===q.answer).text}</b>${q.explain}<details open><summary>解説</summary>${q.explain}</details>`;if(p.hint)return `<b>💡 ヒント</b>${q.hint}`;return ''}

function show(id){state.screen=id==='resultView'?'result':id==='unlockView'?'unlock':id==='startView'?'home':'quiz';['startView','quizView','unlockView','resultView'].forEach(v=>$(v).classList.toggle('hidden',v!==id));save()}

render()};$('resultHome').onclick=home;save()}
