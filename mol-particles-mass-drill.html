olの質量は何 g？ C=12。","answer":12,"unit":"g","hints":["C原子1 mol分の質量を考えます。","Cのモル質量は12 g/molです。"],"explanation":"1 mol × 12 g/mol = 12 g。したがってC原子6.0×10²³個は12 gです。","wrong":"個→mol→gの2歩目です。","carry":"前の問い：C原子6.0×10²³個 = 1 mol。","visual":"c","tip":""},{"id":"B03","stage":"bridge","kind":"number","prompt":"C原子12 gは何 mol？ C=12。","answer":1,"unit":"mol","hints":["質量からmolへ戻します。","C原子のモル質量は12 g/molです。"],"explanation":"12 g ÷ 12 g/mol = 1 mol。","wrong":"ここから個数へ進みます。","carry":"","visual":"c","tip":""},{"id":"B04","stage":"bridge","kind":"number","prompt":"前の問いで、C原子12 gは1 molと求めました。このC原子1 molは何個？","answer":6,"unit":"×10²³個","hints":["molから個へ変えます。","個数は物質量に1 molあたりの粒子数を掛けて求めます。"],"explanation":"1 mol × 6.0×10²³個/mol = 6.0×10²³個。したがってC原子12 gはこの個数です。","wrong":"g→mol→個の2歩目です。","carry":"前の問い：C原子12 g = 1 mol。","visual":"c","tip":""},{"id":"B05","stage":"bridge","kind":"number","prompt":"O₂分子12×10²³個は何 mol？","answer":2,"unit":"mol","hints":["6.0×10²³個が1 molです。","12÷6.0を考えます。"],"explanation":"12×10²³個 ÷ 6.0×10²³個/mol = 2 mol。","wrong":"12×10²³個のまま計算できます。","carry":"","visual":"o2","tip":""},{"id":"B06","stage":"bridge","kind":"number","prompt":"前の問いで、O₂分子12×10²³個は2 molと求めました。このO₂分子2 molの質量は何 g？ O₂のモル質量は32 g/mol。","answer":64,"unit":"g","hints":["molからgへ進みます。","2 molに32 g/molを掛けます。"],"explanation":"2 mol × 32 g/mol = 64 g。したがってO₂分子12×10²³個は64 gです。","wrong":"前の答えを画面に残して2歩目を解きます。","carry":"前の問い：O₂分子12×10²³個 = 2 mol。O₂のモル質量は32 g/mol。","visual":"o2","tip":""},{"id":"B07","stage":"bridge","kind":"number","prompt":"CO₂ 22 gは何 mol？ CO₂のモル質量は44 g/mol。","answer":0.5,"unit":"mol","hints":["gからmolへ戻します。","22 gは1 mol分44 gの半分です。"],"explanation":"22 g ÷ 44 g/mol = 0.5 mol。","wrong":"次にCO₂分子の個数を求めます。","carry":"","visual":"co2","tip":"今度は逆向きの「g→mol→個」。まずモル質量で割ってmolを求め、その値を次の問いに引き継ぎます。"},{"id":"B08","stage":"bridge","kind":"number","prompt":"前の問いで、CO₂ 22 gは0.5 molと求めました。このCO₂分子0.5 molは何個？","answer":3,"unit":"×10²³個","hints":["molから個へ進みます。","0.5×6.0を考えます。"],"explanation":"0.5 mol × 6.0×10²³個/mol = 3.0×10²³個。したがってCO₂ 22 gは3.0×10²³分子です。","wrong":"g→mol→個の2歩目です。","carry":"前の問い：CO₂ 22 g = 0.5 mol。","visual":"co2","tip":""},{"id":"B09","stage":"bridge","kind":"number","prompt":"H₂O 9 gは何 mol？ H₂Oのモル質量は18 g/mol。","answer":0.5,"unit":"mol","hints":["まずgからmolへ戻します。","9 gは18 gの半分です。"],"explanation":"9 g ÷ 18 g/mol = 0.5 mol。","wrong":"次はこのmolを使います。","carry":"","visual":"water","tip":""},{"id":"B10","stage":"bridge","kind":"number","prompt":"前の問いで、H₂O 9 gは0.5 molと求めました。このH₂O分子0.5 molは何個？","answer":3,"unit":"×10²³個","hints":["molから個へ進みます。","0.5×6.0を考えます。"],"explanation":"0.5 mol × 6.0×10²³個/mol = 3.0×10²³個。したがってH₂O 9 gは3.0×10²³分子です。","wrong":"分子の個数と原子の個数を混同しません。","carry":"前の問い：H₂O 9 g = 0.5 mol。","visual":"water","tip":""},{"id":"B11","stage":"bridge","kind":"number","prompt":"C原子24 gは「□×10²³個」で何個？ C=12。","answer":12,"unit":"×10²³個","hints":["まず24 gが何molかを考えます。","Cのモル質量は12 g/mol。molに直してから個数へ進みます。"],"explanation":"24 g ÷ 12 g/mol = 2 mol。2×6.0×10²³=12×10²³個。","wrong":"12×10²³個のままで正解です。","carry":"","visual":"c","tip":"ここからは一問の中で「g→mol→個」の2歩をつなげます。途中のmolはヒントで確認できます。"},{"id":"B12","stage":"bridge","kind":"number","prompt":"CO₂分子3.0×10²³個の質量は何 g？ CO₂のモル質量は44 g/mol。","answer":22,"unit":"g","hints":["まず個数をmolへ変えます。","個数を6.0×10²³個/molで割り、そのmolに44 g/molを掛けます。"],"explanation":"3.0×10²³個 ÷ 6.0×10²³個/mol = 0.5 mol。0.5×44=22 g。","wrong":"個→mol→gの2歩をつなげます。","carry":"","visual":"co2","tip":""},{"id":"F01","stage":"boss","kind":"number","prompt":"O₂分子2 molは「□×10²³個」で何個？","answer":12,"unit":"×10²³個","hints":["molから個への向きを確認します。","1 mol分の6.0×10²³個を2倍します。"],"explanation":"2×6.0×10²³=12×10²³個。1.2×10²⁴個とも同じですが、直す必要はありません。","wrong":"個数を出すときは掛け算です。","carry":"","visual":"o2","tip":""},{"id":"F02","stage":"boss","kind":"number","prompt":"CO₂ 44 gは何 mol？ CO₂のモル質量は44 g/mol。","answer":1,"unit":"mol","hints":["gからmolへ戻します。","1 mol分の質量と比べます。"],"explanation":"44 g ÷ 44 g/mol = 1 mol。","wrong":"gからmolへは割り算です。","carry":"","visual":"co2","tip":""},{"id":"F03","stage":"boss","kind":"number","prompt":"H₂O 9 gは「□×10²³個」で何個のH₂O分子？ H₂Oのモル質量は18 g/mol。","answer":3,"unit":"×10²³個","hints":["g→mol→個とたどります。","9 gを18 g/molで割り、途中のmolを出してから個数へ変えます。"],"explanation":"9÷18=0.5 mol、0.5×6.0×10²³=3.0×10²³個。","wrong":"gを直接個数に変えず、molを経由します。","carry":"","visual":"water","tip":""},{"id":"F04","stage":"boss","kind":"number","prompt":"C原子12×10²³個の質量は何 g？ C=12。","answer":24,"unit":"g","hints":["個→mol→gとたどります。","個数を6.0×10²³で割り、Cのモル質量を使います。"],"explanation":"12×10²³ ÷ 6.0×10²³=2 mol。2×12=24 g。","wrong":"12×10²³を1.2×10²⁴に直さなくても解けます。","carry":"","visual":"c","tip":""},{"id":"F05","stage":"boss","kind":"number","prompt":"CO₂ 22 gは「□×10²³個」で何個のCO₂分子？ CO₂のモル質量は44 g/mol。","answer":3,"unit":"×10²³個","hints":["g→mol→個とたどります。","22 gを44 g/molで割り、途中のmolを出してから個数へ変えます。"],"explanation":"22÷44=0.5 mol、0.5×6.0×10²³=3.0×10²³個。","wrong":"二段階換算の途中のmolを書き出して考えます。","carry":"","visual":"co2","tip":""}]};
const STAGES=DATA.stages,Q=DATA.questions,KEY='chem-mol-journey-v2',VERSION=2;
const ESC=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const stageOf=q=>STAGES.findIndex(s=>s.id===q.stage);
const stageQs=i=>Q.filter(q=>q.stage===STAGES[i].id);
const indexOfId=id=>Q.findIndex(q=>q.id===id);
const newRecord=()=>({first:null,correct:false,attempts:0,hints:0,revealed:false,draft:'',feedback:''});
const fresh=()=>({version:VERSION,seat:'',started:false,date:'',screen:'home',index:0,records:Object.fromEntries(Q.map(q=>[q.id,newRecord()])),choiceOrders:{},introSeen:[],bossFinished:false,reviewMode:'',reviewQueue:[],reviewAt:0,reviewReturn:'map',calcHistory:[]});
let state=fresh(),invalidRecord=false,saveOK=true,calcExpr='';
function valid(x){return x&&x.version===VERSION&&/^(|[0-9]{4})$/.test(x.seat)&&typeof x.started==='boolean'&&['home','map','intro','question','level','result'].includes(x.screen)&&Number.isInteger(x.index)&&x.index>=0&&x.index<Q.length&&typeof x.bossFinished==='boolean'&&x.records&&Q.every(q=>{let r=x.records[q.id];return r&&[null,true,false].includes(r.first)&&typeof r.correct==='boolean'&&Number.isInteger(r.attempts)&&r.attempts>=0&&Number.isInteger(r.hints)&&r.hints>=0&&r.hints<=2&&typeof r.revealed==='boolean'&&typeof r.draft==='string'&&r.draft.length<100&&(q.kind==='choice'?(r.draft===''||q.options.some(o=>o.id===r.draft)):/^[0-9.．]*$/.test(r.draft))&&['','good','bad','reveal'].includes(r.feedback)})&&x.choiceOrders&&typeof x.choiceOrders==='object'&&Q.filter(q=>q.kind==='choice').every(q=>{let o=x.choiceOrders[q.id];return (!x.started&&o===undefined)||Array.isArray(o)&&o.length===q.options.length&&new Set(o).size===o.length&&o.every(id=>q.options.some(v=>v.id===id))})&&Array.isArray(x.introSeen)&&x.introSeen.every(i=>Number.isInteger(i)&&i>=0&&i<STAGES.length)&&['','all','boss','stage'].includes(x.reviewMode)&&Array.isArray(x.reviewQueue)&&x.reviewQueue.every(id=>indexOfId(id)>=0)&&(!x.reviewMode||x.reviewQueue.length>0)&&Number.isInteger(x.reviewAt)&&x.reviewAt>=0&&x.reviewAt<Math.max(1,x.reviewQueue.length)&&['map','result'].includes(x.reviewReturn)&&(!x.started||/^\d{4}-\d\d-\d\dT/.test(x.date))&&(!x.bossFinished||x.records[Q[Q.length-1].id].first!==null)&&Q.every(q=>{let r=x.records[q.id];return !(r.first===true&&!r.correct)&&!(r.correct&&r.attempts===0)&&!(r.feedback==='good'&&!r.correct)})&&Array.isArray(x.calcHistory)&&x.calcHistory.length<=20}
let storedRaw;try{storedRaw=localStorage.getItem(KEY);if(storedRaw){let parsed=JSON.parse(storedRaw);if(valid(parsed))state=parsed;else invalidRecord=true}}catch(e){if(storedRaw)invalidRecord=true;else saveOK=false}
function save(){if(invalidRecord)return;try{localStorage.setItem(KEY,JSON.stringify(state));saveOK=true}catch(e){saveOK=false}}
function makeChoiceOrders(){let wanted=[2,0,3,1,0,2,1],j=0;for(let k=wanted.length-1;k>0;k--){let m=Math.floor(Math.random()*(k+1));[wanted[k],wanted[m]]=[wanted[m],wanted[k]]}for(let q of Q.filter(q=>q.kind==='choice')){if(state.choiceOrders[q.id])continue;let ids=q.options.map(o=>o.id),answer=q.answer,other=ids.filter(id=>id!==answer);for(let k=other.length-1;k>0;k--){let m=Math.floor(Math.random()*(k+1));[other[k],other[m]]=[other[m],other[k]]}let position=wanted[j++%wanted.length],order=other.slice();order.splice(position,0,answer);state.choiceOrders[q.id]=order}}
function rec(q){return state.records[q.id]}
function current(){return state.reviewMode?Q[indexOfId(state.reviewQueue[state.reviewAt])]:Q[state.index]}
function stageIndex(){return stageOf(Q[state.index])}
function stageDone(i){return stageQs(i).filter(q=>rec(q).correct).length}
function totalDone(){return Q.filter(q=>rec(q).correct).length}
function firstCorrect(){return Q.filter(q=>rec(q).first===true).length}
function bossStats(){let a=stageQs(5);return {first:a.filter(q=>rec(q).first===true).length,correct:a.filter(q=>rec(q).correct).length,attempted:a.filter(q=>rec(q).first!==null).length}}
function allBossAttempted(){return bossStats().attempted===5}
function status(){let level=Math.min(6,stageIndex()+1),done=totalDone();document.getElementById('top-right').innerHTML=`<span class="chip">Lv. ${level}</span><span class="chip">${done}/${Q.length} 問正答</span>${state.seat?`<span class="chip">出席番号 ${ESC(state.seat)}</span>`:''}`}
function alertSave(){return !saveOK?'<div class="note"><strong>保存できません</strong><br>途中保存できないため、この画面を閉じず、結果画面を撮影してください。</div>':''}
function home(){let done=totalDone();return `<section class="hero"><span class="eyebrow">MOLE ADVENTURE</span><h1>物質量の旅</h1><p>ダース村から魔王の館へ。ひとつずつ理解を積み上げ、mol・個数・質量を行き来できるようになる冒険ドリルです。</p></section><div class="grid"><section class="panel"><h2>旅のはじめに</h2><p class="muted">全${Q.length}問。やさしい問いから繰り返し練習し、最後は5問の総合戦に挑みます。最終5戦をすべて正答すると合格です。1回で終える必要はなく、電車の中でも途中から再開できます。</p><div class="overview"><div><b>5</b><small>学習の区間</small></div><div><b>${Q.length}</b><small>小さな問い</small></div><div><b>5</b><small>最後の戦い</small></div></div>${invalidRecord?`<div class="invalid">このアプリの保存記録は現在の版と合わず、安全に読み込めません。記録は自動削除していません。「はじめから始める」で、このアプリの記録だけを初期化できます。</div><div class="buttons"><button class="button danger" data-action="reset">このアプリの記録を初期化</button></div>`:state.started?`<div class="note"><strong>続きから再開できます</strong><br>${done}問を正答済み。出席番号はこの冒険を初期化するまで固定されます。</div><div class="buttons"><button class="button" data-action="continue">冒険を続ける</button><button class="button secondary" data-action="map">冒険マップを見る</button><button class="button danger" data-action="reset">はじめから始める</button></div>`:`<label class="label" for="seat">出席番号（4桁・自由学習なら空欄）</label><input id="seat" class="input" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="例：1201" value="${ESC(state.seat)}"><div class="small">提出する場合は、学校の指示に従って番号を入力してください。開始後は編集できません。</div><p class="error" id="seat-error" role="alert"></p><div class="buttons"><button class="button" data-action="start">冒険をはじめる</button></div>`}${alertSave()}<div class="home-foot">ヒントは何度でも使えます。得点は減りません。</div></section><aside class="panel"><h2>この旅でできるようになること</h2><p class="muted">① ダースを手がかりに、molを「個数のまとまり」として理解する。</p><p class="muted">② 6000垓と6.0×10²³をつなげる。</p><p class="muted">③ モル質量を自分で求め、mol⇄gを解く。</p><p class="muted">④ 個⇄mol⇄gの二段階をたどる。</p><div class="aside-card"><b>使う値</b>1 mol = 6.0×10²³個。原子量は必要な問題に表示します。</div></aside></div>`}

][i];return `<svg viewBox="0 0 48 48" width="38" height="38" aria-hidden="true">${art}</svg>`}
function map(){let unlocked=stageIndex(),done=totalDone();let cards=STAGES.map((s,i)=>{let count=stageDone(i),total=stageQs(i).length,complete=count===total,active=i===unlocked;return `<button class="stop ${complete?'done':active?'current':'locked'}" style="--stop-color:${s.color}" data-stage="${i}" ${i>unlocked?'disabled':''}><span class="stop-icon">${sceneIcon(i)}</span><span class="stop-text"><b>${i===5?'最終戦 ':`第${i+1}区間 `}${s.name}</b><small>${s.subtitle} ・ ${count}/${total}問</small></span><span class="stop-tag">${complete?'★ 達成':active?'ここにいる':'未解放'}</span></button>`}).join('');return `<section class="hero"><span class="eyebrow">ADVENTURE MAP</span><h1>冒険マップ</h1><p>一問ずつ正答すると道が開きます。各区間を終えるとレベルアップ。魔王の館では、これまでの力を5戦で試します。</p></section><div class="grid"><section class="panel"><div class="map-board"><div class="map-title">✦ mol・個・g の道</div><div class="map-stops">${cards}</div></div><div class="buttons"><button class="button" data-action="continue">${state.screen==='result'?'結果を見る':'現在地から進む'}</button><button class="button ghost" data-action="home">ホームに戻る</button>${state.started?'<button class="button danger" data-action="reset">はじめから始める</button>':''}</div>${alertSave()}</section><aside class="panel"><h2>旅の記録</h2><div class="aside-card"><b>正答した問い</b>${done} / ${Q.length}問</div><div class="aside-card"><b>初回で正答</b>${firstCorrect()}問</div><div class="aside-card"><b>現在のレベル</b>Lv. ${Math.min(6,unlocked+1)}</div><p class="muted">途中でホームに戻っても、正答・ヒント・再挑戦の記録は保存されます。</p><div class="scrollline"><b>✦ コツ</b> 迷ったら真ん中のmolに戻ろう。</div></aside></div>`}
function mainSummary(i){if(i===0)return '';let left='<div class="formula"><b>mol → 個</b><span>mol × 6.0×10²³</span></div><div class="formula"><b>個 → mol</b><span class="fraction"><span class="topnum">個数</span><span class="bottomnum">6.0×10²³ 個/mol</span></span></div>';let right='<div class="formula"><b>mol → g</b><span>mol × モル質量</span></div><div class="formula"><b>g → mol</b><span class="fraction"><span class="topnum">質量</span><span class="bottomnum">モル質量</span></span></div>';return `<h3>ここまでの換算をまとめよう</h3><div class="formula-area">${i===1?left:i===2?'<div class="formula"><b>新しい単位</b><span>g/mol = 1 molあたりの質量</span></div>'+left:left+right}</div>`}
function intro(){let i=stageIndex(),s=STAGES[i],count=stageQs(i).length;let special=i===5?'<div class="boss-scene"><div class="boss-orb">✦</div><div class="boss-stars"><span>☆ ☆ ☆ ☆ ☆</span></div></div>':'';return `<section class="hero"><span class="eyebrow">LEVEL ${i+1} / 6</span><h1>${s.icon} ${s.name}</h1><p>${s.subtitle}</p></section><div class="grid"><section class="panel"><h2>この区間の目標</h2><p class="muted">${s.target}</p>${special}<div class="lesson-tip"><b>✦ 学習チップス</b><br>${s.tip}</div>${mainSummary(i)}<div class="note"><strong>${i===5?'最終5戦':'この区間は'+count+'問'}</strong><br>${i===5?'最終的に5問すべてを正答すると合格。まちがえた問題は5戦後に振り返れ、復習で正解した数を合格証に追記します。初回5問正解は金、3〜4問は銀、0〜2問は銅のランクです。':'一問ずつ進みます。答えを見た後でも、もう一度正しく答えてから次へ進めます。'}</div><div class="buttons"><button class="button" data-action="question">${i===5?'最終戦を始める':'問題に進む'}</button><button class="button ghost" data-action="map">マップに戻る</button><button class="button ghost" data-action="home">ホームに戻る</button></div>${alertSave()}</section><aside class="panel"><h2>持ち歩く道具</h2>${formulaGuide(i)}<p class="small">計算は暗算しやすい数値にしています。必要ならボタン式計算機を開けます。</p></aside></div>`}
function formulaGuide(i){return `<div class="aside-card"><b>mol ⇄ 個</b>個数 = mol × 6.0×10²³<br>mol = <span class="fraction"><span class="topnum">個数</span><span class="bottomnum">6.0×10²³ 個/mol</span></span></div><div class="aside-card"><b>mol ⇄ g</b>質量 = mol × モル質量<br>mol = <span class="fraction"><span class="topnum">質量</span><span class="bottomnum">モル質量</span></span></div>${i>=4?'<div class="aside-card"><b>個 ⇄ g</b>必ずmolを通ります。</div>':''}`}
function diagram(q){let a={dozen:['12'],particles:['✧'],o:['O'],o2:['O','O'],water:['H','O','H'],co2:['O','C','O'],mg:['Mg'],c:['C']}[q.visual]||[];if(!a.length)return '';let label=q.visual==='dozen'?'基準の札：1ダースは12個':q.visual==='particles'?'粒子のまとまりを表す記号。図の点の数は実際の個数ではありません':q.visual==='o2'?'O₂分子はO原子2個':q.visual==='water'?'H₂O分子はH原子2個とO原子1個':q.visual==='co2'?'CO₂分子はC原子1個とO原子2個':q.visual==='mg'?'Mg原子':q.visual==='c'?'C原子':'O原子';return `<div class="atom-line" role="img" aria-label="${label}">${a.map(x=>`<span class="atom ${x}">${x}</span>`).join('')}</div><div class="small" style="text-align:center">${label}</div>`}
function route(q){let s=stageOf(q);let parts=s===0?['ダース','個数']:s===1?['mol','個数']:s===2?['化学式','1 molの質量']:s===3?['mol','g']:['個数','mol','g'];return `<div class="route">${parts.map((p,i)=>`${i?'<em>⇄</em>':''}<span>${p}</span>`).join('')}${s>=4?'<span class="tiny">真ん中を通る</span>':''}</div>`}
function feedback(q,r){let cls=r.feedback,answer=q.kind==='number'?`${q.answer} ${q.unit}`:q.options.find(o=>o.id===q.answer).text,title=cls==='good'?'○ 正解！':cls==='bad'?'× 不正解':'✦ 答えを確認';return `<div class="feedback ${cls}" role="status"><h3>${title}</h3><p><b>正答：</b>${answer}</p><p>${q.explanation}</p>${cls==='bad'?`<p>${q.wrong}</p>`:''}<div class="hint"><b>考えるためのヒントを読み返そう</b><p>① ${q.hints[0]}</p><p>② ${q.hints[1]}</p></div>${cls==='good'&&stageOf(q)===5?'<p>館の封印をひとつ解きました。</p>':''}</div>`}
function hints(q,r){return r.hints?`<div class="hint"><b>✦ まほうの手がかり</b>${q.hints.slice(0,r.hints).map((x,i)=>`<p>${i+1}：${x}</p>`).join('')}</div>`:''}
function calculator(){return `<details class="calc"><summary>計算機を使う（計算履歴つき）</summary><div class="calc-body"><div id="calc-screen" class="calc-screen">${ESC(calcExpr)||'0'}</div><div class="calc-keys">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','(',')','⌫','='].map(k=>`<button type="button" data-calc="${k}">${k}</button>`).join('')}</div><div class="calc-history" id="calc-history">${state.calcHistory.slice(-5).reverse().map(x=>`<div>${ESC(x)}</div>`).join('')}</div></div></details>`}
function bossScene(){let bs=bossStats();return `<div class="boss-scene" role="img" aria-label="最終5戦、${bs.correct}勝"><div class="boss-orb">✦</div><div class="boss-stars">${Array.from({length:5},(_,i)=>`<span class="${i<bs.correct?'win':'wait'}">${i<bs.correct?'★':'☆'}</span>`).join('')}</div></div>`}
function question(){let q=current(),r=rec(q),i=stageOf(q),stage=STAGES[i],position=stageQs(i).findIndex(x=>x.id===q.id)+1,review=!!state.reviewMode,stageTotal=stageQs(i).length,done=stageDone(i);let options=q.kind==='choice'?state.choiceOrders[q.id].map(id=>q.options.find(o=>o.id===id)):[];return `<div class="grid"><section class="panel"><div class="stage-head"><span class="stage-label">${review?'復習 ':''}Lv.${i+1} ${stage.name}</span><span class="chip">${review?`${state.reviewAt+1}/${state.reviewQueue.length} 復習`:`${position}/${stageTotal} 問`}</span></div><div class="progress" role="progressbar" aria-valuenow="${review?state.reviewAt:done}" aria-valuemin="0" aria-valuemax="${review?state.reviewQueue.length:stageTotal}"><div style="width:${Math.round((review?state.reviewAt:done)/(review?state.reviewQueue.length:stageTotal)*100)}%"></div></div><h1 class="question-title">${q.prompt}</h1>${i===5?bossScene():''}${route(q)}${diagram(q)}${q.tip?`<div class="lesson-tip"><b>✦ ここから一歩進む</b><br>${q.tip}</div>`:''}${r.feedback?feedback(q,r):`${q.kind==='number'?`<label class="label" for="answer">答えの数値</label><div class="answer-row"><input id="answer" class="input answer-input" type="text" inputmode="decimal" autocomplete="off" value="${ESC(r.draft)}" aria-label="答えの数値"><span class="unit">${q.unit}</span></div><div class="small">例：0.5、12。単位と10の累乗は表示されています。</div>`:`<div class="choices" role="group" aria-label="答えを選ぶ">${options.map(o=>`<button type="button" class="choice ${r.draft===o.id?'selected':''}" data-choice="${o.id}" aria-pressed="${r.draft===o.id?'true':'false'}">${o.text}</button>`).join('')}</div>`}<p id="answer-error" class="error" role="alert"></p><div class="buttons"><button class="button" data-action="grade">こたえる</button><button class="button magic" data-action="hint">✦ まほうをつかう（ヒント） ${r.hints}/2</button><button class="button secondary" data-action="reveal">答えを見る</button></div>${hints(q,r)}`}<div class="buttons">${r.feedback?`${r.feedback==='good'||i===5&&!review?`<button class="button" data-action="next">${i===5&&indexOfId(q.id)===Q.length-1&&!review?'最終結果へ':'次へ進む'}</button>`:`<button class="button" data-action="retry">もう一度解く</button>`}${r.feedback!=='good'&&i===5&&!review?'<button class="button secondary" data-action="retry">今すぐ解き直す</button>':''}`:''}<button class="button ghost" data-action="map">冒険マップ</button><button class="button ghost" data-action="home">ホームに戻る</button></div>${alertSave()}</section><aside class="panel"><h2>旅の道具</h2><div class="aside-card"><b>この区間</b>${done}/${stageTotal}問を正答</div><div class="aside-card"><b>初回正答</b>${firstCorrect()}問</div><p class="small">まほう（ヒント）を使っても、正答数は減りません。</p>${formulaGuide(i)}${calculator()}</aside></div>`}
function level(){let completedStage=stageIndex()-1,s=STAGES[completedStage],next=STAGES[stageIndex()];return `<div class="grid"><section class="panel level-page" style="position:relative;overflow:hidden"><span class="sparkle a">✦</span><span class="sparkle b">✧</span><span class="sparkle c">✦</span><div class="level-crest">${s.icon}</div><span class="eyebrow" style="background:#e9e4ff;color:#574aad">LEVEL UP</span><h1>Lv.${stageIndex()+1} にレベルアップ！</h1><p class="muted">${s.name}を進み、${s.target}ことを確かめました。</p><div class="note"><strong>次の道：${next.name}</strong><br>${next.subtitle}</div><div class="buttons" style="justify-content:center"><button class="button" data-action="map">マップで新しい道を見る</button><button class="button ghost" data-action="home">ホームに戻る</button></div>${alertSave()}</section><aside class="panel"><h2>身についたこと</h2><p class="muted">${s.tip}</p><div class="aside-card"><b>進んだ距離</b>${totalDone()}/${Q.length}問 正答</div></aside></div>`}
function result(){let b=bossStats(),passed=b.correct===5,bonus=b.correct-b.first,rank=b.first===5?'金':b.first>=3?'銀':'銅',pending=stageQs(5).filter(q=>!rec(q).correct),allMiss=Q.filter(q=>rec(q).first===false);return `<section class="hero"><span class="eyebrow">FINAL RECORD</span><h1>${passed?'魔王の館をクリア！':'最終戦の振り返り'}</h1><p>${passed?Q.length+'問の道を歩き、mol・個数・質量をつなげました。':'あと'+pending.length+'問を復習すると、館をクリアできます。ヒントを使って一歩ずつ進みましょう。'}</p></section><div class="grid"><section class="panel"><div class="result-card ${passed?(rank==='金'?'gold':rank==='銀'?'silver':'bronze'):'fail'}"><div class="result-badge">${passed?'✦':'×'}</div><h1>${passed?'合格証':'未合格・提出不可'}</h1>${passed?`<p class="rank-label">${rank}ランクの証</p>`:''}<p>物質量の旅｜mol・個・g ドリル</p><div class="stats"><span>出席番号 ${state.seat||'自由学習'}</span><span>初回合格数 ${b.first}/5問</span><span>現在の合格数 ${b.correct}/5問</span><span>初回正答率 ${Math.round(b.first/5*100)}%</span><span>現在の正答率 ${Math.round(b.correct/5*100)}%</span><span>${new Date().toLocaleDateString('ja-JP')}</span></div><div class="counter-plus">初回 ${b.first}問 ＋ 復習で正解 ${bonus}問 ＝ 現在 ${b.correct}問合格</div>${passed?'<p class="small">必要な場合は、この合格証をスクリーンショットで撮って提出してください。</p>':`<p class="small">合格まであと${pending.length}問。正解した分だけ合格数が増えます。</p>`}</div><div class="buttons">${pending.length?'<button class="button" data-action="review-boss">まちがえた最終戦に挑む</button>':''}${allMiss.length?'<button class="button secondary" data-action="review-all">初回にまちがえた問題を復習</button>':''}<button class="button ghost" data-action="home">ホームに戻る</button><button class="button ghost" data-action="map">冒険マップ</button><button class="button danger" data-action="reset">はじめから始める</button></div>${alertSave()}</section><aside class="panel"><h2>最終5戦の記録</h2><div class="review-list">${stageQs(5).map((q,j)=>{let r=rec(q);return `<div class="review-row"><div><b>${r.correct?'○':r.first===null?'—':'×'} 第${j+1}戦</b><small>${q.prompt}</small></div><span class="chip">${r.correct?r.first?'初回正解':'復習で正解':'復習しよう'}</span></div>`}).join('')}</div><h3 style="margin-top:20px">学習全体</h3><p class="muted">${totalDone()}/${Q.length}問を正答。初回正答 ${firstCorrect()}問。</p><p class="small">復習で正答しても、初回の記録は残ります。</p>${allMiss.length?`<details><summary>初回にまちがえた問い（${allMiss.length}問）</summary><div class="review-list">${allMiss.map(q=>`<div class="review-row"><div><b>${q.id}</b><small>${q.prompt}</small></div></div>`).join('')}</div></details>`:''}</aside></div>`}
function render(){status();document.getElementById('app').innerHTML=invalidRecord?home():state.screen==='home'?home():state.screen==='map'?map():state.screen==='intro'?intro():state.screen==='question'?question():state.screen==='level'?level():result()}
function start(){let field=document.getElementById('seat'),v=field.value.trim();if(v&&!/^[0-9]{4}$/.test(v)){document.getElementById('seat-error').textContent='出席番号は半角数字4桁で入力してください。';field.focus();return}state.seat=v;state.started=true;state.date=new Date().toISOString();makeChoiceOrders();state.screen='map';save();render()}
function reset(){if(!confirm('このアプリの出席番号、回答、ヒント、計算履歴を消して、はじめから始めますか？'))return;try{localStorage.removeItem(KEY)}catch(e){}invalidRecord=false;state=fresh();save();render()}
function go(screen){state.screen=screen;save();render()}
function continueJourney(){if(state.reviewMode){go('question');return}if(state.bossFinished){go('result');return}go(state.introSeen.includes(stageIndex())?'question':'intro')}
function grade(){let q=current(),r=rec(q),v;if(q.kind==='number'){let f=document.getElementById('answer'),raw=f.value.trim().replace('．','.');if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw)){document.getElementById('answer-error').textContent='数値を入力してください。';f.focus();return}v=Number(raw);r.draft=raw}else{if(!r.draft){document.getElementById('answer-error').textContent='答えを選んでください。';return}v=r.draft}let right=q.kind==='number'?Math.abs(v-q.answer)<=Math.max(1e-8,Math.abs(q.answer)*1e-8):v===q.answer;r.attempts++;if(r.first===null)r.first=right;if(right)r.correct=true;r.feedback=right?'good':'bad';save();render()}
function hint(){let r=rec(current());r.hints=Math.min(2,r.hints+1);save();render()}
function reveal(){let r=rec(current());if(r.first===null)r.first=false;r.revealed=true;r.feedback='reveal';save();render()}
function retry(){let r=rec(current());r.feedback='';r.draft='';save();render()}
function next(){let q=current(),r=rec(q);if(!r.feedback)return;let boss=stageOf(q)===5,review=!!state.reviewMode;if(review){if(r.feedback!=='good')return;state.reviewAt++;if(state.reviewAt>=state.reviewQueue.length){state.reviewMode='';state.reviewQueue=[];state.reviewAt=0;state.screen=state.reviewReturn}else{let next=Q[indexOfId(state.reviewQueue[state.reviewAt])];rec(next).feedback='';rec(next).draft='';state.screen='question'}save();render();return}if(!boss&&!r.correct)return;if(boss){if(state.index===Q.length-1){state.bossFinished=true;state.screen='result'}else state.index++;save();render();return}let oldStage=stageOf(q);state.index++;if(stageOf(Q[state.index])!==oldStage)state.screen='level';save();render()}
function beginReview(mode,stage){let ids=mode==='boss'?stageQs(5).filter(q=>!rec(q).correct).map(q=>q.id):mode==='stage'?stageQs(stage).map(q=>q.id):Q.filter(q=>rec(q).first===false).map(q=>q.id);if(!ids.length)return;state.reviewReturn=state.screen==='result'?'result':'map';state.reviewMode=mode;state.reviewQueue=ids;state.reviewAt=0;let r=rec(Q[indexOfId(ids[0])]);r.feedback='';r.draft='';state.screen='question';save();render()}
function calc(key){if(key==='C')calcExpr='';else if(key==='⌫')calcExpr=calcExpr.slice(0,-1);else if(key==='='){let source=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/(). ]+$/.test(source)||!source.trim())return;try{let result=Function('"use strict";return ('+source+')')();if(Number.isFinite(result)){result=Number(result.toPrecision(10));state.calcHistory.push(calcExpr+' = '+result);state.calcHistory=state.calcHistory.slice(-20);calcExpr=String(result);save()}else calcExpr='計算できません'}catch(e){calcExpr='式を確認'}}else{if(calcExpr==='計算できません'||calcExpr==='式を確認')calcExpr='';calcExpr+=key}let screen=document.getElementById('calc-screen');if(screen)screen.textContent=calcExpr||'0';let hist=document.getElementById('calc-history');if(hist)hist.innerHTML=state.calcHistory.slice(-5).reverse().map(x=>`<div>${ESC(x)}</div>`).join('')}
document.addEventListener('click',e=>{let choice=e.target.closest('[data-choice]');if(choice){let r=rec(current());r.draft=choice.dataset.choice;save();document.querySelectorAll('[data-choice]').forEach(el=>{let yes=el===choice;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',String(yes))});return}let key=e.target.closest('[data-calc]');if(key){calc(key.dataset.calc);return}let stop=e.target.closest('[data-stage]');if(stop){let i=Number(stop.dataset.stage);if(i>stageIndex())return;if(i===stageIndex())continueJourney();else beginReview('stage',i);return}let action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'start':start();break;case'reset':reset();break;case'home':go('home');break;case'map':go('map');break;case'continue':continueJourney();break;case'question':state.introSeen.push(stageIndex());go('question');break;case'grade':grade();break;case'hint':hint();break;case'reveal':reveal();break;case'retry':retry();break;case'next':next();break;case'review-boss':beginReview('boss');break;case'review-all':beginReview('all');break}});
document.addEventListener('input',e=>{if(e.target.id==='answer'){let r=rec(current());r.draft=e.target.value.replace(/[^0-9.．]/g,'').slice(0,99);e.target.value=r.draft;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();grade()}});
render();
</script></body></html>
