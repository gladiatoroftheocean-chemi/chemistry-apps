 {id:'density',symbol:'⚖',title:'密度からモル質量へ',lead:'同じ体積に入る質量を調べ、1 molの重さへつなげよう。',summary:'密度＝質量÷体積 ／ 標準状態では M＝d×22.4'},

function templeQ(id,topic,text,value,unit,figures,hint,solution,misconception){const q=makeQ(id,text,value,unit,hint,solution,misconception,'',figures);q.topic=topic;q.options.forEach(o=>o.label=o.label.trim());return q}

 templeQ('tp2','atoms','二酸化炭素分子 CO₂ が0.50 molある。含まれるすべての原子を合わせると何molか。',1.5,'mol',2,'CとOを両方数え、分子1個に含まれる原子数の合計を考えよう。','CO₂はCが1個、Oが2個、合計3個。0.50×3＝1.5 mol。','酸素原子だけなら2倍ですが、この問いはすべての原子の合計です。'),

 templeQ('tp4','density',`${GAS}で、理想気体とみなせる気体の密度が1.25 g/Lである。モル体積を22.4 L/molとして、モル質量は何g/molか。`,28,'g/mol',3,'1 Lあたりの質量を、1 mol分の体積に広げて考えよう。','M＝d×22.4。1.25 g/L × 22.4 L/mol＝28.0 g/mol。','密度g/Lとモル質量g/molは別の量。Lが消えるように掛けます。'),
 templeQ('tp5','average','窒素N₂（分子量28.0）と酸素O₂（分子量32.0）を、物質量比1：1で混ぜた。平均分子量はいくらか。比は正確な値とする。',30,'',3,'分子量にそれぞれの物質量の割合を掛けて足そう。平均分子量に単位は付けません。','平均分子量＝(28.0×1＋32.0×1)÷(1＋1)＝30.0。等しい物質量なので、今回は単純平均と一致します。','平均分子量は単位なし。平均モル質量なら、同じ数値の30.0 g/molです。'),
 templeQ('tp6','average','水素H₂（分子量2.00）と窒素N₂（分子量28.0）を、物質量比3：1で混ぜた。平均分子量はいくらか。比は正確な値とする。',8.5,'',3,'どちらの分子が多いかを確かめ、比の合計で割ろう。','平均分子量＝(2.00×3＋28.0×1)÷4＝8.50。水素が多いので、水素側に近い値です。','成分が2種類でも2で割りません。物質量比の合計3＋1で割ります。')
];

 templeQ('te3','density','ある気体11.2 Lの質量が14.0 gだった。この気体の密度は何g/Lか。',1.25,'g/L',3,'1 Lあたりの質量を、与えられた質量と体積から求めよう。','密度＝14.0 g ÷ 11.2 L＝1.25 g/L。','密度を求めるだけなので、モル質量や22.4 L/molを使う必要はありません。'),

 templeQ('te5','average','窒素N₂（分子量28.0）と酸素O₂（分子量32.0）を、物質量比3：1で混ぜた。平均分子量はいくらか。比は正確な値とする。',29,'',3,'多い成分の分子量に大きな重みを付けよう。','(28.0×3＋32.0×1)÷4＝29.0。窒素が多いので、28.0に近い値になります。','28.0と32.0を単純平均すると、3：1という混合比を無視してしまいます。'),
 templeQ('te6','average','同じ温度・圧力で、水素H₂（分子量2.00）と窒素N₂（分子量28.0）を体積比1：3で混ぜた。理想気体とみなすときの平均分子量はいくらか。比は正確な値とする。',21.5,'',3,'同温同圧の理想気体では、体積比は物質量比と同じです。','物質量比も1：3。(2.00×1＋28.0×3)÷4＝21.5。','体積比を質量比と取り違えないこと。理想気体の同温同圧という条件が必要です。')
];
function freshTempleStudy(){return {mode:'hall',topic:'atoms',lessons:[],practicePassed:[],practice:{id:'tp1',choice:null,hinted:false},exam:null,claimed:false}}
function validateTempleStudy(t){
 const fail=()=>{throw Error('神殿の学習記録を確認できません')};
 if(!t||!['hall','lesson','practice','exam','result','reward'].includes(t.mode)||!TEMPLE_TOPICS.some(x=>x.id===t.topic)||!Array.isArray(t.lessons)||new Set(t.lessons).size!==t.lessons.length||t.lessons.some(id=>!TEMPLE_TOPICS.some(x=>x.id===id))||!Array.isArray(t.practicePassed)||new Set(t.practicePassed).size!==t.practicePassed.length||t.practicePassed.some(id=>!TEMPLE_PRACTICE.some(x=>x.id===id))||typeof t.claimed!=='boolean')fail();
 const p=t.practice,q=TEMPLE_PRACTICE.find(q=>q.id===p?.id);if(!q||typeof p.hinted!=='boolean'||p.choice!==null&&!q.options.some(o=>o.id===p.choice))fail();
 if(t.exam!==null){const e=t.exam;if(!Number.isInteger(e.seed)||!Number.isInteger(e.index)||e.index<0||e.index>=TEMPLE_EXAM.length||typeof e.hinted!=='boolean'||!Array.isArray(e.answers)||e.answers.length<e.index||e.answers.length>e.index+1)fail();e.answers.forEach((a,i)=>{const q=TEMPLE_EXAM[i];if(!a||a.id!==q.id||!q.options.some(o=>o.id===a.choice)||typeof a.hinted!=='boolean')fail()});}
 if(['exam','result','reward'].includes(t.mode)&&!t.exam)fail();
 if(['result','reward'].includes(t.mode)&&t.exam.answers.length!==TEMPLE_EXAM.length)fail();
 if(['exam','result','reward'].includes(t.mode)&&!templeReady(t))fail();if(t.mode==='practice'&&q.topic!==t.topic)fail();if(t.mode==='reward'&&(!t.claimed||templeScore(t)<5))fail();return t;
}
function templeStudy(){return s.templeStudy||(s.templeStudy=freshTempleStudy())}
function templeScore(t=templeStudy()){return t.exam?.answers.filter(a=>a.choice==='right').length||0}
function templeReady(t=templeStudy()){return TEMPLE_TOPICS.every(x=>t.lessons.includes(x.id))&&TEMPLE_PRACTICE.every(x=>t.practicePassed.includes(x.id))}
function templeCurrent(){const t=templeStudy();return t.mode==='exam'?TEMPLE_EXAM[t.exam.index]:t.mode==='practice'?TEMPLE_PRACTICE.find(q=>q.id===t.practice.id):null}
function templeSetMode(mode){closeTool(false);templeStudy().mode=mode;checkpoint();render();$('#templeFocus')?.scrollIntoView({block:'start'})}
function templeLesson(id){if(!TEMPLE_TOPICS.some(x=>x.id===id))return;const t=templeStudy();t.topic=id;templeSetMode('lesson')}
function templeStartPractice(id){const q=TEMPLE_PRACTICE.find(x=>x.id===id);if(!q)return;const t=templeStudy();t.topic=q.topic;t.practice={id,choice:null,hinted:false};templeSetMode('practice')}
function templeLearn(){const t=templeStudy();if(!t.lessons.includes(t.topic))t.lessons.push(t.topic);const q=TEMPLE_PRACTICE.find(q=>q.topic===t.topic&&!t.practicePassed.includes(q.id))||TEMPLE_PRACTICE.find(q=>q.topic===t.topic);templeStartPractice(q.id)}
function templeStartExam(restart=false){const t=templeStudy();if(!templeReady(t))return toast('3つの学びと、6問の練習を終えてから試験に進もう。');if(restart||!t.exam||t.exam.answers.length===TEMPLE_EXAM.length)t.exam={index:0,seed:Math.floor(Math.random()*100000),answers:[],hinted:false};templeSetMode('exam')}
function templeAnswer(choice){const t=templeStudy(),q=templeCurrent();if(!q||!q.options.some(o=>o.id===choice))return;if(t.mode==='practice'){if(t.practice.choice!==null)return;t.practice.choice=choice;if(choice==='right'&&!t.practicePassed.includes(q.id))t.practicePassed.push(q.id)}else{if(t.exam.answers.length>t.exam.index)return;t.exam.answers.push({id:q.id,choice,hinted:t.exam.hinted})}if(choice==='right')s.stats.correct++;else s.stats.wrong++;checkpoint();render();$('#templeFeedback').scrollIntoView({block:'nearest'});tone(choice==='right')}
function templeHint(){const t=templeStudy(),p=t.mode==='exam'?t.exam:t.practice;if(!templeCurrent()||p.hinted)return;p.hinted=true;s.stats.hints++;checkpoint();render()}
function templeContinue(){const t=templeStudy();if(t.mode==='exam'){if(t.exam.answers.length<=t.exam.index)return;if(t.exam.index===TEMPLE_EXAM.length-1)return templeSetMode('result');t.exam.index++;t.exam.hinted=false;templeSetMode('exam')}else if(t.mode==='practice'){if(t.practice.choice===null)return;if(t.practice.choice!=='right')return templeStartPractice(t.practice.id);const q=TEMPLE_PRACTICE.find(q=>q.topic===t.topic&&!t.practicePassed.includes(q.id));if(q)templeStartPractice(q.id);else templeSetMode('hall')}}
function templeClaim(){const t=templeStudy();if(t.mode!=='result'||templeScore(t)<5||!templeReady(t))return;if(!t.claimed){t.claimed=true;s.temple=true;markDone('temple');if(s.job==='遊び人')s.job='賢者';awardTempleEquipment(s);s.hp=maxHP();s.mp=maxMP()}templeSetMode('reward')}
function templeTools(){return `<div class="temple-tools"><button id="templeCalc" ${s.crystal?'':'disabled'}>◆ 賢算の水晶</button><button id="templeCompass" ${s.compass?'':'disabled'}>✧ 羅針盤</button><button id="templeHall">神殿の広間へ</button></div>`}
function templeFraction(top,bottom){return `<span class="temple-fraction"><span>${top}</span><span>${bottom}</span></span>`}
function templeDiagram(topic){
 if(topic==='atoms')return `<figure class="temple-diagram atom-diagram" aria-label="水分子1個はH原子2個とO原子1個"><div class="molecule"><span>H</span><span>O</span><span>H</span></div><figcaption>水分子 H₂O <b>1個</b><span>H原子 <b>2個</b> ＋ O原子 <b>1個</b></span></figcaption></figure>`;
 if(topic==='density')return `<figure class="temple-diagram density-diagram" aria-label="気体2.24 Lの質量が2.24 gなら、1 Lあたり1.00 g、標準状態で1 molあたり22.4 g"><div class="gas-vessel"><span>気体</span><b>2.24 L</b><small>質量 2.24 g</small></div><span class="diagram-arrow">→</span><div class="density-readout"><small>1 Lあたりの質量</small><b>1.00 g/L</b><span>標準状態で ×22.4 L/mol</span><b>22.4 g/mol</b></div><figcaption>例題：気体を理想気体とみなせる場合。${GAS}</figcaption></figure>`;
 return `<figure class="temple-diagram mix-diagram" aria-label="分子量28.0の窒素1個分と、32.0の酸素3個分を平均して31.0"><div class="mix-particles"><span class="nitrogen">N₂<small>28.0</small></span>${[1,2,3].map(()=>'<span class="oxygen">O₂<small>32.0</small></span>').join('')}</div><div class="mix-legend">窒素：酸素 ＝ <b>1：3</b>（物質量比）</div><figcaption>${templeFraction('28.0×1 ＋ 32.0×3','1＋3')} ＝ <b>31.0</b><span>酸素が多いので、平均は酸素側に近づく。</span>${averageWorking({id:'example'},false)}</figcaption></figure>`;
}
function templeLessonBody(id){if(id==='atoms')return `<h2>「分子」と「中の原子」を分けて数える</h2><p>H₂Oの小さな「2」は、H原子が2個あるという意味。Oは数字がないので1個です。分子1個の中身を確認すれば、個数でもmolでも同じ倍率を使えます。</p>${templeDiagram(id)}<div class="temple-formula">原子のmol ＝ 分子のmol × 1分子中の対象原子の数</div><p>例：水分子0.50 mol中のH原子は、0.50×2＝<b>1.0 mol</b>。全原子なら、0.50×(2＋1)＝<b>1.5 mol</b>です。</p><p class="temple-caution">化学式が出ても、モル質量が必要とは限りません。今回必要なのは、分子内の原子の数です。</p>`;
 if(id==='density')return `<h2>密度から「1 molの質量」を求める</h2><p>密度は、単位体積あたりの質量。g/Lなら「1 Lあたり何gか」を表します。まず体積の単位をそろえましょう。</p><div class="temple-formula">密度 d ＝ ${templeFraction('質量 m〔g〕','体積 V〔L〕')} <span>〔g/L〕</span></div>${templeDiagram(id)}<div class="temple-formula">モル質量 M ＝ 密度 d × 22.4 <span>〔g/mol〕</span></div><p class="temple-caution">22.4 L/molを使えるのは、<b>${GAS}</b>で気体を理想気体とみなせるときです。密度のg/Lと、モル質量のg/molを区別します。</p>`;
 return `<h2>混ざった割合を入れて平均する</h2><p>混合気体の平均分子量は、成分の分子量に<b>物質量の割合</b>を掛けて足したものです。物質量比は分子の個数比と同じ。多い成分ほど大きく影響します。</p>${averageSupplement()}${templeDiagram(id)}<div class="temple-formula">平均分子量 ＝ ${templeFraction('<span class="fraction-term">分子量A×物質量A</span> ＋ <span class="fraction-term">分子量B×物質量B</span>','物質量A ＋ 物質量B')}</div><p>同じ温度・圧力の理想気体では、<b>体積比＝物質量比</b>として計算できます。質量比をそのまま使うことはできません。</p><p class="temple-caution">平均分子量は<b>単位なし</b>。平均モル質量は、同じ数値にg/molを付けた量です。成分が2種類でも、混合比が違えば単純平均にはなりません。</p>`;
}
function renderTemple(){const t=templeStudy(),topic=TEMPLE_TOPICS.find(x=>x.id===t.topic),q=templeCurrent();let body='';
 if(t.mode==='hall')body=`<section class="temple-hall rpg-window"><div class="temple-crest" aria-hidden="true">♙</div><p class="eyebrow">DHARMA TEMPLE · LEARN & AWAKEN</p><h2 id="templeFocus">三つの学びを、決戦の力に。</h2><p class="temple-intro">「粒の中身、気体の重さ、混ざる割合。知恵を磨き、己の力を示すのじゃ。」</p><div class="temple-progress"><span>学び <b>${t.lessons.length} / 3</b></span><span>練習 <b>${t.practicePassed.length} / 6</b></span><span>試験 <b>${t.claimed?'合格':t.exam?'挑戦中':'未受験'}</b></span></div><div class="temple-room-grid">${TEMPLE_TOPICS.map(x=>`<button class="temple-room" data-lesson="${x.id}"><span class="room-symbol">${x.symbol}</span><small>LEARNING ${TEMPLE_TOPICS.indexOf(x)+1}</small><h3>${x.title}</h3><p>${x.lead}</p><b>${TEMPLE_PRACTICE.filter(q=>q.topic===x.id&&t.practicePassed.includes(q.id)).length} / 2 問 習得${t.lessons.includes(x.id)?' · 読了':''}</b><span class="room-enter">学びへ進む →</span></button>`).join('')}</div><div class="temple-exam-gate"><div><h3>転職試験 · 6問</h3><p>6問中5問以上で合格。遊び人は上級職へ、ほかの職業も決戦への道が開きます。</p><p class="muted">練習・試験ではHPは減りません。途中保存できます。</p>${s.temple&&!t.claimed?'<p class="legacy-note">旧版の合格・職業・魔王への道は保持しています。新しい学びは復習として挑戦できます。</p>':''}</div><button id="templeExamStart" class="primary" ${templeReady(t)?'':'disabled'}>${t.claimed?'もう一度受験する':t.exam?.answers.length===6?'試験結果を見る':t.exam?'試験を再開する':'転職試験へ進む'}</button></div>${s.temple?equipmentCard():''}</section>`;
 else if(t.mode==='lesson')body=`<section class="temple-lesson rpg-window"><p class="eyebrow">学び ${TEMPLE_TOPICS.indexOf(topic)+1} / 3</p><h1 id="templeFocus">${topic.symbol} ${topic.title}</h1>${templeLessonBody(t.topic)}<button id="templeLearned" class="primary full">学びを確かめる · 練習2問へ ▶</button>${templeTools()}</section>`;
 else if(q){const exam=t.mode==='exam',p=exam?t.exam:t.practice,record=exam?p.answers[p.index]:p.choice!==null?{choice:p.choice}:null,locked=!!record,ok=record?.choice==='right',local=TEMPLE_PRACTICE.filter(x=>x.topic===q.topic);body=`<section class="temple-question rpg-window"><p class="eyebrow">${exam?'転職試験':'学びの確認'}</p><div class="temple-question-heading"><h2 id="templeFocus">${exam?`試験 ${p.index+1} / 6`:`${topic.title} · ${local.findIndex(x=>x.id===q.id)+1} / 2`}</h2><span class="pill">${exam?'5問以上正解で合格':'HPは減りません'}</span></div><h3 class="temple-question-text">${q.text}</h3>${q.topic==='average'?averageSupplement():''}<p class="precision-note">答えは有効数字${q.figures}桁。${q.unit?'':'平均分子量は単位なし。'}</p><div class="answers">${shuffledOptions(q,{seed:exam?p.seed:7919}).map((a,i)=>`<button data-temple-answer="${a.id}" ${locked?'disabled':''} class="${record?.choice===a.id?'selected-answer':''}"><span>${'ABCD'[i]}</span>${a.label}</button>`).join('')}</div>${!locked?`<button id="templeHint" class="hint-button">？ 考え方のヒント</button>`:''}${p.hinted||locked?`<div class="hint">${q.hint}</div>`:''}<div id="templeFeedback" aria-live="polite">${locked?`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'○ 正解！':'× 不正解'}</strong><p>正答：<b>${q.options.find(o=>o.id==='right').label}</b></p><p>${q.solution}</p>${averageWorking(q)}<p>${q.misconception}</p></div><button id="templeContinue" class="primary full">${exam?p.index===5?'試験結果を見る ▶':'次の問いへ ▶':ok?'学びを進める ▶':'同じ問題に再挑戦する'}</button>`:''}</div>${exam?'<p class="rule-note">各問は1回ずつ採点します。回答後は解説を読み、「次へ」で進みます。再受験は全6問を回答した後にできます。</p>':'<p class="rule-note">練習は正解まで再挑戦できます。ヒント・解説を読み、使う量を確かめよう。</p>'}${templeTools()}</section>`;}

function chooseBossReview(){if(!s?.bossSecondCleared)return;closeTool(false);const secondHP=maxHP(),secondMP=maxMP();showModal(`<section class="boss-review-choice"><p class="eyebrow">魔王の城 · 復習の戦い</p><h2>どちらの形態から始めますか？</h2><p>踏破後の復習は、どちらもHP・MP全回復で始めます。踏破済みの記録と合格は保持され、復習での回答も学習記録に加算します。</p><button id="reviewFirst" class="boss-review-option"><b>第一形態から始める</b><span>HP・MP全回復</span><small>HP ${maxHP()} / ${maxHP()} · MP ${maxMP()} / ${maxMP()}<br>第一形態${Q.boss.length}問 → 第二形態${BOSS2.length}問（計${Q.boss.length+BOSS2.length}問）</small></button><button id="reviewSecond" class="boss-review-option"><b>第二形態から始める</b><span>HP・MP全回復</span><small>HP ${secondHP} / ${maxHP()} · MP ${secondMP} / ${maxMP()}<br>第二形態${BOSS2.length}問から挑戦</small></button><p class="rule-note">第一形態を終えて続ける場合は、最大HP・MPの${Math.round(BATTLE_RULES.transitionRecovery*100)}％分を回復して変身へ進みます。敵を早く倒しても、残問は封印の確認としてすべて解きます。</p><button id="reviewCancel" class="full">マップに戻る</button></section>`);bind('#reviewFirst',()=>{$('#modal').close();startBoss(1,true)});bind('#reviewSecond',()=>{$('#modal').close();startBoss(2,true,null,true)});bind('#reviewCancel',()=>$('#modal').close())}
function validateBattle(c){const qs=combatQuestions(c),q=qs?.[c.q];if(!q||!Number.isInteger(c.phase)||![1,2].includes(c.phase)||c.stage!=='boss'&&c.phase!==1||c.total!==qs.length||c.questionId!==q.id||!Number.isInteger(c.hp)||c.hp<0||c.hp>qs.length||!Array.isArray(c.order)||new Set(c.order).size!==c.order.length||c.order.some(id=>!BOSS_GASES.some(g=>g.id===id))||c.order.length>4)throw Error('戦闘の設問記録を確認できません');if(c.pendingGas!==null&&(!isSecondPhase(c)||q.type!=='paired'||!q.options.some(o=>o.id===c.pendingGas)))throw Error('引き継ぐ気体を確認できません');if(q.type!=='order'&&c.order.length)throw Error('並べ替えの記録を確認できません');if(c.reasonChoice!=null&&(!isSecondPhase(c)||q.type!=='paired'||c.pendingGas===null||!q.reasonOptions.some(o=>o.id===c.reasonChoice)))throw Error('理由の記録を確認できません');if(typeof c.sealing!=='boolean'||typeof c.boosted!=='boolean'||c.sealing&&c.hp!==0||!c.sealing&&c.hp===0&&!c.locked)throw Error('封印の記録を確認できません');if(c.transitionRecovery!==null&&(!Number.isInteger(c.transitionRecovery?.hp)||c.transitionRecovery.hp<0||!Number.isInteger(c.transitionRecovery?.mp)||c.transitionRecovery.mp<0))throw Error('回復の記録を確認できません');if(c.feedback?.effects!==undefined&&(!Array.isArray(c.feedback.effects)||c.feedback.effects.length>6||c.feedback.effects.some(e=>!IMPACT_TYPES.includes(e.type)||!Number.isInteger(e.amount)||e.amount<0||e.critical!==undefined&&typeof e.critical!=='boolean'||e.source!==undefined&&!['','破壊の鉄球','メラゾーマ'].includes(e.source))))throw Error('ダメージ演出の記録を確認できません');if(c.feedback&&typeof c.feedback.ok!=='boolean')throw Error('判定を確認できません');}

function bossTransformation(){applyTransitionRecovery();$('#main').innerHTML=`<section class="rpg-window transformation"><p class="eyebrow">FIRST FORM DEFEATED</p><h1>魔王を倒した！</h1><p class="transformation-line">……しかし、魔王の様子が……</p><div class="transformation-art"><img class="old-form" src="assets/mol-quest/sorcerer-v2.png" alt="第一形態の魔王"><img class="new-form" src="assets/mol-quest/sorcerer-phase2-v2.png" alt="角と牙を持つ異形の悪魔へ変貌した魔王の第二形態"></div><h2>第二形態が、姿を現した！</h2><p>「まだ終わりではない。粒の姿、気体の重さ、単位のつながり……その知恵を示せ。」</p><p class="transition-heal">知恵の光が身体を包む。最大HP・MPの${Math.round(BATTLE_RULES.transitionRecovery*100)}％分を回復！<br>HP ＋${combat.transitionRecovery.hp} · MP ＋${combat.transitionRecovery.mp}（上限まで）</p><p class="carry-status">HP ${s.hp} / ${maxHP()} · MP ${s.mp} / ${maxMP()}${combat.ward?' · フバーハの結界を引き継ぐ':''}</p><p class="rule-note">回復後のHP・MPを引き継いで戦います。${s.bossSecondCleared?'踏破後のマップからの復習は、両形態ともHP・MP全回復で始められます。':`未踏破でマップから第二形態を始める場合はHP・MP${Math.round(BATTLE_RULES.secondStart*100)}％で再開します。`}</p><button id="startSecondForm" class="primary full">第二形態との決戦へ ▶</button><button id="transformMap" class="full">進捗を残してマップへ</button></section>`;bind('#startSecondForm',()=>startBoss(2,false,combat));bind('#transformMap',backToMap)}

function trialComplete(){closeTool(false);const t=TRIALS[trial.index],fresh=!s.trialSolved.includes(t.id);if(fresh){s.trialSolved.push(t.id);s.level++}const all=TRIALS.every(t=>s.trialSolved.includes(t.id));if(all){markDone('trial');s.compass=true}trial.values[trial.step]=trial.input;s.hp=maxHP();s.active=null;persist();hud();$('#main').innerHTML=`<section class="rpg-window result"><p class="eyebrow">TRIAL COMPLETE</p><div class="reward">${all?'✧':'◇'}</div><h1>${all?'モル計算の羅針盤を手に入れた！':'ひとつの道が、つながった。'}</h1><p>${fresh?'レベルが1上がった！':'復習を達成しました。'} Lv.${s.level}</p><div class="working-record">${t.steps.map((v,i)=>`<div><span>✓ ${i+1}</span><b>${v.solution}</b></div>`).join('')}</div><p>${all?'「この羅針盤を持ち、次のダンジョンで実力を示すのじゃ。」<br>これからは「どうぐ」からいつでも開けます。':`試練の間 ${s.trialSolved.length} / ${TRIALS.length} 問達成。物質が変わっても、molを中継する道筋は同じ。`}</p><button id="trialNext" class="primary full">${all?'マップへ戻る ▶':'次の試練へ ▶'}</button><button id="trialMap" class="full">マップへ戻る</button></section>`;bind('#trialMap',backToMap);bind('#trialNext',()=>{if(all)return backToMap();const next=TRIALS.findIndex(t=>!s.trialSolved.includes(t.id));trial={index:next,step:0,values:[],input:'',feedback:null,hinted:false};view='trial';checkpoint();render()});}

function certificate(){if(nextStage()!==-1){view='map';return render()}const total=s.stats.correct+s.stats.wrong;$('#main').innerHTML=`<button id="certBack" class="subtle no-print">← マップ</button><section class="certificate"><img class="cert-backdrop" src="assets/mol-quest/certificate-party.png" alt="" aria-hidden="true"><div class="cert-content"><p class="eyebrow">MOL QUEST · CHAPTER I</p><div class="cert-crest" aria-hidden="true"><svg viewBox="0 0 220 80"><g fill="#b39549" stroke="#b39549"><path d="M78 68Q37 52 50 12" fill="none" stroke-width="2"/><ellipse cx="47" cy="23" rx="4" ry="10" transform="rotate(-25 47 23)"/><ellipse cx="59" cy="30" rx="4" ry="10" transform="rotate(42 59 30)"/><ellipse cx="42" cy="40" rx="4" ry="10" transform="rotate(-48 42 40)"/><ellipse cx="59" cy="47" rx="4" ry="10" transform="rotate(54 59 47)"/><ellipse cx="51" cy="57" rx="4" ry="10" transform="rotate(-62 51 57)"/><path d="M142 68Q183 52 170 12" fill="none" stroke-width="2"/><ellipse cx="173" cy="23" rx="4" ry="10" transform="rotate(25 173 23)"/><ellipse cx="161" cy="30" rx="4" ry="10" transform="rotate(-42 161 30)"/><ellipse cx="178" cy="40" rx="4" ry="10" transform="rotate(48 178 40)"/><ellipse cx="161" cy="47" rx="4" ry="10" transform="rotate(-54 161 47)"/><ellipse cx="169" cy="57" rx="4" ry="10" transform="rotate(62 169 57)"/></g><path d="m110 9 9 23 23 9-23 9-9 23-9-23-23-9 23-9Z" fill="none" stroke="#a17c29" stroke-width="3"/><circle cx="110" cy="41" r="5" fill="#a17c29"/></svg></div><p class="cert-ribbon">すべての道を踏破した、あなたへ</p><h1>モル計算<br class="cert-mobile-break"> 冒険合格証</h1><p class="cert-subtitle">CERTIFICATE OF ADVENTURE</p><p class="cert-number">出席番号 <b>${esc(s.number)}</b></p><h2>${esc(s.job)} · Lv.${s.level}</h2><p class="narration">基礎の三つの道、試練の間、ダンジョン、ダーマ神殿を踏破。<br>モルを中継する知恵で、魔王の両形態を打ち倒し、<br>すべての封印の問いを乗り越えた学びを、ここに称えます。</p><div class="cert-stats"><span>正解した回答 <b>${s.stats.correct}</b></span><span>回答正答率 <b>${total?Math.round(s.stats.correct/total*100):0}％</b></span><span>ヒント使用 <b>${s.stats.hints}</b></span></div><div class="cert-art-space" aria-hidden="true"></div><p class="cert-date">合格日：${new Date(s.finished||Date.now()).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'})}</p><p class="muted">再挑戦・段階式入力を含む回答の記録です。旧版の回答数は含みません。<br>全ステージ・魔王の両形態・封印の問いの完了で合格。再挑戦回数・正答率は合否に影響しません。<br>提出するときは、出席番号と記録が見えるようにこの画面を撮影してください。</p><div class="cert-bottom-ornament" aria-hidden="true">◆ ───── ✧ ───── ◆</div></div></section><div class="footer-actions no-print"><button id="print" class="primary">印刷 / PDF保存</button><button id="certHome">ホームに戻る</button><button id="certReset">冒険をはじめから</button></div>`;bind('#certBack',backToMap);bind('#print',()=>window.print());bind('#certHome',()=>{view='intro';render()});bind('#certReset',requestReset);}
function bag(){if(!s)return toast('先に冒険の書をつくりましょう。');const ready=view==='battle'&&!combat.locked&&!isSealing(),hasTools=s.crystal||s.compass||s.potions||templeEquipment()||combat?.stage==='boss';showModal(`<h2>▣ どうぐぶくろ</h2><p>現在のHP <b>${s.hp} / ${maxHP()}</b>　MP <b>${s.mp} / ${maxMP()}</b></p>${!hasTools?'<p class="empty-inventory">まだ道具を持っていません。冒険で手に入れよう。</p>':''}${equipmentCard()}<div class="inventory">${s.crystal?'<button id="openCalc">◆ 賢算の水晶 <small>計算機と計算履歴</small></button>':''}${s.compass?'<button id="openCompass">✧ モル計算の羅針盤 <small>molを中継する道筋</small></button>':''}${s.potions?`<button id="usePotion" ${ready?'':'disabled'}>⚗ ポーション × ${s.potions}<small>最大HPの${Math.round(BATTLE_RULES.potionRate*100)}％分を回復 · 所持上限${BATTLE_RULES.potionLimit}個</small></button>`:''}${combat?.stage==='boss'?`<button id="useAntidote" ${ready&&!combat.used.antidote?'':'disabled'}>✿ 解毒草 × ${combat.used.antidote?0:1}<small>今の毒を解除。次の攻撃で再び毒になる</small></button>`:''}</div><p class="rule-note">回復アイテムは、戦闘で回答する前に使えます。</p>`);bind('#openCalc',calculator);bind('#openCompass',compass);bind('#usePotion',()=>skill('potion'));bind('#useAntidote',()=>skill('antidote'));}
function compass(){if(s?.compass)openTool('compass')}
function calculator(){if(s?.crystal)openTool('calculator')}
function toolContext(){
 if(view==='trial'&&trial){const t=TRIALS[trial.index];return `<b>${t.name} ${t.given}の${t.target}を求めよう。</b>${t.condition?`<p>${t.condition}</p>`:''}<p>STEP ${trial.step+1}：${t.steps[trial.step].title}</p>${trial.step?`<div class="tool-known">${t.steps.slice(0,trial.step).map(v=>esc(v.solution)).join('<br>')}</div>`:''}`}
 if(view==='temple'){const q=templeCurrent();return q?`<b>${esc(q.text)}</b><p>有効数字${q.figures}桁。${q.unit?'':'平均分子量は単位なし。'}</p>`:`<b>ダーマ神殿 · ${esc(TEMPLE_TOPICS.find(x=>x.id===templeStudy().topic).title)}</b>`}
 if(view==='battle'&&combat)return `<b>${esc(currentQ().text)}</b>${isSecondPhase()&&currentQ().type==='paired'&&combat.pendingGas!==null?`<p>引き継いだ選択：${esc(selectedGas())}</p>`:''}${currentQ().figures?`<p>答えは有効数字${currentQ().figures}桁。</p>`:''}`;
 return '<p>マップで道具を確認中。計算機と羅針盤は、問題を解いているときも使えます。</p>';
}
function openTool(type){toolView=type;$('#modal').close();renderTools();if(typeof matchMedia==='function'&&!matchMedia('(min-width:1100px)').matches)$('#toolPanel').scrollIntoView({block:'start'});$('#toolPanelTitle').focus({preventScroll:true})}
function closeTool(returnToAnswer=true){toolView=null;renderTools();if(returnToAnswer){const target=view==='trial'?$('#trialAnswer'):view==='battle'?$('.question-window'):$('#main');target?.scrollIntoView({block:'nearest'})}}
function renderTools(){
 const panel=$('#toolPanel'),toolScroll=panel.dataset.tool===toolView?($('.tool-panel-content')?.scrollTop||0):0;panel.dataset.tool=toolView||'';if(!s||view==='intro')toolView=null;panel.hidden=!toolView;document.body.classList.toggle('tool-open',Boolean(toolView));document.body.dataset.tool=toolView||'';if(!toolView){panel.innerHTML='';return}
 panel.innerHTML=`<div class="tool-panel-head"><h2 id="toolPanelTitle" tabindex="-1">${toolView==='calculator'?'◆ 賢算の水晶':'✧ モル計算の羅針盤'}</h2><button id="closeTool" aria-label="道具パネルを閉じる">×</button></div><div class="tool-question"><span>いまの問題</span>${toolContext()}</div><div class="tool-tabs"><button id="switchCalc" aria-pressed="${toolView==='calculator'}" ${s.crystal?'':'disabled'}>計算機</button><button id="switchCompass" aria-pressed="${toolView==='compass'}" ${s.compass?'':'disabled'}>羅針盤</button></div><div class="tool-panel-content">${toolView==='calculator'?calculatorContent():compassContent()}</div><button id="returnToAnswer" class="primary full">道具を閉じて回答へ戻る</button>`;
 $('.tool-panel-content').scrollTop=toolScroll;bind('#closeTool',()=>closeTool());bind('#returnToAnswer',()=>closeTool());bind('#switchCalc',calculator);bind('#switchCompass',compass);
 document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='C')calc='';else if(k==='⌫')calc=calc.slice(0,-1);else if(k==='±')calc=calc.startsWith('-')?calc.slice(1):'-'+calc;else if(k==='='){try{const ans=evaluate(calc);s.history.push(calc+' = '+ans);calc=String(ans);persist()}catch{toast('式を確認してください。0では割れません。')}}else if(calc.length<100)calc+=k;renderTools()});
}
function calculatorContent(){return `<p class="muted">×・÷を先に計算。途中は丸めず、最後に指定の有効数字へ。</p><output class="calc-display">${esc(calc)||'0'}</output><div class="calc-keys">${['C','⌫','22.4','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','±','='].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div><details class="tool-history"><summary>計算履歴（${s.history.length}件）</summary><div class="history">${s.history.length?s.history.slice(-12).reverse().map(h=>`<div>${esc(h)}</div>`).join(''):'まだ計算履歴はありません。'}</div></details>`}
function compassContent(){return `<div class="compass-guide"><b>中央へは「÷」、外へは「×」</b><p>出発する量からmolへ。次に、求める量へ進もう。</p></div><svg class="compass-diagram" viewBox="0 0 720 620" role="img" aria-labelledby="compassTitle compassDescription"><title id="compassTitle">molを中心に個数・質量・気体の体積をつなぐ羅針盤</title><desc id="compassDescription">質量からmolへはモル質量で割り、molから質量へはモル質量を掛ける。個数からmolへは6.0×10の23乗で割り、逆は掛ける。気体の体積からmolへは22.4で割り、逆は掛ける。</desc><defs><marker id="arrowIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#ffcb82"/></marker><marker id="arrowOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#7ce3ce"/></marker></defs><circle cx="360" cy="297" r="236" fill="none" stroke="#61748f" stroke-width="2" stroke-dasharray="5 12" opacity=".5"/><path d="M360 97V497M160 297H560" stroke="#67829e" stroke-width="1" opacity=".4"/><path d="M340 98V216" class="arrow-in"/><path d="M380 216V98" class="arrow-out"/><path d="M150 507L300 356" class="arrow-in"/><path d="M268 340L119 490" class="arrow-out"/><path d="M451 343L604 497" class="arrow-out"/><path d="M571 516L418 361" class="arrow-in"/><g class="compass-edge mass"><rect x="240" y="12" width="240" height="72" rx="8"/><text x="360" y="60">質量〔g〕</text></g><g class="compass-center-node"><circle cx="360" cy="291" r="77"/><text x="360" y="281" class="center-label">物質量</text><text x="360" y="322" class="center-mol">mol</text></g><g class="compass-edge count"><rect x="8" y="534" width="238" height="72" rx="8"/><text x="127" y="581">個数〔個〕</text></g><g class="compass-edge volume"><rect x="474" y="534" width="238" height="72" rx="8"/><text x="593" y="581">体積〔L〕</text></g><g class="compass-arrow-label"><text x="211" y="147" class="in-label">÷ モル質量</text><text x="211" y="188" class="unit-label">M〔g/mol〕</text><text x="514" y="147" class="out-label">× モル質量</text><text x="514" y="188" class="unit-label">M〔g/mol〕</text><text x="118" y="354" class="in-label">÷ 6.0×10²³</text><text x="235" y="483" class="out-label">× 6.0×10²³</text><text x="601" y="354" class="out-label">× 22.4</text><text x="510" y="483" class="in-label">÷ 22.4</text></g></svg><div class="compass-legend"><span class="toward">→ molへ：割る</span><span class="away">→ molから：掛ける</span></div><p class="rule-note">モル質量は化学式と原子量から自分で求めます。<br>気体の体積：${GAS}、22.4 L/mol。<br>アボガドロ定数：6.0×10²³ /mol。</p>`}

function evaluate(expr){const str=expr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[\d.+*/-]+$/.test(str))throw Error();const tokens=str.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+*/-]/g);let pos=0;function number(){let sign=1;while(tokens[pos]==='-'||tokens[pos]==='+'){if(tokens[pos++]==='-')sign*=-1}const x=Number(tokens[pos++]);if(!Number.isFinite(x))throw Error();return sign*x}function term(){let x=number();while(['*','/'].includes(tokens[pos])){let op=tokens[pos++],n=number();x=op==='*'?x*n:x/n}return x}let result=term();while(pos<tokens.length){let op=tokens[pos++];if(!['+','-'].includes(op))throw Error();let n=term();result=op==='+'?result+n:result-n}if(!Number.isFinite(result))throw Error();return Number(result.toPrecision(12))}
bind('#home',e=>{e.preventDefault();view='intro';render()});bind('.close',()=>$('#modal').close());bind('#sound',()=>{sound=!sound;if(!sound)stopBattleAudio();$('#sound').textContent=sound?'♪ 音 ON':'♪ 音 OFF';$('#sound').setAttribute('aria-pressed',String(sound));if(sound)playBattleSounds([{type:'attack',amount:1}])});
let font='ud';try{font=localStorage.getItem('molquest-font')||'ud'}catch{}if(!['ud','gothic','system'].includes(font))font='ud';document.body.dataset.font=font;$('#fontChoice').value=font;$('#fontChoice').onchange=e=>{document.body.dataset.font=e.target.value;try{localStorage.setItem('molquest-font',e.target.value)}catch{}};
render();

if(typeof ResizeObserver==='function'){const updateHudOffset=()=>document.documentElement.style.setProperty('--hud-offset',($('#hud').getBoundingClientRect().height+16)+'px');new ResizeObserver(updateHudOffset).observe($('#hud'));updateHudOffset();}
</script></body></html>
