<script>
'use strict';
const QUESTIONS=[{"id":0,"title":"共有結合でできた物質の3つの姿","prompt":"共有結合でできた物質の分類として、正しい組合せはどれか。","options":["H₂O＝通常の分子／ポリエチレン＝高分子化合物／ダイヤモンド＝共有結合結晶","H₂O＝高分子化合物／ポリエチレン＝共有結合結晶／ダイヤモンド＝通常の分子","H₂O＝共有結合結晶／ポリエチレン＝通常の分子／ダイヤモンド＝高分子化合物","H₂O＝通常の分子／ポリエチレン＝共有結合結晶／ダイヤモンド＝高分子化合物"],"pairs":[],"correct":0,"hint":"独立した小さな分子、多数の単量体がつながった分子、原子が結晶全体に連なる物質を区別する。","explain":"水は独立したH₂O分子からなる。ポリエチレンは多数のエチレンがつながった高分子化合物である。ダイヤモンドは炭素原子が共有結合で結晶全体に連なる共有結合結晶である。","note":""},{"id":1,"title":"炭素を含む物質の分類","prompt":"次のうち、炭素を含むが無機物質に分類されるものはどれか。","options":["メタン CH₄","エタノール C₂H₅OH","二酸化炭素 CO₂","ベンゼン C₆H₆"],"pairs":[],"correct":2,"hint":"炭素を含む物質のすべてが有機化合物とは限らない。","explain":"CO₂は炭素を含むが無機物質に分類される。CH₄、C₂H₅OH、C₆H₆は有機化合物である。COや炭酸塩なども無機物質として扱う。","note":""},{"id":2,"title":"空気の主成分","prompt":"空気中の窒素と酸素について、正しい説明はどれか。","options":["N₂は約78％で比較的反応しにくく、O₂は約21％で燃焼を助ける","N₂は約21％で燃焼を助け、O₂は約78％で比較的反応しにくい","N₂は約78％で強い刺激臭をもち、O₂は約21％で燃焼を妨げる","N₂とO₂はどちらも空気中に約50％ずつ含まれる"],"pairs":[],"correct":0,"hint":"空気中で最も多い気体と、呼吸や燃焼に関係する気体を考える。","explain":"乾燥空気には体積比でN₂が約78％、O₂が約21％含まれる。O₂は自らが燃料になるのではなく、物質の燃焼を助ける助燃性を示す。","note":""},{"id":3,"title":"燃料として利用される分子","prompt":"水素とメタンについて、正しい説明はどれか。","options":["H₂は最も軽い気体で燃料電池などに利用され、CH₄は天然ガスの主成分である","H₂は天然ガスの主成分であり、CH₄は空気中で最も多い気体である","H₂は黄緑色の有毒な気体であり、CH₄は水に溶けると塩酸になる","H₂とCH₄はどちらも常温で液体である"],"pairs":[],"correct":0,"hint":"水素ステーションと都市ガスを思い浮かべる。","explain":"H₂は最も軽い無色・無臭の気体で、燃料電池やロケット燃料に利用される。CH₄は天然ガスの主成分で、燃焼して多量の熱を発生する。","note":"H₂と空気・O₂との混合気体には、点火による激しい燃焼の危険がある。"},{"id":4,"title":"水の性質","prompt":"1気圧における水H₂Oの説明として正しいものはどれか。","options":["融点0 ℃、沸点100 ℃で、極性分子からなる","融点100 ℃、沸点0 ℃で、無極性分子からなる","約−79 ℃で昇華し、常温では気体である","水に溶けると塩酸になる"],"pairs":[],"correct":0,"hint":"氷が融ける温度と、湯が沸騰する温度を考える。","explain":"1気圧ではH₂Oの融点は0 ℃、沸点は100 ℃である。H₂Oは折れ線形で、分子全体に電荷の偏りが残る極性分子である。","note":""},{"id":5,"title":"二酸化炭素とドライアイス","prompt":"ドライアイスについて正しい説明はどれか。","options":["固体CO₂であり、1気圧では約−79 ℃で昇華する","固体H₂Oであり、0 ℃で蒸発する","液体CO₂であり、100 ℃で沸騰する","固体NH₃であり、水に溶けると塩酸になる"],"pairs":[],"correct":0,"hint":"ドライアイスが液体を残さず小さくなっていく様子を考える。","explain":"ドライアイスは固体CO₂である。1気圧では液体にならず、約−78.5 ℃で固体から気体へ昇華する。CO₂が水に溶けると、水溶液は弱い酸性を示す。","note":""},{"id":6,"title":"アンモニアと塩化水素","prompt":"NH₃とHClについて、正しい説明はどれか。","options":["NH₃の水溶液はアルカリ性、HClの水溶液は酸性を示す","NH₃の水溶液は酸性、HClの水溶液はアルカリ性を示す","NH₃とHClはどちらも水にほとんど溶けない","NH₃とHClの水溶液はどちらも中性である"],"pairs":[],"correct":0,"hint":"アンモニア水と塩酸の液性を思い出す。","explain":"NH₃は水に非常によく溶け、アンモニア水はアルカリ性を示す。HClも水によく溶け、その水溶液である塩酸は酸性を示す。","note":""},{"id":7,"title":"塩素と塩化水素の区別","prompt":"塩素Cl₂と塩化水素HClについて、正しい説明はどれか。","options":["Cl₂は黄緑色で有毒な気体、HClは無色の気体である","Cl₂は無色の液体、HClは黄緑色の気体である","Cl₂が水に溶けたものを塩酸という","Cl₂とHClは同じ物質を異なる式で表したものである"],"pairs":[],"correct":0,"hint":"Cl₂は塩素原子だけ、HClは水素原子と塩素原子からできている。","explain":"Cl₂は黄緑色で有毒な気体で、消毒などに関係する。HClは無色の気体で、水溶液は塩酸と呼ばれる。Cl₂とHClは別の物質である。","note":"塩素は有毒であり、実験では吸い込まないよう十分な安全管理が必要である。"},{"id":8,"title":"有機化合物の名称と化学式","prompt":"左側の物質名と、右側の化学式を対応させる。","options":[],"pairs":[["メタン","CH₄"],["エチレン","C₂H₄"],["エタノール","C₂H₅OH"],["酢酸","CH₃COOH"],["ベンゼン","C₆H₆"]],"correct":null,"hint":"名称だけで判断できないときは、配布資料の物質一覧を参照してよい。","explain":"メタン CH₄、エチレン C₂H₄、エタノール C₂H₅OH、酢酸 CH₃COOH、ベンゼン C₆H₆。エタノールのOHと酢酸のCOOHにも注目しましょう。","note":""},{"id":9,"title":"有機化合物と身近な用途","prompt":"物質と代表的な用途・性質を対応させる。","options":[],"pairs":[["メタン","天然ガスの主成分・燃料"],["エチレン","ポリエチレンの原料・果実の成熟を促進"],["エタノール","酒類・消毒薬・溶媒"],["酢酸","食酢に含まれ、調味料や化学工業の原料になる"],["ベンゼン","化学工業の原料・水に溶けにくい液体"]],"correct":null,"hint":"都市ガス、果実、消毒、食酢、化学工業という5つの手掛かりを使う。","explain":"身近な用途と名称・化学式を結び付けて覚えましょう。食酢は酢酸を含む水溶液で、水が主成分です。ベンゼンには有害性があり、取扱いに注意が必要です。","note":""},{"id":10,"title":"高分子化合物とは何か","prompt":"高分子化合物の説明として最も適切なものはどれか。","options":["非常に多数の原子からできた、分子量が非常に大きい化合物","原子が1個だけで存在する物質","陽イオンと陰イオンだけからなる物質","分子量が必ず18以下の化合物"],"pairs":[],"correct":0,"hint":"「高分子」の「高」は、主に分子量が非常に大きいことを表す。","explain":"非常に多数の原子からなる大きな分子を高分子といい、その化合物を高分子化合物という。この教材では分子量約1万以上を一つの目安として扱う。デンプンやタンパク質は天然高分子化合物、ポリエチレンやPETは合成高分子化合物の例である。","note":""},{"id":11,"title":"単量体・重合体・重合","prompt":"高分子をつくる原料となる小さな分子、その小さな分子が多数つながってできた高分子、つながる反応の名称の順として正しいものはどれか。","options":["単量体／重合体／重合","重合体／単量体／電離","単量体／電解質／中和","重合体／結晶格子／昇華"],"pairs":[],"correct":0,"hint":"原料の小さな分子と、つながった大きな分子を区別しましょう。「単」と「重」が手掛かりです。","explain":"原料となる小さな分子が単量体（モノマー）、生成した高分子が重合体（ポリマー）、単量体から重合体ができる反応が重合である。","note":""},{"id":12,"title":"付加重合","prompt":"エチレンが多数つながってポリエチレンになる反応について、正しい説明はどれか。","options":["エチレンの二重結合の一部が開いて次々につながる付加重合である","エチレンから水分子が取れながらつながる縮合重合である","エチレンが陽イオンと陰イオンに分かれる電離である","エチレンが酸素と反応して二酸化炭素になる燃焼である"],"pairs":[],"correct":0,"hint":"反応前後で、エチレンのC=Cに注目する。","explain":"エチレンのC=Cのうち一つの結合が開き、新しく隣の分子の炭素と結合してポリエチレンになります。付加重合といい、この反応では水などの小分子は脱離しません。","note":""},{"id":13,"title":"縮合重合とPET","prompt":"テレフタル酸とエチレングリコールからPETができる反応について、正しい説明はどれか。","options":["2種類の単量体が、水などの小さな分子を生じながらつながる縮合重合である","エチレンだけが、水を生じずにつながる付加重合である","PETが単量体に分かれる反応である","陽イオンと陰イオンが結び付くイオン結合である"],"pairs":[],"correct":0,"hint":"反応物の両端にある官能基と、生成物側のH₂Oに注目する。","explain":"この例ではテレフタル酸とエチレングリコールが、水を生じながら次々に結合してPETになります。このような重合を縮合重合といいます。縮合重合は、必ず2種類の単量体を必要とするわけではありません。","note":""},{"id":14,"title":"合成高分子化合物と用途","prompt":"高分子化合物と代表的な用途を対応させる。","options":[],"pairs":[["ポリエチレン（PE）","ポリ袋"],["ポリ塩化ビニル（PVC）","水道管"],["ポリプロピレン（PP）","食品保存容器"],["ポリスチレン（PS）","食品用トレイ"],["ポリエチレンテレフタラート（PET）","ペットボトル"]],"correct":null,"hint":"身近な製品の名前や表示に使われるPE、PVC、PP、PS、PETという略号に注目する。","explain":"PE＝ポリ袋、PVC＝水道管、PP＝食品保存容器、PS＝食品用トレイ、PET＝ペットボトル。これらは代表例で、実際の製品にはさまざまな材料が使われます。","note":""}];
// 問題タイトルから正解が分からない表現にする。
QUESTIONS[11].title='高分子ができるまで';
QUESTIONS[12].title='エチレンからポリエチレンへ';
QUESTIONS[13].title='PETができる反応';

const KEY='molecule-polymer-workshop-v1';
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=x=>esc(x).replace(/共有結合結晶|高分子化合物|有機化合物|無機物質|付加重合|縮合重合|単量体|重合体|助燃性|アルカリ性|酸性|昇華|極性分子/g,w=>'<span class="term">'+w+'</span>').replace(/C₂H₅OH|CH₃COOH|C₆H₆|C₂H₄|CH₄|NH₃|CO₂|H₂O|HCl|Cl₂|H₂|O₂|N₂/g,w=>'<span class="formula">'+w+'</span>');
function shuffle(n){let a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(id){return {v:1,id,current:0,done:Array(15).fill(false),pairs:QUESTIONS.map(q=>q.pairs.map(()=>false)),order:QUESTIONS.map(q=>shuffle(q.options.length||q.pairs.length)),finished:null}}
function valid(s){return s&&s.v===1&&typeof s.id==='string'&&/^[0-9]{4}$/.test(s.id)&&Number.isInteger(s.current)&&s.current>=0&&s.current<15&&Array.isArray(s.done)&&s.done.length===15&&s.done.every(x=>typeof x==='boolean')&&Array.isArray(s.pairs)&&s.pairs.length===15&&s.pairs.every((p,i)=>Array.isArray(p)&&p.length===QUESTIONS[i].pairs.length&&p.every(x=>typeof x==='boolean')&&(!p.length||s.done[i]===p.every(Boolean)))&&Array.isArray(s.order)&&s.order.length===15&&s.order.every((a,i)=>Array.isArray(a)&&a.length===(QUESTIONS[i].options.length||QUESTIONS[i].pairs.length)&&a.every(Number.isInteger)&&[...a].sort().join(',')===Array.from({length:a.length},(_,j)=>j).join(','))&&(s.finished===null||typeof s.finished==='string'&&!isNaN(Date.parse(s.finished)))}
let state=null,screen='home',selected=null,lastWrong=null,message='',showHint=false,bookOpener=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))state=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveWarning').hidden=true}catch(e){$('saveWarning').hidden=false}}
function total(){return state.done.filter(Boolean).length}
function finish(){if(total()===15&&!state.finished)state.finished=new Date().toISOString();save()}
function hero(){return '<svg class="hero-art" viewBox="0 0 500 260" aria-hidden="true"><circle cx="240" cy="125" r="104" fill="#e0ebe0"/><path d="M90 125 L150 62 220 115 310 68 390 137 328 211 220 168 145 216Z" fill="none" stroke="#b99d5a" stroke-width="3"/>'+[[90,125,26],[150,62,19],[220,115,34],[310,68,23],[390,137,29],[328,211,17],[220,168,19],[145,216,23]].map(([x,y,r],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(i%2?'#186856':'#244356')+'" stroke="#fff" stroke-width="5"/>').join('')+'<text x="220" y="125" fill="white" text-anchor="middle" font-family="serif" font-size="24">C</text></svg>'}
function home(){screen='home';$('app').innerHTML='<section class="hero"><div><p class="kicker">MOLECULE ATLAS & POLYMER WORKSHOP</p><h1>分子図鑑と<br>高分子工房</h1><p class="sub">身近な物質の名前と、化学式をつなぐ。<br>小さな分子から、高分子の世界へ。</p><div class="chips"><span class="chip">15項目</span><span class="chip">目安10〜15分</span><span class="chip">資料を見てOK</span></div></div>'+hero()+'</section><div class="grid"><section class="panel"><h2>学習を始める</h2><form id="startForm"><label for="studentId">出席番号（半角数字4桁）</label><input id="studentId" class="field" placeholder="例：1801" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="off"><button class="primary" type="submit">新しく始める →</button></form>'+(state?'<hr><p>出席番号 '+esc(state.id)+' · '+total()+'/15項目 確認済み</p><button id="resume">続きから再開する</button>':'')+'</section><section class="panel"><h2>この学習の進め方</h2><ul><li>教科書・配布資料・アプリ内の図鑑を見ながら取り組めます。</li><li>間違えても、説明を読んで選び直せます。</li><li>すべて確認すると修了証が表示されます。</li><li>必要に応じて、修了証を撮影して提出してください。</li></ul><p class="sub">このブラウザーに出席番号と進行状況を保存します。先生への自動送信はありません。</p></section></div>';if(state)$('studentId').value=state.id;$('startForm').onsubmit=e=>{e.preventDefault();const id=$('studentId').value;if(!/^[0-9]{4}$/.test(id))return;if(state&&!confirm('このブラウザーにある記録を、新しい学習記録に置き換えますか？'))return;state=fresh(id);save();overview()};if(state)$('resume').onclick=overview}
function overview(){if(!state)return home();screen='overview';const n=total();$('app').innerHTML='<p class="kicker">LEARNING COLLECTION</p><h1 style="font-size:2rem">学習の一覧</h1><div class="status"><span>出席番号 '+esc(state.id)+'</span><span>通常の分子 '+state.done.slice(0,10).filter(Boolean).length+'/10 · 高分子 '+state.done.slice(10).filter(Boolean).length+'/5 · 全体 '+n+'/15</span></div><div class="bar"><span style="width:'+n/15*100+'%"></span></div><div class="actions"><button class="primary" id="continue">'+(n===15?'修了証を見る':'未確認の項目へ →')+'</button><button id="registration">登録画面へ</button></div><div class="overview">'+QUESTIONS.map((q,i)=>'<button class="tile '+(state.done[i]?'done':'')+'" data-q="'+i+'"><b>'+String(i+1).padStart(2,'0')+' · '+(state.done[i]?'○ 確認済み':i<10?'通常の分子':'高分子')+'</b>'+esc(q.title)+'</button>').join('')+'</div>';$('continue').onclick=()=>n===15?certificate():openQuestion(state.done.findIndex(x=>!x));$('registration').onclick=home;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openQuestion(Number(b.dataset.q)))}
function diagram(id){if(![8,10,11,12,13,14].includes(id))return '';let s='',caption='';
const text=(x,y,t,size=19)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="#183344" font-size="'+size+'">'+esc(t)+'</text>';
if(id===8){s=text(150,65,'C₂H₅OH',30)+text(150,105,'エタノール')+text(150,155,'OHに注目',18)+text(400,65,'CH₃COOH',30)+text(400,105,'酢酸')+text(400,155,'COOHに注目',18)+'<polygon points="645,40 686,64 686,112 645,136 604,112 604,64" fill="none" stroke="#126355" stroke-width="3"/><circle cx="645" cy="88" r="26" fill="none" stroke="#126355" stroke-width="2"/>'+text(645,170,'ベンゼン C₆H₆');caption='ベンゼンの各頂点は炭素原子。各炭素には水素原子が1個結合しています。';}
else if(id===12){s=text(155,80,'n CH₂＝CH₂',30)+text(155,137,'エチレン（単量体）')+text(348,84,'→',42)+text(565,80,'［—CH₂—CH₂—］n',29)+text(565,137,'ポリエチレン（重合体）');caption='二重結合の一部が開き、隣の単量体と結合する。nは繰り返し単位の数。';}
else if(id===13){s=text(205,47,'HOOC—C₆H₄—COOH',24)+text(205,81,'テレフタル酸',16)+text(205,115,'＋ HO—CH₂—CH₂—OH',23)+text(205,150,'エチレングリコール',16)+text(432,102,'→',38)+text(612,74,'PET',34)+text(612,114,'＋ 水 H₂O',23)+text(612,155,'小さな分子が生じる',16);caption='反応の概略です（係数を示す反応式ではありません）。生成物は長くつながった高分子です。';}
else if(id===14){const names=['PE','PVC','PP','PS','PET'],uses=['ポリ袋','水道管','保存容器','トレイ','ボトル'];for(let i=0;i<5;i++){let x=30+i*150;s+='<g transform="translate('+x+',35)" stroke="#126355" fill="#e2efe7" stroke-width="3">'+(i===0?'<path d="M20 25V8H40V25H70V8H90V85H20Z"/>':i===1?'<path d="M15 35H75V80H50V58H15Z"/>':i===2?'<rect x="15" y="25" width="90" height="60" rx="9"/><path d="M12 25H108"/>':i===3?'<path d="M10 30H105L90 65H25Z"/>':'<path d="M40 8H65V22L78 35V85H27V35L40 22Z"/>')+'</g>'+text(x+60,150,names[i],20)+text(x+60,178,uses[i],16)}caption='図は代表的な用途の模式イラスト。製品により材質は異なります。';}
else{for(let i=0;i<3;i++)s+='<circle cx="'+(65+i*75)+'" cy="75" r="20" fill="#b9994d"/>';s+=text(145,140,'単量体（モノマー）')+text(340,83,'→',40)+'<path class="chain" d="M410 75H710" stroke="#126355" stroke-width="9" fill="none"/>';for(let i=0;i<6;i++)s+='<circle cx="'+(410+i*60)+'" cy="75" r="20" fill="#126355" stroke="white" stroke-width="3"/>';s+=text(560,140,'重合体（ポリマー）')+text(340,140,'重合',17);caption='単量体が繰り返し結合して、大きな分子になる様子（模式図）。';}
return '<figure class="diagram"><svg viewBox="0 0 780 200" role="img" aria-label="'+esc(caption)+'">'+s+'</svg><figcaption>'+caption+'</figcaption></figure>'}
function openQuestion(i){if(!state)return home();if(!Number.isInteger(i)||i<0||i>=15)return;state.current=i;selected=null;lastWrong=null;message='';showHint=false;screen='question';save();renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){const i=state.current,q=QUESTIONS[i],done=state.done[i];let content='';
if(q.options.length){content='<div class="choices">'+state.order[i].map((o,j)=>'<button class="choice '+(done&&o===q.correct?'good':lastWrong===o?'bad':'')+'" data-answer="'+o+'" '+(done?'disabled':'')+'><b>'+String.fromCharCode(65+j)+'</b><span>'+rich(q.options[o])+(done&&o===q.correct?'　○':'')+'</span></button>').join('')+'</div>'}
else{content='<p class="match-instruction">① 左のカードを選ぶ → ② 対応する右のカードを選ぶ<br><span id="selectionLabel">'+(selected===null?'左のカードを選んでください。':'選択中：'+esc(q.pairs[selected][0]))+'</span></p><div class="matching"><div class="matchcol">'+q.pairs.map((p,j)=>'<button class="pair '+(state.pairs[i][j]?'done':selected===j?'selected':'')+'" data-left="'+j+'" aria-pressed="'+(selected===j)+'" '+(state.pairs[i][j]?'disabled':'')+'>'+(state.pairs[i][j]?'○ ':'')+rich(p[0])+'</button>').join('')+'</div><div class="matchcol">'+state.order[i].map(j=>'<button class="pair '+(state.pairs[i][j]?'done':'')+'" data-right="'+j+'" '+(state.pairs[i][j]?'disabled':'')+'>'+(state.pairs[i][j]?'○ ':'')+rich(q.pairs[j][1])+'</button>').join('')+'</div></div>'}
$('app').innerHTML='<section class="question"><div class="status"><span>出席番号 '+esc(state.id)+' · '+(i<10?'通常の分子':'高分子工房')+'</span><span>全体 '+total()+'/15 確認済み</span></div><div class="bar"><span style="width:'+total()/15*100+'%"></span></div><div class="panel"><p class="kicker">CHECK '+String(i+1).padStart(2,'0')+' / 15</p><h2>'+esc(q.title)+'</h2><p>'+rich(q.prompt)+'</p>'+([12,13].includes(i)?diagram(i):'')+content+'<div class="actions" style="margin-top:18px"><button id="hintBtn">ヒント</button><button id="questionBook">図鑑・用語を見る</button></div>'+(showHint?'<div class="hint">'+rich(q.hint)+'</div>':'')+'<div id="response" aria-live="polite" tabindex="-1">'+(done?'<div class="feedback"><strong>○ バッチリです！</strong><p>'+rich(q.explain)+'</p>'+(q.note?'<p>'+rich(q.note)+'</p>':'')+'</div>':message?'<div class="feedback bad"><strong>× もう一度確認しましょう</strong><p>'+rich(message)+'</p></div>':'')+'</div>'+(done?(q.pairs.length?'<div class="summary-pairs">'+q.pairs.map(p=>'<div>'+rich(p[0])+' → '+rich(p[1])+'</div>').join('')+'</div>':'')+(![12,13].includes(i)?diagram(i):'')+'<button class="primary" id="next">'+(total()===15?'修了証へ →':'次の項目へ →')+'</button>':'')+'</div><div class="actions" style="margin-top:22px"><button id="backList">学習一覧へ</button></div></section>';
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>chooseLeft(Number(b.dataset.left)));
document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>chooseRight(Number(b.dataset.right)));
$('hintBtn').onclick=()=>{showHint=!showHint;renderQuestion()};$('questionBook').onclick=openBook;$('backList').onclick=overview;if(done)$('next').onclick=()=>{if(total()===15)return certificate();let next=state.done.findIndex((x,j)=>!x&&j>i);if(next<0)next=state.done.findIndex(x=>!x);openQuestion(next)}
}
function answer(o){if(screen!=='question')return;const i=state.current,q=QUESTIONS[i];if(state.done[i]||!q.options.length||!Number.isInteger(o)||o<0||o>=q.options.length)return;if(o===q.correct){state.done[i]=true;lastWrong=null;message='';finish()}else{lastWrong=o;message=q.explain}renderQuestion();$('response').focus({preventScroll:true})}
function chooseLeft(j){const i=state.current;if(screen!=='question'||!QUESTIONS[i].pairs[j]||state.pairs[i][j])return;selected=j;message='';renderQuestion()}
function chooseRight(j){const i=state.current,q=QUESTIONS[i];if(screen!=='question'||!q.pairs[j]||state.pairs[i][j])return;if(selected===null){message='先に左側の物質名を選んでください。';renderQuestion();return}if(selected===j){state.pairs[i][j]=true;selected=null;message='';if(state.pairs[i].every(Boolean))state.done[i]=true;finish()}else{message=q.pairs[selected][0]+'には「'+q.pairs[selected][1]+'」が対応します。右のカードを選び直しましょう。'}renderQuestion()}
function openBook(e){bookOpener=e&&e.currentTarget?e.currentTarget:document.activeElement;$('bookBody').innerHTML='<p class="sub">いつでも参照できます。状態は20〜25 ℃・1気圧の目安です。</p>'+[false,true].map(org=>'<h3>'+(org?'有機化合物':'無機物質')+'</h3><div class="catalog">'+MOLECULES.filter(m=>m[2]===org).map(m=>'<article><div class="chem">'+esc(m[1])+'</div><h3>'+esc(m[0])+'</h3><p><span class="chip">'+m[3]+'</span></p><p>'+rich(m[4])+'</p></article>').join('')+'</div>').join('')+'<h2 style="margin-top:28px">高分子の用語</h2><div class="panel"><p><b>単量体（モノマー）</b>：原料となる小さな分子。</p><p><b>重合体（ポリマー）</b>：単量体が多数つながってできた高分子。</p><p><b>重合</b>：単量体から重合体ができる反応。</p><p><b>付加重合</b>：例として、エチレンの二重結合の一部が開いてポリエチレンができる。</p><p><b>縮合重合</b>：水などの小さな分子を生じながら単量体が次々につながる。PETの生成が例。</p><p>デンプン・タンパク質は天然高分子化合物。PE・PETなどは合成高分子化合物です。</p>'+diagram(11)+'</div><h3 style="margin-top:24px">代表的なプラスチック</h3>'+diagram(14)+'<div class="summary-pairs">'+QUESTIONS[14].pairs.map(p=>'<div>'+rich(p[0])+' → '+rich(p[1])+'</div>').join('')+'</div>';$('book').showModal()}
function certificate(){if(!state)return home();if(total()!==15)return overview();finish();screen='certificate';const date=new Date(state.finished).toLocaleDateString('ja-JP');$('app').innerHTML='<section class="certificate"><p class="kicker">CERTIFICATE OF COMPLETION</p><p>分子・高分子　教科書確認</p><h1>修 了 証</h1><div class="seal">全15項目<br>確認修了</div><div class="record"><div><span>出席番号</span><strong class="number">'+esc(state.id)+'</strong></div><div><span>通常の分子</span><strong>10 / 10項目 確認済み</strong></div><div><span>高分子</span><strong>5 / 5項目 確認済み</strong></div><div><span>確認日</span><strong>'+esc(date)+'</strong></div></div><p class="cert-text">通常の分子と高分子に関する<br>全15項目の確認を修了しました。</p><p class="gold">✦ 小さな分子から、身近な世界へ ✦</p><p class="sub">必要に応じて、この修了証をスクリーンショットで<br>撮影して提出してください。</p></section><div class="actions cert-actions noprint"><button class="primary" id="printBtn">印刷・PDF保存</button><button id="certList">確認した項目を見る</button><button id="certBook">図鑑を開く</button><button id="certHome">登録画面へ</button></div>';$('printBtn').onclick=()=>window.print();$('certList').onclick=overview;$('certBook').onclick=openBook;$('certHome').onclick=home;window.scrollTo(0,0)}
$('homeNav').onclick=()=>state?overview():home();$('bookNav').onclick=openBook;$('closeBook').onclick=()=>$('book').close();$('book').addEventListener('close',()=>{if(bookOpener&&bookOpener.isConnected)bookOpener.focus()});home();
</script></body></html>
