 if(invalidSave)return `<section class="panel"><h1>保存記録の確認が必要です</h1><p>このアプリの保存記録は、形式または仕様バージョンが異なるため読み込めません。記録は自動削除していません。</p><p>このアプリの記録だけを初期化すると、新しく始められます。</p>${resetButton()}</section>`;
 return `<section class="panel hero"><div><div class="eyebrow">測定の精度を守る旅</div><h1>有効数字の<br>冒険</h1><p class="lead">数字の意味を見抜き、<br>最後の一桁まで、自分の判断で。</p><div class="pills"><span class="pill">高校1年・既習後演習</span><span class="pill">目安20〜30分</span><span class="pill">56問 ＋ 学習8ステップ</span></div></div>${art}</section><section class="panel"><h2>${state.started?'冒険の続きを始めよう':'冒険の準備'}</h2><p>測定・桁数・積と商・和と差・指数表記を学び、最後は総合ボス戦。暗算できる計算を中心に進みます。</p><label for="number">提出用の出席番号（半角4桁・必須）</label><div style="margin-top:8px"><input id="number" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="例：0123" value="${esc(state.number)}" ${state.started?'readonly':''} autocomplete="off" aria-describedby="numberNote"></div><p id="numberNote" class="muted">開始後は番号を変更できません。別の番号にする場合は「はじめから始める」を使います。</p><p id="formError" role="alert" style="color:var(--red)"></p><div class="actions"><button class="primary" data-action="start">${state.started?'冒険マップへ':'冒険を始める'}</button>${state.started?resetButton():''}</div></section><section class="panel"><h2>冒険と合格のルール</h2><p>各エリアは、本編全問正解で突破。<strong>1問間違えても、最後の復習問題に正解すれば突破できます。</strong>2問間違うか、最後の復習で間違えるとゲームオーバー。このエリア全問に再挑戦します。突破済みエリアは消えません。</p><div class="status"><div class="notice"><strong>通常：HP 2 ／ 誤答 −1</strong><br>ボス：HP 3 ／ 誤答 −2<br>1問誤答ならHPを残して復習へ。<br>HP 0でゲームオーバー。</div><div class="notice"><strong>和と差は専用ページで学習</strong><br>8ステップの学習中は無傷。<br>積・商と異なる計算ルールを勉強します。<br>試練突破で職業昇格と魔法獲得。</div></div><p>ヒントはHP消費なし。「答えを見る」は未正解扱いで、試練ではダメージを受けます。復習で「答えを見る」を使うとゲームオーバーです。</p><p>全64問のうち8問は学習、56問が突破対象。誤答1問は最後の復習で補完します。全6エリア突破で合格。再挑戦・説明の確認で30分を超える場合があります。途中保存できます。</p><p class="muted">合格証をスクリーンショットで撮影して提出してください。未完了は提出不可です。</p></section>`
}
function score(){return state.done.reduce((s,d,i)=>s+(d?AREAS[i].count:0),0)}
function route(){let xy=[[70,144],[235,94],[405,152],[570,80],[735,135],[900,64]];return `<div class="route"><svg viewBox="0 0 980 210" role="img" aria-label="6エリアを順にたどる冒険の道"><path d="M0 190Q130 110 240 170T480 140 730 165 980 120V210H0Z" fill="#14402a"/><path d="M70 144Q145 70 235 94T405 152 570 80 735 135 900 64" stroke="#65b88a" stroke-width="5" stroke-dasharray="8 10" fill="none"/>${xy.map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="24" fill="${state.done[i]?'#3d947b':i===0||state.done[i-1]?'#2a8253':'#153528'}" stroke="${state.done[i]?'#93ebc3':'#8addb0'}" stroke-width="2"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="21" fill="white">${state.done[i]?'✓':i+1}</text><text x="${x}" y="${y+47}" text-anchor="middle" font-size="13" fill="#d6fce5">${['測定','桁数','積と商','和と差','指数','ボス'][i]}</text></g>`).join('')}</svg></div>`}
const bossArt=`<div class="boss-scene"><svg viewBox="0 0 150 140" role="img" aria-label="結晶の鎧をまとった独自デザインの最終ボス"><path d="M25 100L5 50 39 65 27 19 61 44 75 5 91 44 124 19 112 65 145 50 125 100Z" fill="#518a69" stroke="#b6e2cb" stroke-width="2"/><path d="M40 53L75 33 110 53 103 107 75 133 47 107Z" fill="#214935" stroke="#95d6ae" stroke-width="3"/><path d="M50 63L69 71 55 78M100 63L81 71 95 78" fill="#ffdf9a"/><path d="M75 58L87 91 75 111 63 91Z" fill="#9df7b8"/><path d="M75 58V111L87 91Z" fill="#3caa74"/><path d="M42 104L16 126 52 120M108 104L134 126 98 120" fill="#76b391" stroke="#c3ead0" stroke-width="2"/></svg><div><strong>最終ボス戦</strong><p>全分野を見抜く10連戦。<br>誤答の一撃で HP 3 → 1。<br>2回目でゲームオーバー！</p></div></div>`;
function map(){return `<section class="panel"><div class="maphead"><div><div class="eyebrow">ADVENTURE MAP</div><h1 style="font-size:32px;margin-bottom:8px">冒険マップ</h1></div><div class="actions"><button class="small" data-action="home">ホームに戻る</button>${resetButton()}</div></div><div class="hptext"><span>突破 ${state.done.filter(Boolean).length} / 6 エリア</span><span>${score()} / 56問を突破</span></div><div class="bar"><span style="width:${score()/56*100}%"></span></div><p class="progressnote">${state.done.every(Boolean)?'全エリア突破・合格証を提出できます。':'未完了・提出不可。本編と必要時の復習で、全問を習得して突破。'}</p>${state.session?`<div class="notice">${esc(AREAS[state.session.area].name)}の挑戦を保存中。途中から再開できます。<div class="actions"><button class="primary" data-action="resume">保存した挑戦に戻る</button></div></div>`:''}${state.done[3]?'<p>✦ 職業：術士 ／ 魔法「位の灯」を習得済み</p>':''}${route()}${state.done[2]&&!state.session?'<div class="actions"><button class="small" data-action="study">和と差の学習ページへ</button></div>':''}</section><div class="grid">${AREAS.map((a,i)=>{let unlock=i===0||state.done[i-1],done=state.done[i];return `<section class="panel area ${!unlock?'locked':''} ${done?'done':''}"><span class="badge">${a.icon}</span><div class="eyebrow">AREA 0${i+1} ${done?'／ ○ 突破':''}</div><h2>${a.name}</h2><p class="muted">${a.desc}</p><p>${i===3?'学習8ステップ ＋ 試練6問':a.count+'問'} ／ ${i===5?'HP3・誤答−2':'HP2・誤答−1'}</p><small>挑戦回数 ${state.attempts[i]}${!unlock?' ／ 前のエリア突破で解放':''}</small><div class="actions"><button ${!unlock||!!state.session?'disabled':''} class="${!done?'primary':''}" data-action="area" data-area="${i}">${done?'もう一度練習する':i===3&&!state.training?'教わってから挑戦':'このエリアに挑む'}</button></div></section>`}).join('')}</div>${state.done.every(Boolean)?'<div class="actions"><button class="primary" data-action="result">合格証を表示する</button></div>':''}`}
function begin(area,practice=false){
 if(state.session||area>0&&!state.done[area-1])return;
 if(area===3&&!state.training)practice=true;
 let ids=BANK.filter(q=>q.area===area&&q.practice===practice).map(q=>q.id);
 if(!practice)state.attempts[area]++;
 state.session={area,practice,order:practice?ids:shuffle(ids),pos:0,hp:area===5?3:2,mistakes:0,magicUsed:false,finished:false,passed:false,records:{},phase:'main',reviewId:null,reviewRecord:null,recovered:false,lessonStarted:!practice};
 state.view=practice?'learning':'question';commit();window.scrollTo(0,0)
}
function record(){let q=currentQ(),a=state.session;if(a.phase==='review'){if(!a.reviewRecord)a.reviewRecord=emptyRecord(q);return a.reviewRecord}if(!a.records[q.id])a.records[q.id]=emptyRecord(q);return a.records[q.id]}
function diagram(q){
 if(q.diagram==='ruler'){let ticks='';for(let i=0;i<=30;i++){let x=40+i*12;ticks+=`<line x1="${x}" y1="100" x2="${x}" y2="${i%10===0?145:i%5===0?135:123}" stroke="#263f64" stroke-width="${i%10===0?2:1}"/>`;if(i%10===0)ticks+=`<text x="${x}" y="165" text-anchor="middle" font-size="15">${i/10}</text>`}return `<figure class="diagram"><svg viewBox="0 0 450 190" role="img" aria-label="最小目盛り0.1cmのものさしと物体AB。左端は0、右端は2.2と2.3の間の約7割の位置"><rect x="40" y="48" width="272.4" height="50" fill="#82a2b6" stroke="#29445f"/><text x="40" y="35">A</text><text x="310" y="35">B</text><line x1="40" y1="100" x2="400" y2="100" stroke="#263f64"/>${ticks}<text x="417" y="165">cm</text></svg><figcaption>左端Aは0。最小目盛りは0.1 cm。右端Bを目分量で読む。</figcaption></figure>`}
 if(q.diagram?.startsWith('rect:')){let [,a,b]=q.diagram.split(':');return `<figure class="diagram"><svg viewBox="0 0 430 210" role="img" aria-label="縦${a}cm、横${b}cmの長方形。図の比率は実寸とは異なる"><rect x="110" y="25" width="235" height="120" rx="4" fill="#cbdcf1" stroke="#496694" stroke-width="3"/><text x="90" y="90" text-anchor="end" font-size="16">${a} cm</text><text x="227" y="180" text-anchor="middle" font-size="18">${b} cm</text></svg><figcaption>模式図（縦横の比率は実寸とは異なります）</figcaption></figure>`}
 if(q.diagram==='place'&&q.id==='q34')return `<div class="diagram"><p style="text-align:center;margin:0">5.0 − 4.8 = 0.2<br>どちらの測定値も小数第1位まで</p></div>`;
 if(q.diagram==='place')return `<div class="diagram"><table class="place" aria-label="12.3と2.15の小数点をそろえた引き算"><tr><td></td><td>1</td><td>2</td><td>.</td><td class="last">3</td><td></td></tr><tr><td>−</td><td></td><td>2</td><td>.</td><td>1</td><td>5</td></tr><tr><td></td><td colspan="5" style="font-size:14px">小数点をそろえて比べる</td></tr></table><p style="margin:0;text-align:center;font-size:14px">色枠：12.3で最後に記録した位</p></div>`;
 return '';
}
function formatScientific(s){return esc(s).replace(/10\^(-?\d+)/g,'10<sup>$1</sup>')}
function choices(q,r){
 if(q.kind==='scientific'){
 let parsed=q.options.map(o=>o.text.split(' × 10^')),coeffs=[...new Set(parsed.map(x=>x[0]))],exps=[...new Set(parsed.map(x=>x[1]))];
 // Independent controls: coefficient precision and exponent are both assessed.
 return `<p class="muted">係数と指数をそれぞれ選ぶ。末尾の0も区別します。</p><div class="science"><label> <span class="hidden">係数A</span><select id="coeff" aria-label="係数A" ${r.graded?'disabled':''}><option value="">係数A</option>${shuffleStable(coeffs,r.options,q,'c').map(c=>`<option value="${c}" ${r.coeff===c?'selected':''}>${c}</option>`).join('')}</select></label><span>× 10</span><label class="exp"><span class="hidden">指数B</span><select id="exponent" aria-label="指数B" ${r.graded?'disabled':''}><option value="">指数B</option>${shuffleStable(exps,r.options,q,'e').map(e=>`<option value="${e}" ${r.exponent===e?'selected':''}>${e}</option>`).join('')}</select></label></div>`
 }
 return `<div class="answers ${q.kind==='digits'?'digits':''}" role="group" aria-label="解答候補">${r.options.map((id,i)=>{let o=q.options.find(x=>x.id===id);return `<button class="answer ${r.selected===id?'selected':''} ${r.graded&&id===q.correct?'correct':''} ${r.graded&&r.selected===id&&!r.correct?'wrong':''}" data-action="select" data-option="${id}" aria-pressed="${r.selected===id}" ${r.graded?'disabled':''}><span class="key">${i+1}</span><span>${formatScientific(o.text)}</span></button>`}).join('')}</div>`
}
function shuffleStable(values,order,q,type){let ids=order.map(id=>q.options.findIndex(x=>x.id===id));return [...values].sort((a,b)=>{let ap=q.options.findIndex(o=>o.text.split(' × 10^')[type==='c'?0:1]===a),bp=q.options.findIndex(o=>o.text.split(' × 10^')[type==='c'?0:1]===b);return ids.indexOf(ap)-ids.indexOf(bp)})}
function question(){
 let a=state.session,q=currentQ(),r=record(),max=a.area===5?3:2,graded=Object.values(a.records).filter(x=>x.graded).length,correct=Object.values(a.records).filter(x=>x.correct).length,review=a.phase==='review';
 let progress=a.practice?`学習 STEP ${a.pos+1} / ${a.order.length}`:review?'本編終了 ／ 復習 1問':`本編 ${a.pos+1} / ${a.order.length}問`;
 let notice=a.practice?'一つずつ学ぼう。間違えてもHPは減りません。':review?'この復習に正解すればエリア突破。誤答するとHP0。':a.mistakes===1?'まだ突破できます。最後に、この誤答の復習問題が出ます。':'全問正解、または1問誤答＋最後の復習正解で突破。';
 return `<div class="question ${a.practice?'learning-page':''}">${a.area===5?bossArt:''}<section class="panel"><div class="topline"><div><div class="eyebrow">${a.practice?'LEARNING PAGE · 学習ページ':review?'REVIEW · 挽回のチャンス':a.area===5?'FINAL BOSS · 誤答で大ダメージ':'AREA 0'+(a.area+1)}</div><strong>${AREAS[a.area].icon} ${AREAS[a.area].name}</strong></div><button class="small" data-action="home">ホームに戻る</button></div><div class="status"><div><div class="hptext"><strong>${a.practice?'学習中・ダメージなし':a.area===5?'ボスの猛攻に備えよう':'冒険者のHP'}</strong><span>HP <b id="hpValue">${a.hp}</b> / ${max}</span></div><div role="progressbar" aria-label="HP" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${a.hp}" class="bar hpbar ${a.hp<=1?'low':''}"><span id="hpFill" style="width:${a.hp/max*100}%"></span></div><small>${a.practice?'安心して、考え方を学ぼう。':`誤答・答えを見る：−${a.area===5?2:1} HP`}</small></div><div><div class="hptext"><span>${progress}</span><span>${a.practice?'':`本編正解 ${correct}/${a.order.length}`}</span></div><div class="bar"><span style="width:${graded/a.order.length*100}%"></span></div><small>${notice}</small></div></div></section><section class="panel" id="questionPanel"><div class="eyebrow">${a.practice?'学習 STEP '+q.step+' / 8':review?'間違えた問題の復習':'QUESTION '+String(a.pos+1).padStart(2,'0')}</div>${a.practice?`<div class="lesson"><strong>ここで学ぶこと</strong><p>${esc(q.lesson)}</p></div>`:''}${review?'<div class="review-banner"><strong>まだクリアできます。</strong><br>本編で間違えた内容を、もう一度確かめよう。<br>この1問に正解すれば突破。間違えるとHP0です。</div>':''}<h2>${esc(q.prompt)}</h2>${q.condition?`<aside class="condition">授業での考え方：${esc(q.condition)}</aside>`:''}${a.practice?learningDiagram(q):diagram(q)}${choices(q,r)}${!r.graded?`<div class="actions"><button class="primary" data-action="grade" ${q.kind==='scientific'?r.coeff&&r.exponent?'':'disabled':r.selected?'':'disabled'}>答え合わせ</button><button data-action="hint" ${r.hints===2?'disabled':''}>ヒント ${r.hints}/2</button><button class="small" data-action="reveal">答えを見る</button></div>${state.done[3]?`<div class="actions"><button class="small" data-action="magic" ${a.magicUsed?'disabled':''}>✦ 位の灯 ${a.magicUsed?'使用済み':'この挑戦で1回'}</button></div>`:''}`:''}${r.magic?`<aside class="hintbox"><strong>✦ 魔法「位の灯」</strong><p>${esc(q.magic||'測定値の末尾の位を見よう。積・商は有効数字の個数、和・差は末尾の位を比べる。')}</p></aside>`:''}${r.hints&&!r.graded?hintHTML(q,r.hints):''}${r.graded?`<div class="feedback ${r.correct?'':'bad'}" id="feedback" role="status"><h3>${r.revealed?'◇ 答えを確認':r.correct?'○ 正解':'× 不正解'}</h3><p><strong>正答：${formatScientific(correctText(q))}</strong></p>${!r.correct&&!r.revealed?`<p>あなたの解答：${q.kind==='scientific'?formatScientific(r.coeff+' × 10^'+r.exponent):formatScientific(q.options.find(x=>x.id===r.selected)?.text||'')}。下の説明で考え方を確認しましょう。</p>`:''}<p>${esc(q.explanation)}</p>${!a.practice&&!r.correct?`<p><strong>−${a.area===5?2:1} HP${a.hp===0?' ／ HP 0・ゲームオーバー':''}</strong><br>${a.hp===0?'このエリア全問に再挑戦します。':'まだ突破できます。エリア最後の復習に正解して挽回しよう。'}</p>`:review&&r.correct?'<p><strong>復習で正解！ 本編の誤答を補完できました。</strong><br>次のボタンで突破結果へ進みます。</p>':''}${hintHTML(q,2)}<div class="actions"><button class="primary" data-action="next">${nextLabel(a)}</button></div></div>`:''}</section>${calculator()}</div>`
}
function hintHTML(q,n){return `<aside class="hintbox"><strong>考え方のヒント</strong>${q.hints.slice(0,n).map((h,i)=>`<p>${i+1}. ${esc(h)}</p>`).join('')}</aside>`}
function grade(reveal=false){
 let a=state.session,q=currentQ(),r=record();if(r.graded)return;
 if(!reveal&&q.kind==='scientific'){if(!r.coeff||!r.exponent)return;r.selected=q.options.find(x=>x.text===r.coeff+' × 10^'+r.exponent)?.id||'combination'}
 if(!reveal&&!r.selected)return;
 let hpBefore=a.hp;r.graded=true;r.revealed=reveal;r.correct=!reveal&&r.selected===q.correct;
 if(a.phase==='review')a.recovered=r.correct;
 else if(!r.correct)a.mistakes++;
 if(!r.correct&&!a.practice)a.hp=Math.max(0,a.hp-(a.area===5?2:1));
 save();render();
 if(!r.correct&&!a.practice){let fill=document.getElementById('hpFill');fill.style.transition='none';fill.style.width=hpBefore/(a.area===5?3:2)*100+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!fill.isConnected)return;fill.style.transition='width .18s ease-out';fill.style.width=a.hp/(a.area===5?3:2)*100+'%'}));document.querySelector('.question').classList.add('loss');document.querySelector('.hpbar').classList.add('hit')}
 if(r.correct){document.getElementById('questionPanel').classList.add('success');confetti(10)}
 document.getElementById('feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){
 let a=state.session,r=record();if(!r.graded)return;
 if(a.hp===0&&!a.practice){a.finished=true;state.view='end'}
 else if(a.phase==='review'){if(r.correct)completeArea()}
 else if(a.pos<a.order.length-1){a.pos++}
 else if(a.practice){state.training=true;state.session=null;save();begin(3,false);return}
 else if(a.mistakes===1){a.phase='review';a.reviewId=a.order.find(id=>!a.records[id].correct);a.reviewRecord=null}
 else if(a.mistakes===0)completeArea();
 commit();window.scrollTo(0,0)
}
function end(){let a=state.session,passed=a.passed,correct=Object.values(a.records).filter(r=>r.correct).length;
 return `<section class="panel ${passed?'success':''}" style="max-width:760px;margin:auto;text-align:center"><div class="crest">${passed?'✦':'⚔'}</div><div class="eyebrow">${AREAS[a.area].name}</div><h1 style="font-size:36px">${passed?'○ エリア突破':'× GAME OVER'}</h1><p>${passed?a.recovered?'最後の復習に正解！ 誤答を補完してエリア突破です。':'本編を全問正解！ エリア突破です。':'HPが0になりました。このエリア全問に再挑戦しよう。'}</p><p>本編：${correct} / ${a.order.length}問正解${a.phase==='review'?` ／ 復習：${a.recovered?'○ 正解':'× 未正解'}`:''}<br>残りHP ${a.hp} ／ 全体 ${score()} / 56問を突破</p>${!passed?`<div class="notice">未完了・提出不可。<br>再挑戦はこのエリア全${a.order.length}問です。<br>本編全問正解、または1問誤答＋最後の復習正解で突破できます。</div>`:''}${passed&&a.area===3?'<div class="lesson"><h2>✦ 職業昇格：見習い → 術士</h2><p>魔法「位の灯」を習得！ 各挑戦で1回、測定値の末尾の位や判断の手掛かりを照らします。HPは消費しません。</p></div>':''}${passed&&a.area<5?`<p class="lead">次のエリア「${AREAS[a.area+1].name}」が解放されました。</p>`:''}<div class="actions" style="justify-content:center">${!passed?'<button class="primary" data-action="retry">エリア全問に再挑戦</button>':a.area===5?'<button class="primary" data-action="finish">合格証へ</button>':'<button class="primary" data-action="mapClear">冒険マップへ</button>'}<button data-action="home">ホームに戻る</button>${resetButton()}</div></section>`
}
function result(){return `<section class="panel certificate"><div class="eyebrow">CERTIFICATE OF ACHIEVEMENT</div><div class="crest">✧ ♜ ✧</div><h1>○ 合格</h1><h2>有効数字の冒険<br>全領域修了証</h2><p>測定の意味を理解し、<br>計算の最後の一桁まで守り抜きました。</p><div class="certgrid"><div>出席番号<strong>${state.number}</strong></div><div>到達得点<strong>56 / 56</strong></div><div>到達正答率<strong>100%</strong></div><div>合格日<strong style="font-size:19px">${esc(state.certificateDate)}</strong></div></div><p>称号：精度を守る術士<br>全6エリア突破・全問の習得を確認</p><p class="muted">得点は突破済みの試練56問（復習での補完を含む）。初回正答率ではありません。<br>ヒント使用：${state.hints}回 ／ 試練挑戦：${state.attempts.reduce((a,b)=>a+b,0)}回</p><div class="notice"><strong>この合格証をスクリーンショットで撮影して提出してください。</strong></div></section><div class="actions"><button data-action="home">ホームに戻る</button><button data-action="mapClear">冒険マップへ</button>${resetButton()}</div>`}
function calculator(){return `<details class="calc"><summary>計算機を開く・履歴を見る</summary><div class="calcpad"><label for="calcOut">計算式</label><input class="calcout" id="calcOut" value="${esc(calcExpr)}" readonly placeholder="ボタンで入力"><div class="calckeys">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')','C','⌫','=','+'].map(k=>`<button data-action="calc" data-key="${k}">${k}</button>`).join('')}</div><p class="muted" style="font-size:13px">計算機は丸める前の値を表示します。有効数字は自分で判断しよう。</p><div class="history" id="calcHistory">${state.history.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div></details>`}
function calc(k){if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){let clean=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[\d.()+*/\- ]+$/.test(clean))return;try{let value=Function('"use strict";return ('+clean+')')();if(!Number.isFinite(value))throw Error();let line=calcExpr+' = '+Number(value.toPrecision(12));state.history.unshift(line);state.history=state.history.slice(0,20);calcExpr=String(Number(value.toPrecision(12)));save();document.getElementById('calcHistory').innerHTML=state.history.map(x=>`<div>${esc(x)}</div>`).join('')}catch(e){document.getElementById('calcOut').value='式を確認してください';return}}else if(calcExpr.length<70)calcExpr+=k;document.getElementById('calcOut').value=calcExpr}
function confetti(n=24){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let host=document.querySelector('.certificate')||document.getElementById('questionPanel');if(!host)return;let div=document.createElement('div');div.className='sparkles';div.setAttribute('aria-hidden','true');for(let i=0;i<n;i++){let el=document.createElement('i');el.style.left=Math.random()*100+'%';el.style.background=['#f8d77a','#9de2d9','#c9b1ff'][i%3];el.style.animationDelay=Math.random()*.3+'s';div.append(el)}host.append(div);setTimeout(()=>div.remove(),2800)}
function render(){app.innerHTML=header()+(state.view==='home'?home():state.view==='map'?map():state.view==='learning'?learningIntro():state.view==='question'?question():state.view==='end'?end():result())+'<footer class="foot">有効数字の冒険 · 途中保存はこの端末・このブラウザ内<br>授業ノートをもとに構成した独自教材</footer>';if(state.view==='question')save()}
function emptyRecord(q){return {options:shuffle(q.options.map(x=>x.id)),selected:null,coeff:'',exponent:'',graded:false,correct:false,revealed:false,hints:0,magic:false}}
function learningIntro(){return `<section class="panel learning-intro"><div class="eyebrow">LEARNING PAGE · ここからは学習ページ</div><span class="learning-label">HPは減りません ／ 8ステップ</span><h1>和と差の計算を<br>ここで勉強します。</h1><p class="lead"><strong>これまでの積と商と、これからの和と差では、<br>有効数字の取り扱い（計算方法）が違います。</strong></p><div class="rule-compare"><div><small>これまで：掛け算・割り算</small><h2>有効数字の「個数」</h2><p>個数が少ない方にそろえる。</p></div><div class="new-rule"><small>これから：足し算・引き算</small><h2>末尾の数字の「位」</h2><p>末尾の位が高い方に、<br>答えの末尾の位をそろえる。</p></div></div><p>「末尾」とは、いちばん右にある数字です。<br>「位が高い」とは、より左の位のこと。<strong>1の位 → 0.1の位 → 0.01の位</strong>の順に位が下がります。</p><div class="notice">12.3 cm − 2.15 cm を使い、<br>①それぞれの末尾の位 → ②高いのはどちら？ → ③計算の答えをどう書く？<br>と、一つずつ考えます。</div><p class="muted">ここは学ぶためのページです。間違えてもHPは減りません。説明を読んでから、次のステップへ進みましょう。最後の試練を突破すると、術士への昇格と魔法が待っています。</p><div class="actions"><button class="primary" data-action="learnStart">学習を始める</button><button data-action="home">ホームに戻る</button></div></section>`}
function learningDiagram(q){
 let step=q.step;
 if(step>=7)return `<div class="learning-memory"><strong>ここまでの学習メモ</strong><p>積・商は「有効数字の個数」。<br>和・差は「末尾の位」を高い方にそろえる。</p></div>`;
 let row=(prefix,int,dec,mark)=>`<tr><td>${prefix}</td><td>${int}</td><td>.</td>${dec.split('').map((x,i)=>`<td class="${i===mark?'last':''}">${x}</td>`).join('')}${dec.length===1?'<td class="empty-place"></td>':''}</tr>`;
 return `<div class="diagram learning-figure"><p class="expression">12.3 cm − 2.15 cm${step>=5?' = 10.15 cm':''}</p><table class="place" aria-label="小数点をそろえた引き算。12.3の末尾は3、2.15の末尾は5">${row('','12','3',step===1?0:-1)}${row('−','2','15',step===2?1:-1)}</table><div class="place-key">末尾 ＝ いちばん右にある数字</div></div>${step>1?`<div class="learning-memory"><strong>前のステップで確かめたこと</strong><p>12.3 cmの末尾の3 → <b>0.1 cmの位</b>${step>2?'<br>2.15 cmの末尾の5 → <b>0.01 cmの位</b>':''}${step>3?'<br>高い方は <b>0.1 cmの位</b> → 答えもこの位まで':''}${step>5?'<br>10.15の小数第2位の5を見て、四捨五入する':''}</p></div>`:''}`
}
function nextLabel(a){if(a.hp===0&&!a.practice)return 'ゲームオーバー画面へ';if(a.phase==='review')return '復習の結果へ';if(a.pos===a.order.length-1)return a.practice?'学習を終えて試練へ':a.mistakes===1?'最後の復習問題へ':'突破結果へ';return a.practice?'次の学習ステップへ':'次の問題へ'}
function completeArea(){let a=state.session;a.passed=true;a.finished=true;state.done[a.area]=true;if(state.done.every(Boolean)&&!state.certificateDate)state.certificateDate=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());state.view='end'}
app.addEventListener('change',e=>{if(['coeff','exponent'].includes(e.target.id)){let r=record();if(r.graded)return;r[e.target.id]=e.target.value;save();let open=document.querySelector('.calc')?.open;render();if(open)document.querySelector('.calc').open=true}});
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let action=b.dataset.action;
 if(action==='reset'){document.getElementById('resetDialog').showModal();return}
 if(action==='motion'){matrixPaused=!matrixPaused;document.body.classList.toggle('motion-paused',matrixPaused);render();return}
 if(action==='migrationOK'){state.migrated=false;commit()}
 if(action==='start'){if(!state.started){let number=document.getElementById('number').value.trim();if(!/^\d{4}$/.test(number)){document.getElementById('formError').textContent='出席番号を半角数字4桁で入力してください。';document.getElementById('number').focus();return}state.number=number;state.started=true}state.view='map';commit()}
 if(action==='home'){state.view='home';commit()}
 if(action==='resume'){state.view=state.session.finished?'end':state.session.practice&&!state.session.lessonStarted?'learning':'question';commit()}
 if(action==='area')begin(Number(b.dataset.area));
 if(action==='study')begin(3,true);
 if(action==='learnStart'){state.session.lessonStarted=true;state.view='question';commit()}
 if(action==='select'){let r=record();if(!r.graded){r.selected=b.dataset.option;commit()}}
 if(action==='grade')grade();
 if(action==='reveal')grade(true);
 if(action==='hint'){let r=record();if(r.hints<2){r.hints++;state.hints++;commit()}}
 if(action==='magic'){let a=state.session;if(!a.magicUsed&&state.done[3]){a.magicUsed=true;record().magic=true;commit()}}
 if(action==='next')next();
 if(action==='retry'){let area=state.session.area;state.session=null;begin(area)}
 if(action==='mapClear'){if(state.view==='end'||state.view==='result')state.session=null;state.view='map';commit()}
 if(action==='finish'){state.session=null;state.view='result';commit();confetti(45)}
 if(action==='result'){state.view='result';commit();confetti(45)}
 if(action==='calc')calc(b.dataset.key);
 if(['home','start','mapClear','finish','result','resume','learnStart'].includes(action))window.scrollTo(0,0)
});
document.getElementById('cancelReset').onclick=()=>document.getElementById('resetDialog').close();
document.getElementById('confirmReset').onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY)}catch(e){saveError=true}state=fresh();invalidSave=false;calcExpr='';document.getElementById('resetDialog').close();commit();window.scrollTo(0,0)};
function setupMatrix(){
 const canvas=document.getElementById('matrixCanvas'),ctx=canvas.getContext('2d');if(!ctx)return;let width=0,height=0,columns=[],last=0;
 function resize(){width=innerWidth;height=innerHeight;let scale=Math.min(devicePixelRatio||1,1.5);canvas.width=width*scale;canvas.height=height*scale;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(scale,0,0,scale,0,0);columns=Array.from({length:Math.ceil(width/19)},(_,i)=>({x:i*19,y:Math.random()*height,speed:2+Math.random()*6,length:13+Math.floor(Math.random()*17)}));paintStatic()}
 function glyph(x,y,alpha,head=false){ctx.font=(head?'19':'15')+'px ui-monospace, monospace';ctx.fillStyle=head?'rgba(181,255,221,'+alpha+')':'rgba(20,220,119,'+alpha+')';ctx.fillText(String(Math.floor(Math.random()*10)),x,y)}
 function paintStatic(){ctx.fillStyle='#020b07';ctx.fillRect(0,0,width,height);for(let c of columns)for(let y=0;y<height;y+=21)glyph(c.x,y,Math.random()*.42+.07);for(let i=0;i<width/100;i++){ctx.font='38px ui-monospace,monospace';ctx.fillStyle='#24e78c55';ctx.fillText(String(Math.floor(Math.random()*10)),Math.random()*width,Math.random()*height)}}
 function frame(t){if(!matrixPaused&&!document.hidden&&t-last>50){ctx.fillStyle='rgba(2,11,7,.16)';ctx.fillRect(0,0,width,height);for(let c of columns){glyph(c.x,c.y,.8,true);glyph(c.x,c.y-21,.4);c.y+=c.speed*3;if(c.y>height+40)c.y=-Math.random()*height*.4}last=t}requestAnimationFrame(frame)}
 resize();addEventListener('resize',resize);requestAnimationFrame(frame)
}
setupMatrix();

if(matrixPaused)document.body.classList.add('motion-paused');
render();
</script></body></html>
